<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="micro:bit+">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b3b3"/>
      <stop offset="1" stop-color="#007a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="372" fill="url(#bg)"/>
  <rect width="600" height="372" fill="url(#glow)"/>
  <!-- micro:bit 5x5 LED matrix motif -->
  <g transform="translate(180,70)">
    <g fill="#fff2b0">
      <rect x="0"   y="0"  width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="52"  y="0"  width="34" height="34" rx="6"/>
      <rect x="104" y="0"  width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="156" y="0"  width="34" height="34" rx="6"/>
      <rect x="208" y="0"  width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="0"   y="52" width="34" height="34" rx="6"/>
      <rect x="52"  y="52" width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="104" y="52" width="34" height="34" rx="6"/>
      <rect x="156" y="52" width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="208" y="52" width="34" height="34" rx="6"/>
      <rect x="0"   y="104" width="34" height="34" rx="6" opacity="0.35"/>
      <rect x="52"  y="104" width="34" height="34" rx="6"/>
      <rect x="104" y="104" width="34" height="34" rx="6"/>
      <rect x="156" y="104" width="34" height="34" rx="6"/>
      <rect x="208" y="104" width="34" height="34" rx="6" opacity="0.35"/>
    </g>
  </g>
  <text x="300" y="300" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="700" text-anchor="middle" fill="#ffffff">micro:bit<tspan fill="#fff2b0">+</tspan></text>
</svg>
