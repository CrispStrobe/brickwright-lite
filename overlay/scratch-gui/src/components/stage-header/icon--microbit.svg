<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Simplified micro:bit shape: board + 5x5 LED grid + two buttons -->
  <rect x="1" y="4" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- LED grid (3x3 simplified) -->
  <rect x="7" y="7" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="9.4" y="7" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="11.8" y="7" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="7" y="9.4" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="9.4" y="9.4" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="11.8" y="9.4" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="7" y="11.8" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="9.4" y="11.8" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <rect x="11.8" y="11.8" width="1.2" height="1.2" rx="0.3" fill="currentColor"/>
  <!-- Buttons A and B -->
  <circle cx="4" cy="10" r="1.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="16" cy="10" r="1.5" fill="none" stroke="currentColor" stroke-width="1"/>
</svg>
