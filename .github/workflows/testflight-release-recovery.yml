name: TestFlight release metadata recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Audit first; recover only the existing uploaded 0.1.26 release.
        type: choice
        required: true
        default: audit
        options:
          - audit
          - recover

permissions:
  contents: read

concurrency:
  group: testflight-026-metadata-recovery
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recovery
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/testflight-release-recovery.mjs
            /scripts/lib/testflight-release-state.mjs
            /scripts/lib-appstore.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v0.1.26
          path: release
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/tauri/src-tauri/tauri.conf.json
            /docs/app-store-metadata.md
            /scripts/push-tester-notes.mjs
            /scripts/testflight-submit.mjs
            /scripts/lib-appstore.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit or recover existing release metadata
        env:
          RECOVERY_ACTION: ${{ inputs.action }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node recovery/scripts/testflight-release-recovery.mjs --action "$RECOVERY_ACTION" --release-dir release
