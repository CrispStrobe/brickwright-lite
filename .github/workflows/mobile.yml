                  parsed = json.loads(inventory, object_pairs_hook=unique,
                      parse_constant=lambda _: need(False))
                  value['refusal'] = 'runtime-selection'
                  runtimes = parsed['runtimes']
                  need(type(runtimes) is list and len(runtimes) <= 128)
                  runtime, = [r for r in runtimes if r.get('identifier') == requested]
                  need(runtime.get('isAvailable') is True and not runtime.get('availabilityError'))
                  need(runtime['buildversion'] == build and version(runtime['version']) >= minimum)
                  need(version(requested.rsplit('.iOS-', 1)[1].replace('-', '.')) == version(runtime['version']))
                  value.update(status='runtime-candidate-only-launch-refused', refusal='device-resource-launch-admission-required',
                      commit=manifest['commit'], tree=manifest['tree'], runID=manifest['runID'],
