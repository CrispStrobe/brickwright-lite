name: mobile

on:
  workflow_dispatch:
    inputs:
      sign_ios:
        description: >-
          Also build a SIGNED iOS IPA. Off by default because it talks to
          App Store Connect and will create/download an Apple signing
          certificate and provisioning profile for the team.
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web bundle (vendor + integrate + webpack)
        run: bash scripts/vercel-build.sh || (echo "retrying web build" && bash scripts/vercel-build.sh)
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: packages/scratch-gui/build
          retention-days: 3

  android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build Android APK (debug, unsigned)
        working-directory: apps/tauri
        run: |
          npx tauri android init --ci
          # tauri-plugin-blec's Android library requires minSdk 26; the generated
          # project defaults to 24, which fails the manifest merge.
          sed -i 's/minSdk = 24/minSdk = 26/' src-tauri/gen/android/app/build.gradle.kts
          # Allow cleartext ws:// to LAN bridge servers (bridge-mode hardware
          # over WiFi). The manifest ships a ${usesCleartextTraffic} placeholder.
          sed -i 's/${usesCleartextTraffic}/true/' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Camera + microphone for getUserMedia (Video Sensing, loudness, record
          # a sound). MODIFY_AUDIO_SETTINGS is required or the WebView gets the mic
          # grant but still fails with NotReadableError. Features are required=false
          # so devices without a camera can still install.
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          # Request the runtime camera/mic permissions on launch (Tauri never does).
          cp android-overlay/MainActivity.kt \
            src-tauri/gen/android/app/src/main/java/com/crispstrobe/brickwright/MainActivity.kt
          npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: brickwright-android-apk
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      # On a tag, attach the APK to the same draft GitHub Release the desktop
      # bundles go to (release.yml), so all platforms appear together.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    needs: build-web
    runs-on: macos-latest
    # Simulator-only, so no Apple signing certificate or developmentTeam is
    # needed. A real-device/TestFlight build still would be. This job is
    # blocking: it used to be continue-on-error, which hid a genuine link
    # failure (missing ExternalAccessory) for a month.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      # Frameworks come from bundle.iOS.frameworks in tauri.conf.json, and the
      # iOS-only Info.plist keys (ATS local networking, MFi accessory protocols,
      # camera/mic/speech usage strings) from src-tauri/Info.ios.plist — both
      # survive project regeneration, so there is nothing to patch here. Anything
      # this step would have to fix up belongs in one of those two files instead,
      # or local builds silently differ from CI.
      - name: Build iOS app (simulator, unsigned)
        working-directory: apps/tauri
        run: |
          npx tauri ios init --ci
          # PrivacyInfo.xcprivacy has no tauri.conf equivalent, so it is patched
          # straight into the generated pbxproj. Deliberately NOT via project.yml
          # + `xcodegen generate`: regenerating discards the signing settings the
          # tauri CLI writes into the pbxproj, which breaks the signed job.
          node scripts/patch-ios-privacy.mjs
          npx tauri ios build --target aarch64-sim

      # Guard the two things that were silently missing before: the frameworks
      # Xcode must link itself (Rust's autolink hints are dropped for staticlibs)
      # and the merged Info.plist keys. Cheap, and fails loudly rather than
      # producing an app that dies on first BLE or camera use.
      - name: Verify frameworks and Info.plist made it into the app
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          PROJ=src-tauri/gen/apple/project.yml
          for fw in CoreBluetooth ExternalAccessory; do
            grep -q "$fw.framework" "$PROJ" || { echo "::error::$fw.framework missing from $PROJ"; exit 1; }
          done
          APP=$(find src-tauri/gen/apple/build -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          # Apple requires the privacy manifest at the bundle ROOT, not nested.
          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the app bundle root"; exit 1; }
          PLIST="$APP/Info.plist"
          for key in NSAppTransportSecurity UISupportedExternalAccessoryProtocols \
                     NSBluetoothAlwaysUsageDescription NSCameraUsageDescription \
                     NSMicrophoneUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1 \
              || { echo "::error::$key missing from the built app's Info.plist"; exit 1; }
          done
          echo "frameworks + Info.plist keys present in $APP"

      - uses: actions/upload-artifact@v4
        with:
          name: brickwright-ios-sim
          path: apps/tauri/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 7

  # Signed, App-Store-shaped IPA. Opt-in — runs on a version tag, or on a manual
  # dispatch with sign_ios=true.
  #
  # MANUAL signing: the tauri CLI reads IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD
  # / IOS_MOBILE_PROVISION itself, imports the cert into a temporary keychain,
  # installs the profile, and sets CODE_SIGN_STYLE=Manual +
  # PROVISIONING_PROFILE_SPECIFIER + a matching ExportOptions.plist. That avoids
  # automatic provisioning entirely, which is what previously failed: `tauri ios
  # build` runs -exportArchive WITHOUT the -authenticationKey* flags, so the
  # export could not talk to Apple ("No Accounts" / "No profiles ... were found")
  # no matter what the archive step had cached.
  #
  # The Apple Distribution identity is shared between macOS and iOS, so the
  # existing MACOS_CERT_P12 is reused rather than storing a second copy.
  ios-signed:
    needs: build-web
    if: ${{ github.event_name == 'push' || inputs.sign_ios }}
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: N9XSJ4M3GT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build signed IPA
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          for v in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            [ -n "${!v:-}" ] || { echo "::error::$v is not set — cannot sign."; exit 1; }
          done

          npx tauri ios init --ci
          node scripts/patch-ios-privacy.mjs

          # The CLI's IOS_* variables import the certificate but do not touch the
          # Xcode project, so install the profile where Xcode looks for it and
          # point the project at it by name.
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/app.plist")
          NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/app.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFDIR/$UUID.mobileprovision"
          echo "installed provisioning profile '$NAME' ($UUID)"

          node scripts/patch-ios-signing.mjs "$APPLE_DEVELOPMENT_TEAM" "$NAME"

          npx tauri ios build --export-method app-store-connect

      - name: Verify the IPA is really signed
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "IPA: $IPA"
          WORK=$(mktemp -d); unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the IPA"; exit 1; }
          [ -f "$APP/embedded.mobileprovision" ] \
            || { echo "::error::no embedded provisioning profile — the app is not distribution-signed"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "signed, privacy manifest present, profile embedded"
          echo "IPA=apps/tauri/$IPA" >> "$GITHUB_ENV"

      # Validate + upload to App Store Connect -- only on real version tags,
      # never on workflow_dispatch test runs, matching release.yml (macOS).
      #
      # Until 2026-08-17 this job stopped at "signed IPA in a GitHub artifact":
      # it built and verified a distribution-signed build and then never sent it
      # to Apple, so iOS TestFlight silently stayed on whatever was uploaded by
      # hand (0.1.0, 2026-08-05) while macOS moved on. Tagging looked like it
      # released both platforms and only released one.
      - name: Validate + upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

          BUNDLE_VERSION=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          echo "Uploading iOS $BUNDLE_VERSION from $IPA"

          # --apple-id is REQUIRED here, unlike the macOS validate in
          # release.yml. Without it altool resolves the app from bundle id +
          # platform, and that lookup fails for iOS because this app record has
          # no iOS appStoreVersion yet (macOS has one, which is why the macOS
          # job gets away with omitting it):
          #   ERROR: Cannot determine the Apple ID from Bundle ID
          #   'com.crispstrobe.brickwright' and platform 'IOS'. (19)
          xcrun altool --validate-app -f "$IPA" \
            --type ios \
            --apple-id ${{ vars.APPSTORE_APP_ID }} \
            --bundle-id com.crispstrobe.brickwright \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apple-id ${{ vars.APPSTORE_APP_ID }} \
            --bundle-id com.crispstrobe.brickwright \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_VERSION" \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        # Never let the artifact sink the release: the upload above is the point,
        # and a hit artifact-storage quota has already failed a run whose IPA was
        # perfectly good (WordUniverse, 2026-08-17).
        continue-on-error: true
        with:
          name: brickwright-ios-ipa
          path: apps/tauri/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
