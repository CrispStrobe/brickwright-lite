          def owned_simulator_transaction(plan, invoke, observe, now=time.monotonic, *, prepare, release, stopped=None):
              """Unwired transaction core. Adapters must enforce command/observation bounds.

              Supplied admission fields are not authenticated capabilities. No workflow phase
              invokes this core until runtime/device/resource admission and adapters qualify.
              """
              import math
              import re
              keys = {'schema', 'runtimeIdentifier', 'deviceTypeIdentifier', 'name', 'bundleIdentifier',
                      'appPath', 'sourceSHA256', 'executableSHA256', 'runtimeArchitectureAdmitted',
                      'deviceModelAdmitted', 'processEnvelopeAdmitted'}
              need(all(callable(callback) for callback in (invoke, observe, now, prepare, release)))
              need(stopped is None or callable(stopped))
              need(type(plan) is dict and plan.keys() == keys)
              plan = dict(plan)  # Caller mutation during an adapter call cannot retarget ownership.
              need(plan['schema'] == 'brickwright.ios-owned-simulator-plan.v1')
              for field, expression in (
                  ('runtimeIdentifier', r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+'),
                  ('deviceTypeIdentifier', r'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+'),
                  ('name', r'bw-asset-audit-[a-f0-9]{32}'),
                  ('bundleIdentifier', r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'),
                  ('sourceSHA256', r'[a-f0-9]{64}'), ('executableSHA256', r'[a-f0-9]{64}')):
                  need(type(plan[field]) is str and re.fullmatch(expression, plan[field]) is not None)
              need(type(plan['appPath']) is str and 0 < len(plan['appPath'].encode()) <= 4096 and
                   not any(ord(c) < 32 or ord(c) == 127 for c in plan['appPath']))
              need(all(plan[key] is True for key in ('runtimeArchitectureAdmitted',
