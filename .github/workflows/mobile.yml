name: mobile

on:
  workflow_dispatch:
    inputs:
      sign_ios:
        description: >-
          Also build a SIGNED iOS IPA. Off by default because it talks to
          App Store Connect and will create/download an Apple signing
          certificate and provisioning profile for the team.
        type: boolean
        default: false
      device_ipa:
        description: >-
          Build a SIDELOADABLE iOS IPA for the registered test iPad
          (ad-hoc / "release-testing" export). Unlike the App Store IPA
          from sign_ios, this one embeds a profile that names the device,
          so `xcrun devicectl device install app` accepts it.
        type: boolean
        default: false
      retain_ios_audit_inputs:
        description: Retain bounded unsigned iOS build inputs for independent audit; does not launch the app.
        type: boolean
        default: false
      ios_audit_preflight_only:
        description: Verify Darwin SDK and one owned test process only; skips all app builds and delivery.
        type: boolean
        default: false
      ios_audit_interface_only:
        description: Retain bounded installed simulator tool help only; no app builds, launches or downloads.
        type: boolean
        default: false
      ios_audit_interface_diagnostic:
        description: Sample only the owned slow simctl help child during interface inventory; keeps the original deadline.
        type: boolean
        default: false
      ios_audit_interface_manual_only:
        description: Read installed sample and launchctl manuals only; never starts simctl or a sampler.
        type: boolean
        default: false
      ios_audit_runtime:
        description: Optional exact installed iOS runtime identifier for admission only; never launches an app.
        type: string
        default: ''
      ios_audit_runtime_build:
        description: Exact installed runtime build required when ios_audit_runtime is set.
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ios-audit-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.ios_audit_preflight_only && !inputs.ios_audit_interface_only && !inputs.ios_audit_interface_diagnostic && !inputs.ios_audit_interface_manual_only && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && github.ref == 'refs/heads/lane/ios-active-asset-source-20261018'
    runs-on: macos-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; explicit preflight interpreter only
        id: python
        with:
          python-version: '3.13'
      - name: Verify Darwin SDK and owned process without an app launch
        timeout-minutes: 4
        env:
          BW_PREFLIGHT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          # BEGIN IOS DARWIN PREFLIGHT
          "$BW_PREFLIGHT_PYTHON" - <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time

          C_SOURCE = r"""
          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <libproc.h>
          #include <sys/resource.h>
          #include <mach/mach_time.h>
          #include <mach/mach.h>
          /* Observer-tool interop only: the SDK does not ship sys/codesign.h.
           * Read-only ABI reference: apple-oss-distributions/xnu,
           * f6217f891ac0bb64f3d375211650a4c1ff8ca1ea, bsd/sys/codesign.h.
           * SDK types remain authoritative; no Apple implementation is included. */
          extern int csops_audittoken(pid_t, unsigned int, void *, size_t, audit_token_t *);
          #define BW_CS_STATUS 0U
          #define BW_CS_CDHASH 5U
          int main(int argc, char **argv) {
              struct rusage_info_v0 r = {0};
              mach_timebase_info_data_t t = {0};
              char path[4096] = {0};
              if (argc != 1 || proc_pid_rusage(getpid(), RUSAGE_INFO_V0, (rusage_info_t *)&r) ||
                  mach_timebase_info(&t) || proc_pidpath(getpid(), path, sizeof(path)) <= 0) return 2;
              printf("{\"usageSize\":%zu,\"userOffset\":%zu,\"systemOffset\":%zu,"
                     "\"residentOffset\":%zu,\"birthOffset\":%zu,\"exitOffset\":%zu,"
                     "\"timebaseSize\":%zu,\"numer\":%u,\"denom\":%u,\"pid\":%d,\"uuid\":\"",
                     sizeof(r), offsetof(struct rusage_info_v0, ri_user_time),
                     offsetof(struct rusage_info_v0, ri_system_time), offsetof(struct rusage_info_v0, ri_resident_size),
                     offsetof(struct rusage_info_v0, ri_proc_start_abstime), offsetof(struct rusage_info_v0, ri_proc_exit_abstime),
                     sizeof(t), t.numer, t.denom, getpid());
              for (int i=0; i<16; ++i) printf("%02x", r.ri_uuid[i]);
              printf("\",\"birth\":%llu,\"userTicks\":%llu,\"systemTicks\":%llu,\"rssBytes\":%llu,\"pathMatches\":%s,",
                     (unsigned long long)r.ri_proc_start_abstime, (unsigned long long)r.ri_user_time,
                     (unsigned long long)r.ri_system_time, (unsigned long long)r.ri_resident_size,
                     strcmp(path,argv[0]) == 0 ? "true" : "false");
              audit_token_t token = {{0}};
              mach_msg_type_number_t count = TASK_AUDIT_TOKEN_COUNT;
              uint32_t code_status = 0;
              unsigned char cdhash[20] = {0};
              if (task_info(mach_task_self(),TASK_AUDIT_TOKEN,(task_info_t)&token,&count) != KERN_SUCCESS ||
                  count != TASK_AUDIT_TOKEN_COUNT ||
                  csops_audittoken(getpid(),BW_CS_STATUS,&code_status,sizeof(code_status),&token) ||
                  csops_audittoken(getpid(),BW_CS_CDHASH,cdhash,sizeof(cdhash),&token)) return 4;
              printf("\"auditTokenSize\":%zu,\"auditTokenCount\":%u,\"auditTokenFlavor\":%u,"
                     "\"csStatusOperation\":%u,\"csCDHashOperation\":%u,\"cdhashBytes\":%zu,"
                     "\"codeStatus\":%u,\"auditTokenHex\":\"",sizeof(token),count,TASK_AUDIT_TOKEN,
                     BW_CS_STATUS,BW_CS_CDHASH,sizeof(cdhash),code_status);
              for (size_t i=0; i<sizeof(token); ++i) printf("%02x",((unsigned char *)&token)[i]);
              printf("\",\"cdhash\":\"");
              for (size_t i=0; i<sizeof(cdhash); ++i) printf("%02x",cdhash[i]);
              printf("\"}\n");
              fflush(stdout);
              char quit_token;
              return read(STDIN_FILENO,&quit_token,1)==1 && quit_token=='X' ? 0 : 3;
          }
          """


          def require(value):
              if not value:
                  raise ValueError('Darwin preflight refused')


          def validate_sdk_report(value, pid):
              layout = {'usageSize':96, 'userOffset':16, 'systemOffset':24, 'residentOffset':64,
                        'birthOffset':80, 'exitOffset':88, 'timebaseSize':8,
                        'auditTokenSize':32,'auditTokenCount':8,'auditTokenFlavor':15,
                        'csStatusOperation':0,'csCDHashOperation':5,'cdhashBytes':20}
              fields = set(layout) | {'numer','denom','pid','uuid','birth','userTicks','systemTicks','rssBytes','pathMatches','codeStatus','auditTokenHex','cdhash'}
              require(type(value) is dict and value.keys() == fields)
              require(all(type(value[k]) is int and value[k] == v for k,v in layout.items()))
              require(type(value['pid']) is int and value['pid'] == pid and 0 < pid <= 2147483647)
              require(type(value['uuid']) is str and re.fullmatch('[a-f0-9]{32}',value['uuid']) is not None and
                      value['uuid'] != '0'*32 and value['pathMatches'] is True)
              require(type(value['codeStatus']) is int and 0<=value['codeStatus']<=2**32-1 and value['codeStatus']&1 and
                      type(value['auditTokenHex']) is str and re.fullmatch('[a-f0-9]{64}',value['auditTokenHex']) is not None and
                      type(value['cdhash']) is str and re.fullmatch('[a-f0-9]{40}',value['cdhash']) is not None and value['cdhash']!='0'*40)
              require(all(type(value[k]) is int and 0 <= value[k] <= 2**64-1
                          for k in ('birth','userTicks','systemTicks','rssBytes')) and value['birth'] > 0)
              require(all(type(value[k]) is int and 0 < value[k] <= 2**32-1 for k in ('numer','denom')))
              require(value['rssBytes'] <= 1024**3 and
                      (value['userTicks']+value['systemTicks'])*value['numer']//value['denom'] <= 5_000_000_000)


          def validate_api_exports():
              library = ctypes.CDLL('/usr/lib/libSystem.B.dylib', use_errno=True)
              names = ('task_name_for_pid','task_info','mach_port_deallocate','csops_audittoken')
              exports = {name:hasattr(library,name) for name in names}
              require(all(exports.values()))
              return exports


          def preflight_group_original(pid, report):
              """Fixed nonforking probe only; not a simulator or general child census."""
              library=ctypes.CDLL('/usr/lib/libproc.dylib',use_errno=True)
              query=library.proc_listpgrppids
              query.argtypes=[ctypes.c_int,ctypes.c_void_p,ctypes.c_int]
              query.restype=ctypes.c_int
              buffer=(ctypes.c_int32*2)()
              ctypes.set_errno(0)
              count=query(pid,ctypes.byref(buffer),ctypes.sizeof(buffer))
              row={'kind':'fixed-probe-group','count':count,'errno':ctypes.get_errno(),
                   'rawHex':bytes(buffer).hex()}
              report.setdefault('probeGroupOriginals',[]).append(row)
              require(type(count) is int and count==1 and row['errno']==0 and buffer[0]==pid)
              return row


          def finish_preflight_helper(process, exit_info, report, *, ownership_token):
              """Reap the observed owned exit even when group signalling refuses.

              Darwin's zombie-only negative is classified only for the exact fixed probe,
              with two singleton kernel group originals and stable WNOWAIT/UID/zero exit.
              It supplies no general process-group or simulator cleanup qualification.
              """
              primary=None
              try:
                  require(process.returncode is None)
                  fields=('si_pid','si_uid','si_signo','si_status','si_code')
                  original={key:getattr(exit_info,key) for key in fields}
                  report['probeExitOriginal']=original
                  require(type(ownership_token) is bytes and len(ownership_token)==32)
                  import struct
                  token=struct.unpack('<8I',ownership_token)
                  report['probeExitOwnershipTokenHex']=ownership_token.hex()
                  report['waitUIDUsedForOwnership']=False
                  require(token[5]==process.pid and token[1]==os.geteuid())
                  # Darwin waitid leaves si_uid zero in the observed exit record.
                  # Ownership is from the authenticated pre-exit kernel token.
                  require(all(type(v) is int for v in original.values()) and
                      0<=original['si_uid']<=2**32-1 and
                      {key:value for key,value in original.items() if key!='si_uid'}=={
                          'si_pid':process.pid,'si_signo':signal.SIGCHLD,
                          'si_status':0,'si_code':os.CLD_EXITED})
                  preflight_group_original(process.pid,report)
                  signal_error=None
                  try:
                      os.killpg(process.pid,signal.SIGKILL)
                      report['probeGroupSignal']={'status':0,'errno':0}
                  except OSError as error:
                      report['probeGroupSignal']={'status':-1,'errno':error.errno}
                      signal_error=error
                  preflight_group_original(process.pid,report)
                  again=os.waitid(os.P_PID,process.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT)
                  require(again is not None and {key:getattr(again,key) for key in fields}==original)
                  if signal_error is not None:
                      import errno
                      require(isinstance(signal_error,PermissionError) and signal_error.errno==errno.EPERM)
                      report['zombieOnlyGroupNegativeObserved']=True
                  report['fixedProbeGroupChecked']=True
              except BaseException as error:
                  primary=error
                  raise
              finally:
                  # A signalling exception must never skip reaping our exact exited child.
                  report['helperReapAttempted']=True
                  try:
                      code=process.wait(timeout=2)
                      report['helperReturnCode']=code
                      require(code==0)
                      try:os.waitpid(process.pid,os.WNOHANG)
                      except ChildProcessError:report['leaderReaped']=True
                      else:raise ValueError('owned leader was not reaped')
                  except BaseException as error:
                      report['helperReapFailure']=type(error).__name__
                      if primary is None:raise


          def check_command_cleanup(namespace, process, exit_info, report, *, ownership_token):
              """Exercise the candidate primitive only on this fixed nonforking helper."""
              primary=None
              try:
                  report['commandCleanupOriginals']=[]
                  rows=namespace['darwin_owned_command_cleanup'](process,deadline=time.monotonic()+2)
                  report['commandCleanupOriginals']=[json.loads(row) for row in rows]
                  report['commandCleanupProbeChecked']=True
              except BaseException as error:
                  primary=error
                  report['commandCleanupOriginals']=[json.loads(row) for row in
                      getattr(error,'originals',getattr(error,'command_cleanup_originals',()))]
                  raise
              finally:
                  # The primitive never reaps. Preserve the primary failure while the
                  # independent fixed-probe teardown always attempts the owned wait.
                  try:
                      finish_preflight_helper(process,exit_info,report,ownership_token=ownership_token)
                  except BaseException as error:
                      report['commandCleanupTeardownFailure']=type(error).__name__
                      if primary is None:raise


          def producer_namespace(workflow):
              match = re.search(r'# BEGIN IOS INPUT RETENTION\n          cat > "\$RUNNER_TEMP/bw-ios-audit-capture.py" <<\'PY\'\n([\s\S]*?)          PY\n          # END IOS INPUT RETENTION',workflow)
              require(match is not None)
              source = re.sub('^          ','',match[1],flags=re.M)
              prefix = source[:source.rindex('\ntry:\n')]
              namespace = {}
              exec(compile(prefix,'reviewed-workflow-producer','exec'),namespace)
              return namespace,hashlib.sha256(prefix.encode()).hexdigest()


          def main():
              root=Path(os.environ['RUNNER_TEMP']).resolve()/'bw-ios-darwin-preflight'
              root.mkdir(exist_ok=False)
              report={'schema':'brickwright.darwin-sdk-preflight.v6','status':'partial',
                      'sourceCommit':os.environ['GITHUB_SHA'],'runID':os.environ['GITHUB_RUN_ID'],
                      'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':os.environ['GITHUB_JOB'],
                      'actualAppQualified':False,'processFamilyQualified':False,'processGroupQualified':False,'cleanupSucceeded':False}
              process=None
              identity=None
              report['stage']='platform-admission'
              report['host']={'platform':sys.platform,'architecture':platform.machine(),
                  'pythonVersion':list(sys.version_info[:3]),
                  'waitAPIs':{key:hasattr(os,key) for key in ('waitid','P_PID','WEXITED','WNOHANG','WNOWAIT')},
                  'sigchldDefault':signal.getsignal(signal.SIGCHLD)==signal.SIG_DFL}
              try:
                  require(sys.platform == 'darwin' and platform.machine() == 'arm64' and sys.version_info >= (3,13))
                  require(all(hasattr(os,key) for key in ('waitid','P_PID','WEXITED','WNOHANG','WNOWAIT')) and
                          signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL)
                  require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
                          os.environ['GITHUB_REPOSITORY'] == 'CrispStrobe/brickwright-lite' and
                          os.environ['GITHUB_REF'] == 'refs/heads/lane/ios-active-asset-source-20261018')
                  report['stage']='producer-loading'
                  workflow=(Path(os.environ['GITHUB_WORKSPACE'])/'.github/workflows/mobile.yml').read_text()
                  namespace,prefix_hash=producer_namespace(workflow)
                  report['producerPrefixSHA256']=prefix_hash
                  report['workflowSHA256']=hashlib.sha256(workflow.encode()).hexdigest()
                  def command(args):
                      result=subprocess.run(args,stdin=subprocess.DEVNULL,capture_output=True,timeout=30,check=True)
                      require(len(result.stdout)+len(result.stderr)<=65536)
                      return result.stdout
                  report['stage']='api-exports'
                  report['apiExports']=validate_api_exports()
                  report['codeSignDeclaration']={'kind':'observer-tool-interop',
                      'source':'apple-oss-distributions/xnu',
                      'revision':'f6217f891ac0bb64f3d375211650a4c1ff8ca1ea',
                      'path':'bsd/sys/codesign.h','sdkHeaderProvided':False,
                      'operations':{'status':0,'cdhash':5}}
                  report['stage']='compiler-discovery'
                  compiler=command(['/usr/bin/xcrun','--sdk','macosx','--find','clang']).decode().strip()
                  sdk=command(['/usr/bin/xcrun','--sdk','macosx','--show-sdk-path']).decode().strip()
                  require(Path(compiler).is_absolute() and Path(sdk).is_absolute())
                  report['sdkVersion']=command(['/usr/bin/xcrun','--sdk','macosx','--show-sdk-version']).decode().strip()
                  report['compilerVersionSHA256']=hashlib.sha256(command([compiler,'--version'])).hexdigest()
                  settings=Path(sdk)/'SDKSettings.json'
                  require(settings.is_file() and settings.stat().st_size<=1024*1024)
                  report['sdkSettingsSHA256']=hashlib.sha256(settings.read_bytes()).hexdigest()
                  source=root/'probe.c';source.write_text(C_SOURCE)
                  executable=root/'probe'
                  report['probeSourceSHA256']=hashlib.sha256(source.read_bytes()).hexdigest()
                  report['stage']='probe-compile'
                  command([compiler,'-std=c11','-Wall','-Wextra','-Werror','-isysroot',sdk,str(source),'-o',str(executable)])
                  report['probeExecutableSHA256']=hashlib.sha256(executable.read_bytes()).hexdigest()
                  environment={key:os.environ[key] for key in ('HOME','PATH','TMPDIR') if key in os.environ}
                  report['stage']='probe-start'
                  process=subprocess.Popen([str(executable)],stdin=subprocess.PIPE,stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,start_new_session=True,close_fds=True,env=environment)
                  report['stage']='probe-read'
                  with selectors.DefaultSelector() as selector:
                      selector.register(process.stdout,selectors.EVENT_READ)
                      require(bool(selector.select(5)))
                      raw=os.read(process.stdout.fileno(),4097)
                  require(0<len(raw)<=4096 and raw.endswith(b'\n') and raw.count(b'\n')==1)
                  report['probeOutputHex']=raw.hex()
                  report['stage']='sdk-layout'
                  observed=json.loads(raw);report['sdkOriginal']=observed
                  validate_sdk_report(observed,process.pid)
                  report['stage']='code-directory-pages'
                  directory=namespace['simulator_code_directory'](executable.read_bytes(),deadline=time.monotonic()+5)
                  require(directory['cdhash']==observed['cdhash'])
                  report['codeDirectory']=directory
                  report['stage']='kernel-identity-create'
                  identity=namespace['DarwinAuditIdentity'](process.pid,directory['cdhash'],deadline=time.monotonic()+15)
                  report['stage']='kernel-identity-read'
                  token_identity=identity.sample()
                  require(identity._token.hex()==observed['auditTokenHex'])
                  report['stage']='sampler-create'
                  sampler=namespace['DarwinProcessSampler'](process.pid,str(executable),deadline=time.monotonic()+10)
                  report['stage']='sampler-read'
                  snapshot=sampler(process.pid)
                  require((sampler._numer,sampler._denom)==(observed['numer'],observed['denom']))
                  birth,uuid=sampler._previous[0]
                  require(birth==observed['birth'] and uuid.hex()==observed['uuid'])
                  counters=sampler._previous[1]
                  require(counters[0]>=observed['userTicks'] and counters[1]>=observed['systemTicks'])
                  require(snapshot['pid']==process.pid and snapshot['rssBytes']>0)
                  require(identity.sample()==token_identity)
                  report['kernelIdentitySHA256']=token_identity
                  report['sdkOriginal']=observed
                  report['sampledRSSBytes']=snapshot['rssBytes']
                  report['sampleIdentitySHA256']=snapshot['identitySHA256']
                  # Preserve resource originals. The full pidpath buffer contains a runner
                  # directory; publish only its hash/size, never the path or executable.
                  report['kernelOriginals']=[dict(row) if row['kind']!='pidpath' else
                      {'kind':'pidpath','status':row['status'],'errno':row['errno'],
                       'rawBytes':len(bytes.fromhex(row['rawHex'])),
                       'rawSHA256':hashlib.sha256(bytes.fromhex(row['rawHex'])).hexdigest()}
                      for row in sampler.originals()]
                  report['stage']='probe-graceful-exit'
                  process.stdin.write(b'X');process.stdin.flush();process.stdin.close()
                  deadline=time.monotonic()+5
                  while os.waitid(os.P_PID,process.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT) is None:
                      require(time.monotonic()<deadline)
                      time.sleep(0.01)
                  exit_info=os.waitid(os.P_PID,process.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT)
                  report['nonReapingWaitObserved']=True
                  report['stage']='command-cleanup-probe'
                  check_command_cleanup(namespace,process,exit_info,report,ownership_token=identity._token)
                  report['cleanupSucceeded']=True
                  report['stage']='exit-refusal'
                  try:sampler(process.pid)
                  except ValueError:report['exitedPIDRefused']=True
                  else:raise ValueError('exited PID accepted')
                  report['kernelExitOriginals']=sampler.originals()[len(report['kernelOriginals']):]
                  report['stage']='kernel-identity-exit-refusal'
                  try:identity.sample()
                  except ValueError:report['kernelIdentityExitRefused']=True
                  else:raise ValueError('exited kernel identity accepted')
                  identity.close()
                  report['identityOriginals']=identity.originals()
                  report['identityPortReleased']=True
                  report['stage']='complete'
                  report['status']='sdk-and-kernel-identity-controls-pass'
              except Exception as failure:
                  report['failure']={'type':type(failure).__name__,'stage':report['stage']}
                  if isinstance(failure,subprocess.CalledProcessError):
                      diagnostic=failure.stderr or b''
                      report['compilerErrorSHA256']=hashlib.sha256(diagnostic).hexdigest()
                      text=diagnostic[:8192].decode('utf-8','replace')
                      for private in (str(root),locals().get('sdk',''),locals().get('compiler','')):
                          if private:text=text.replace(private,'<preflight-input>')
                      report['compilerDiagnostics']=text
                  raise
              finally:
                  errors=[]
                  try:
                      if identity is not None:
                          try:identity.close()
                          except Exception as error:errors.append('identity-'+type(error).__name__)
                          report['identityOriginals']=identity.originals()
                      if process is not None:
                          if process.returncode is None:
                              try:os.killpg(process.pid,signal.SIGKILL)
                              except ProcessLookupError:pass
                              except Exception as error:errors.append('group-'+type(error).__name__)
                              # Never skip the owned wait because signalling failed.
                              process.wait(timeout=2)
                  except Exception as error:errors.append(type(error).__name__)
                  finally:
                      if process is not None:
                          for stream in (process.stdin,process.stdout,process.stderr):
                              try:
                                  if stream is not None and not stream.closed:stream.close()
                              except Exception as error:errors.append(type(error).__name__)
                      report['cleanupErrors']=errors
                      if errors:report['cleanupSucceeded']=False
                      summary={key:report[key] for key in ('status','stage','host','failure','sdkOriginal',
                          'cleanupSucceeded','cleanupErrors') if key in report}
                      print('Darwin preflight summary '+json.dumps(summary,sort_keys=True))
                      (root/'report.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
                  require(not errors)
              print('Darwin SDK and owned-process preflight passed; app observation remains disabled')

          if __name__=='__main__':
              try:main()
              except Exception:
                  print('Darwin preflight refused; inspect the bounded structured report',file=sys.stderr)
                  raise SystemExit(1)
          PY
          # END IOS DARWIN PREFLIGHT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: brickwright-ios-darwin-preflight
          path: ${{ runner.temp }}/bw-ios-darwin-preflight/report.json
          if-no-files-found: error
          retention-days: 7

  ios-audit-interface:
    if: github.event_name == 'workflow_dispatch' && (inputs.ios_audit_interface_only || inputs.ios_audit_interface_diagnostic || inputs.ios_audit_interface_manual_only) && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && github.ref == 'refs/heads/lane/ios-active-asset-source-20261018'
    runs-on: macos-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Retain installed tool interface facts without an app operation
        timeout-minutes: 2
        env:
          BW_INTERFACE_MANUAL_ONLY: ${{ inputs.ios_audit_interface_manual_only }}
          BW_INTERFACE_MODE: ${{ inputs.ios_audit_interface_only }}
          BW_INTERFACE_DIAGNOSTIC: ${{ inputs.ios_audit_interface_diagnostic }}
          BW_INTERFACE_OTHER_MODE: ${{ inputs.ios_audit_preflight_only }}
          BW_INTERFACE_RUNTIME: ${{ inputs.ios_audit_runtime }}
          BW_INTERFACE_BUILD: ${{ inputs.ios_audit_runtime_build }}
        run: |
          set -euo pipefail
          # BEGIN IOS INTERFACE INVENTORY
          python - <<'PY'
          import hashlib,json,os,platform,re,selectors,signal,struct,subprocess,sys,time
          from pathlib import Path

          def require(ok):
              if not ok:raise ValueError('installed interface inventory refused')

          def retained_command(argv, cleanup, *, deadline, observe=None, facts=None):
              """Fixed help/version commands only; retained prefixes are not ownership proof."""
              child=None;selector=None;rows=[];output=bytearray();failure=None;used=0
              stage='admission';started=time.monotonic();observed=False
              if facts is not None:
                  require(type(facts) is dict and not facts)
                  facts['startedMonotonic']=started
                  facts['deadlineMonotonic']=deadline
              try:
                  require(observe is None or callable(observe))
                  require(time.monotonic()<deadline)
                  stage='spawn'
                  selector=selectors.DefaultSelector()
                  environment={key:value for key,value in os.environ.items() if key in
                      ('PATH','HOME','TMPDIR','DEVELOPER_DIR','LANG','LC_ALL','__CF_USER_TEXT_ENCODING')}
                  child=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                      start_new_session=True,close_fds=True,env=environment)
                  for pipe in (child.stdout,child.stderr):
                      os.set_blocking(pipe.fileno(),False);selector.register(pipe,selectors.EVENT_READ)
                  if facts is not None:
                      facts['spawnedMonotonic']=time.monotonic();facts['pid']=child.pid
                  while True:
                      stage='deadline'
                      require(time.monotonic()<deadline and len(rows)<256)
                      stage='read'
                      for key,_ in selector.select(min(.05,max(0,deadline-time.monotonic()))):
                          raw=os.read(key.fileobj.fileno(),65536)
                          rows.append({'kind':'stdout' if key.fileobj is child.stdout else 'stderr','rawHex':raw.hex()})
                          stage='output';used+=len(raw);require(used<=65536)
                          if not raw:selector.unregister(key.fileobj)
                          elif key.fileobj is child.stdout:output.extend(raw)
                      stage='wait'
                      info=os.waitid(os.P_PID,child.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT)
                      if info is not None:
                          values=tuple(getattr(info,key) for key in ('si_pid','si_uid','si_signo','si_status','si_code'))
                          rows.append({'kind':'wait','rawHex':struct.pack('<5q',*values).hex()})
                          stage='exit'
                          require(info.si_pid==child.pid and info.si_code==os.CLD_EXITED and info.si_status==0)
                          if not selector.get_map():break
                      elif observe is not None and not observed and time.monotonic()-started>=2:
                          stage='diagnostic';observed=True
                          if facts is not None:facts['diagnosticStartedMonotonic']=time.monotonic()
                          require(child.returncode is None)
                          observe(child,deadline)
                          if facts is not None:facts['diagnosticFinishedMonotonic']=time.monotonic()
              except BaseException as error:
                  failure=error
                  if facts is not None:facts['failurePhase']=stage
              finally:
                  if child is not None:
                      try:rows.extend(json.loads(row) for row in cleanup(child,deadline=time.monotonic()+2))
                      except BaseException as error:
                          rows.extend(json.loads(row) for row in getattr(error,'originals',getattr(error,'command_cleanup_originals',())))
                          if failure is None:failure=error
                      try:
                          code=child.wait(timeout=2);rows.append({'kind':'reap','code':code})
                          require(code==0)
                      except BaseException as error:
                          if failure is None:failure=error
                      for pipe in (child.stdout,child.stderr):
                          try:pipe.close()
                          except BaseException as error:
                              if failure is None:failure=error
                  if selector is not None:
                      try:selector.close()
                      except BaseException as error:
                          if failure is None:failure=error
              if facts is not None:
                  facts['finishedMonotonic']=time.monotonic()
                  facts['diagnosticInvoked']=observed
              return bytes(output),rows,None if failure is None else type(failure).__name__

          def main():
              root=Path(os.environ['RUNNER_TEMP'])/'bw-ios-interface-inventory';root.mkdir(exist_ok=False)
              report={'schema':'brickwright.ios-tool-interface.v5','sourceCommit':os.environ['GITHUB_SHA'],
                  'runID':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':os.environ['GITHUB_JOB'],
                  'profile':'unadmitted','status':'partial','commands':[],'diagnostics':[],'commandGraphComplete':False,'actualAppQualified':False,'namespaceOwnershipQualified':False}
              try:
                  require(sys.platform=='darwin' and platform.machine()=='arm64' and sys.version_info>=(3,13) and signal.getsignal(signal.SIGCHLD)==signal.SIG_DFL)
                  require(os.environ['BW_INTERFACE_MODE']=='true' and os.environ['BW_INTERFACE_OTHER_MODE']=='false' and os.environ['BW_INTERFACE_RUNTIME']=='' and os.environ['BW_INTERFACE_BUILD']=='')
                  require(os.environ['BW_INTERFACE_DIAGNOSTIC'] in ('true','false'))
                  require(os.environ['BW_INTERFACE_MANUAL_ONLY'] in ('true','false'))
                  manual_only=os.environ['BW_INTERFACE_MANUAL_ONLY']=='true'
                  require(not manual_only or os.environ['BW_INTERFACE_DIAGNOSTIC']=='false')
                  report['profile']='manual-only' if manual_only else 'simctl-help'
                  workflow=(Path(os.environ['GITHUB_WORKSPACE'])/'.github/workflows/mobile.yml').read_text()
                  report['workflowSHA256']=hashlib.sha256(workflow.encode()).hexdigest()
                  block=re.search(r'# BEGIN IOS INPUT RETENTION\n          cat > "\$RUNNER_TEMP/bw-ios-audit-capture.py" <<\'PY\'\n([\s\S]*?)          PY\n          # END IOS INPUT RETENTION',workflow)
                  require(block is not None);body=re.sub('^          ','',block[1],flags=re.M)
                  prefix=body[:body.rindex('\ntry:\n')];namespace={};exec(compile(prefix,'reviewed-interface-cleanup','exec'),namespace)
                  cleanup=namespace['darwin_owned_command_cleanup'];total_deadline=time.monotonic()+60
                  commands=[('/usr/bin/xcrun','--find','simctl'),('/usr/bin/xcodebuild','-version'),
                      ('/bin/launchctl','help')]
                  for subcommand in ('','spawn','launch','get_app_container','appinfo','list'):
                      commands.append(('/usr/bin/xcrun','simctl','help',*(() if not subcommand else (subcommand,))))
                  if manual_only:
                      commands=[('/usr/bin/xcodebuild','-version'),('/bin/launchctl','help','print'),
                          ('/bin/launchctl','help','procinfo'),('/bin/launchctl','help','managerpid'),
                          ('/usr/bin/man','-P','/bin/cat','sample')]
                  def observe_owned_help(child,deadline):
                      # This unreaped Popen PID cannot be recycled. No name lookup or
                      # shared service PID is admitted. Sampling is diagnostic only.
                      require(child.returncode is None)
                      facts={}
                      # Default symbol lookup follows sampling; no speculative -mayDie prefetch.
                      sample_argv=('/usr/bin/sample',str(child.pid),'1','10','-file','/dev/stdout')
                      output,originals,failure=retained_command(sample_argv,cleanup,
                          deadline=min(deadline-1,time.monotonic()+3),facts=facts)
                      report['diagnostics'].append({'targetPID':child.pid,'argv':list(sample_argv),
                          'originals':originals,'failure':failure,'facts':facts})
                      # Preserve auxiliary failure without shortening the primary command.
                  for argv in commands:
                      require(time.monotonic()<total_deadline)
                      facts={}
                      observer=observe_owned_help if os.environ['BW_INTERFACE_DIAGNOSTIC']=='true' and argv==('/usr/bin/xcrun','simctl','help') else None
                      stdout,rows,failure=retained_command(argv,cleanup,deadline=min(total_deadline,time.monotonic()+10),observe=observer,facts=facts)
                      report['commands'].append({'argv':list(argv),'originals':rows,'failure':failure,'facts':facts})
                      require(failure is None)
                  report['commandGraphComplete']=True
                  require(all(record['failure'] is None for record in report['diagnostics']))
                  report['status']='installed-help-observed-only'
              except Exception as error:report['failure']=type(error).__name__;raise
              finally:
                  raw=json.dumps(report,sort_keys=True,indent=2).encode();require(len(raw)<=2*1024*1024)
                  (root/'report.json').write_bytes(raw)
                  print('Installed tool interface status: '+report['status'])

          if __name__=='__main__':main()
          PY
          # END IOS INTERFACE INVENTORY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: brickwright-ios-tool-interface
          path: ${{ runner.temp }}/bw-ios-interface-inventory/report.json
          if-no-files-found: error
          retention-days: 7

  build-web:
    if: github.event_name != 'workflow_dispatch' || (inputs.ios_audit_preflight_only != true && inputs.ios_audit_interface_only != true && inputs.ios_audit_interface_diagnostic != true && inputs.ios_audit_interface_manual_only != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web bundle (vendor + integrate + webpack)
        run: bash scripts/vercel-build.sh || (echo "retrying web build" && bash scripts/vercel-build.sh)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: packages/scratch-gui/build
          retention-days: 3

  android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # v3.2.2's `packages` default was 'tools platform-tools', and Google has
      # REMOVED the legacy `tools` package from the SDK repository — so
      # sdkmanager exits 1 with `Warning: Failed to find package 'tools'` and
      # the whole android job dies before it builds anything. Nothing in this
      # repo changed; the remote repository did. It took out v0.1.17 and
      # v0.1.18 (runs 36234004552 and 36237451888), while ios-signed succeeded
      # on both — so tagging released iOS and silently released no Android.
      #
      # v4.0.4 dropped `tools` from the default (and moves to node24, which
      # also clears the Node 20 deprecation warning this step was emitting).
      # `packages` is ALSO named explicitly rather than left to the default:
      # the default is what broke us, and a default we did not choose can
      # change again without notice.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build Android APK (debug, unsigned)
        working-directory: apps/tauri
        run: |
          npx tauri android init --ci
          # `tauri android init` templates TAURI'S OWN logo into gen/android and
          # never looks at src-tauri/icons/android, so every APK shipped the
          # default launcher icon.
          node scripts/patch-mobile-icons.mjs android
          # tauri-plugin-blec's Android library requires minSdk 26; the generated
          # project defaults to 24, which fails the manifest merge.
          sed -i 's/minSdk = 24/minSdk = 26/' src-tauri/gen/android/app/build.gradle.kts
          # Allow cleartext ws:// to LAN bridge servers (bridge-mode hardware
          # over WiFi). The manifest ships a ${usesCleartextTraffic} placeholder.
          sed -i 's/${usesCleartextTraffic}/true/' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Camera + microphone for getUserMedia (Video Sensing, loudness, record
          # a sound). MODIFY_AUDIO_SETTINGS is required or the WebView gets the mic
          # grant but still fails with NotReadableError. Features are required=false
          # so devices without a camera can still install.
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          # Request the runtime camera/mic permissions on launch (Tauri never does).
          cp android-overlay/MainActivity.kt \
            src-tauri/gen/android/app/src/main/java/com/crispstrobe/brickwright/MainActivity.kt
          npx tauri android build --apk --debug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-android-apk
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      # On a tag, attach the APK to the same draft GitHub Release the desktop
      # bundles go to (release.yml), so all platforms appear together.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    needs: build-web
    runs-on: macos-latest
    # Simulator-only, so no Apple signing certificate or developmentTeam is
    # needed. A real-device/TestFlight build still would be. This job is
    # blocking: it used to be continue-on-error, which hid a genuine link
    # failure (missing ExternalAccessory) for a month.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      # Frameworks come from bundle.iOS.frameworks in tauri.conf.json, and the
      # iOS-only Info.plist keys (ATS local networking, MFi accessory protocols,
      # camera/mic/speech usage strings) from src-tauri/Info.ios.plist — both
      # survive project regeneration, so there is nothing to patch here. Anything
      # this step would have to fix up belongs in one of those two files instead,
      # or local builds silently differ from CI.
      - name: Retain unsigned iOS inputs before build
        if: github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018')
        timeout-minutes: 3
        env:
          BW_RETAIN_IOS_INPUTS: ${{ inputs.retain_ios_audit_inputs }}
          BW_SIGN_IOS: ${{ inputs.sign_ios }}
          BW_DEVICE_IPA: ${{ inputs.device_ipa }}
        run: |
          set -euo pipefail
          set -o noclobber
          # BEGIN IOS INPUT RETENTION
          cat > "$RUNNER_TEMP/bw-ios-audit-capture.py" <<'PY'
          """Retain bounded unsigned build inputs; never start an app or claim active use."""
          import hashlib
          import math
          import json
          import os
          from pathlib import Path
          import plistlib
          import stat
          import subprocess
          import sys
          import time

          FILE = 64 * 1024 * 1024
          TOTAL = 512 * 1024 * 1024
          COUNT = 8192
          START = time.monotonic()
          LAST = START
          ROOT = Path(os.environ['GITHUB_WORKSPACE'])
          OUT = Path(os.environ['RUNNER_TEMP']) / 'bw-ios-audit-inputs'
          ROWS = []
          USED = 0


          def need(ok):
              if not ok:
                  raise ValueError('input retention refused')


          def clock():
              global LAST
              tick = time.monotonic()
              need(tick >= LAST and tick-START <= 120)
              LAST = tick


          def command(args, cwd=ROOT):
              clock()
              result = subprocess.run(args, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      timeout=15, check=True)
              need(len(result.stdout) <= 4*1024*1024)
              clock()
              return result.stdout


          def canonical(name):
              need(type(name) is str and 0 < len(name.encode()) <= 512 and
                   all(p not in ('', '.', '..') for p in name.split('/')) and
                   not any(ord(c) < 32 or ord(c) == 127 or c in '\\:' for c in name) and
                   all(part not in ('CLAUDE.md', 'AGENTS.md', '.env') and not part.startswith('.env.')
                       for part in name.split('/')))


          def read_file(file, cap=FILE):
              clock()
              # Refuse links in every component, not only the final name.
              for part in [file, *file.parents]:
                  need(not part.is_symlink())
              before = file.stat()
              need(stat.S_ISREG(before.st_mode) and before.st_size <= cap)
              fd = os.open(file, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  need((opened.st_dev, opened.st_ino) == (before.st_dev, before.st_ino))
                  raw = stream.read(cap+1)
                  after = os.fstat(stream.fileno())
              need(len(raw) == before.st_size and len(raw) <= cap and
                   (before.st_size, before.st_mtime_ns, before.st_ctime_ns) ==
                   (after.st_size, after.st_mtime_ns, after.st_ctime_ns))
              clock()
              return raw


          def retain(name, raw):
              global USED
              canonical(name)
              cap = 256*1024*1024 if name == 'native/executable' else FILE
              need(len(ROWS) < COUNT and len(raw) <= cap and USED+len(raw) <= TOTAL and
                   name.casefold() not in {r['path'].casefold() for r in ROWS})
              file = OUT / name
              file.parent.mkdir(parents=True, exist_ok=True)
              with file.open('xb') as stream:
                  stream.write(raw)
              ROWS.append({'path': name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
              USED += len(raw)


          def sources():
              raw = command(['git', 'ls-files', '-z', '--', 'apps/tauri/src-tauri',
                             'apps/tauri/scripts', 'apps/tauri/package.json', 'apps/tauri/package-lock.json',
                             '.github/workflows/mobile.yml', 'vendor-pins.json'])
              names = sorted(raw.decode().rstrip('\0').split('\0'))
              need(0 < len(names) <= COUNT)
              return names


          def web_files():
              web = ROOT/'packages/scratch-gui/build'
              names = []
              for base, dirs, files in os.walk(web, followlinks=False):
                  clock()
                  for name in dirs:
                      need(not (Path(base)/name).is_symlink())
                  for name in files:
                      file = Path(base)/name
                      relative = file.relative_to(web).as_posix()
                      canonical(relative)
                      names.append(relative)
                      need(len(names) <= COUNT)
              need(names)
              return sorted(names)


          def record_sources():
              for name in sources():
                  canonical(name)
                  raw = read_file(ROOT/name)
                  # Capture only exact tracked source bytes, not an uncommitted mutation.
                  need(raw == command(['git', 'show', 'HEAD:'+name]))
                  retain('source/'+name, raw)
              for name in web_files():
                  retain('web/'+name, read_file(ROOT/'packages/scratch-gui/build'/name))


          def toolchain_observation(phase, manifest):
              # Observe installed candidates only. No binaries or host paths are published.
              directory = Path(os.environ['RUNNER_TEMP']) / 'bw-ios-toolchain-inputs'
              if phase == 'before':
                  directory.mkdir(exist_ok=False)
              else:
                  need(directory.is_dir() and not directory.is_symlink())
              def installed(args):
                  value = command(args).decode().strip()
                  need(value and '\n' not in value)
                  return Path(value).resolve(strict=True)
              paths = {
                  'rustc': installed(['rustup', 'which', 'rustc']),
                  'cargo': installed(['rustup', 'which', 'cargo']),
                  'appleClang': installed(['xcrun', '--sdk', 'iphonesimulator', '--find', 'clang']),
                  'xcodeBuild': installed(['xcrun', '--find', 'xcodebuild']),
                  'simulatorSDKSettings': installed(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-path']) / 'SDKSettings.json'
              }
              identities = {}
              for role, file in paths.items():
                  raw = read_file(file, 256*1024*1024 if role != 'simulatorSDKSettings' else 1024*1024)
                  need(raw)
                  identities[role] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              value = {
                  'schema': 'brickwright.ios-toolchain-observations.v1', 'phase': phase,
                  'commit': manifest['commit'], 'tree': manifest['tree'],
                  'runID': manifest['runID'], 'attempt': manifest['attempt'],
                  'job': manifest['job'], 'ref': manifest['ref'],
                  'producerSHA256': hashlib.sha256(read_file(Path(__file__))).hexdigest(),
                  'tools': identities, 'compilerUsedInputsProved': False,
                  'completeToolchainClosureQualified': False, 'sdkContentsQualified': False,
                  'effectiveConfigurationJoined': False, 'actualAppObserved': False,
                  'resourceLifetimeQualified': False
              }
              if phase == 'after':
                  original = read_file(directory / 'before.json', 1024*1024)
                  before = json.loads(original)
                  expected = dict(value, phase='before')
                  need(before == expected)
                  value['beforeSHA256'] = hashlib.sha256(original).hexdigest()
              with (directory / (phase+'.json')).open('x') as stream:
                  json.dump(value, stream, sort_keys=True)


          def bounded_inventory():
              # Only an inventory request; never boot, create, install or launch a device.
              import selectors
              import signal
              need(callable(getattr(os, 'waitid', None)) and
                   all(hasattr(os, name) for name in ('P_PID', 'WEXITED', 'WNOHANG', 'WNOWAIT', 'CLD_EXITED')) and
                   signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL)
              process = subprocess.Popen(['xcrun', 'simctl', 'list', 'runtimes', '--json'],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              output = bytearray()
              used = 0
              selector = selectors.DefaultSelector()
              deadline = time.monotonic() + 15
              try:
                  for pipe in (process.stdout, process.stderr):
                      os.set_blocking(pipe.fileno(), False)
                      selector.register(pipe, selectors.EVENT_READ)
                  while selector.get_map():
                      clock()
                      need(time.monotonic() < deadline)
                      for key, _ in selector.select(min(0.1, max(0, deadline-time.monotonic()))):
                          raw = os.read(key.fileobj.fileno(), 65536)
                          if not raw:
                              selector.unregister(key.fileobj)
                              continue
                          used += len(raw)
                          need(used <= 1024*1024)
                          if key.fileobj is process.stdout:
                              output.extend(raw)
                  while True:
                      clock()
                      need(time.monotonic() < deadline)
                      info = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if info is not None:
                          need(info.si_pid == process.pid and info.si_code == os.CLD_EXITED and info.si_status == 0)
                          break
                      time.sleep(min(0.01, max(0, deadline-time.monotonic())))
                  clock()
                  return bytes(output)
              finally:
                  # Only this newly owned command group; never a simulator service or device.
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=2)
                  selector.close()
                  process.stdout.close()
                  process.stderr.close()


          def version(text):
              import re
              need(type(text) is str and re.fullmatch(r'[0-9]{1,3}(\.[0-9]{1,3}){0,2}', text) is not None)
              parts = tuple(int(n) for n in text.split('.'))
              need(parts[0] > 0 and all(n <= 255 for n in parts[1:]))
              return parts + (0,)*(3-len(parts))


          def simulator_header(raw):
              import struct
              # Independently read only the thin ARM64 header/build metadata. This is not
              # a loader or a dependency-graph/signature/authenticity validator. Format:
              # https://github.com/apple-oss-distributions/cctools/blob/7a5450708479bbff61527d5e0c32a3f7b7e4c1d0/include/mach-o/loader.h
              need(len(raw) >= 32)
              magic, cpu, subtype, kind, count, size, flags, reserved = struct.unpack_from('<8I', raw)
              need(magic == 0xfeedfacf and cpu == 0x0100000c and subtype == 0 and kind == 2 and reserved == 0)
              need(0 < count <= 4096 and 8*count <= size <= 1024*1024 and 32+size <= len(raw))
              offset = 32
              builds = []
              for _ in range(count):
                  need(offset+8 <= 32+size)
                  command_id, length = struct.unpack_from('<2I', raw, offset)
                  need(length >= 8 and length % 8 == 0 and offset+length <= 32+size)
                  # Legacy minimum-version commands do not establish the simulator platform.
                  need(command_id not in (0x24, 0x25, 0x2f, 0x30))
                  if command_id == 0x32:
                      need(length >= 24)
                      platform_id, minimum, sdk, tools = struct.unpack_from('<4I', raw, offset+8)
                      need(platform_id == 7 and length == 24+8*tools and tools <= 64)
                      unpack = lambda v: (v >> 16, (v >> 8) & 255, v & 255)
                      need(0 < unpack(minimum)[0] <= unpack(sdk)[0] and unpack(minimum) <= unpack(sdk))
                      builds.append(unpack(minimum))
                  offset += length
              need(offset == 32+size and len(builds) == 1)
              return builds[0]


          class DarwinCommandCleanupRefused(RuntimeError):
              def __init__(self, originals):
                  super().__init__('Darwin command group cleanup refused')
                  self.originals = tuple(originals)


          def darwin_owned_command_cleanup(process, *, deadline, now=time.monotonic):
              """Unwired same-group signal check, never a simulator/service ownership lease.

              Caller owns this fresh Popen session and must always reap it afterward. No
              concurrent reaper may steal the leader. EPERM is admitted only for two exact
              singleton group observations around a stable nonreaping terminal child.
              """
              import ctypes
              import errno
              import platform
              import signal
              import struct
              records=[]
              last=None
              def record(kind,status,error,raw):
                  need(type(raw) is bytes and len(raw)<=128)
                  value=json.dumps({'kind':kind,'status':status,'errno':error,'rawHex':raw.hex()},
                                   sort_keys=True,separators=(',',':')).encode()
                  need(len(records)<16 and sum(map(len,records))+len(value)<=4096)
                  records.append(value)
              def check():
                  nonlocal last
                  tick=now()
                  need(type(tick) in (int,float) and math.isfinite(tick) and
                       (last is None or last<=tick) and tick<=deadline)
                  last=tick
              def wait_original():
                  check()
                  info=os.waitid(os.P_PID,process.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT)
                  if info is None:
                      record('wait-pending',0,0,b'');check();return None
                  fields=tuple(getattr(info,key) for key in ('si_pid','si_uid','si_signo','si_status','si_code'))
                  need(all(type(v) is int and -(2**63)<=v<2**63 for v in fields))
                  record('wait-terminal',0,0,struct.pack('<5q',*fields));check()
                  need(fields[0]==process.pid and 0<=fields[1]<=2**32-1 and fields[2]==signal.SIGCHLD and
                       fields[4] in (os.CLD_EXITED,os.CLD_KILLED,os.CLD_DUMPED))
                  # si_uid is retained information, never child ownership authority.
                  return fields
              def singleton():
                  check();buffer=(ctypes.c_int32*2)();ctypes.set_errno(0)
                  count=query(process.pid,ctypes.byref(buffer),ctypes.sizeof(buffer))
                  record('group',count,ctypes.get_errno(),bytes(buffer));check()
                  need(type(count) is int and count==1 and ctypes.get_errno()==0 and buffer[0]==process.pid)
              try:
                  need(sys.platform=='darwin' and platform.machine()=='arm64' and
                       ctypes.sizeof(ctypes.c_void_p)==8 and sys.byteorder=='little')
                  need(type(process.pid) is int and 1<process.pid<=2147483647 and process.returncode is None)
                  need(callable(now) and type(deadline) in (int,float) and math.isfinite(deadline))
                  check();need(deadline-last<=2)
                  need(signal.getsignal(signal.SIGCHLD)==signal.SIG_DFL)
                  before=wait_original()
                  if before is not None:
                      library=ctypes.CDLL('/usr/lib/libproc.dylib',use_errno=True)
                      query=library.proc_listpgrppids
                      query.argtypes=[ctypes.c_int,ctypes.c_void_p,ctypes.c_int];query.restype=ctypes.c_int
                      singleton()
                  check()
                  signal_error=None
                  try:
                      os.killpg(process.pid,signal.SIGKILL)
                      record('group-signal',0,0,b'')
                  except OSError as error:
                      record('group-signal',-1,error.errno,b'');signal_error=error
                  check()
                  if signal_error is not None:
                      need(isinstance(signal_error,PermissionError) and signal_error.errno==errno.EPERM and before is not None)
                      singleton();need(wait_original()==before)
                  check()
                  return tuple(records)
              except BaseException as error:
                  if not isinstance(error,Exception):
                      error.command_cleanup_originals=tuple(records)
                      raise
                  raise DarwinCommandCleanupRefused(records) from None


          class SimulatorCommandRefused(RuntimeError):
              def __init__(self, reason, cleanup_failures=()):
                  super().__init__('simulator command refused')
                  self.reason = reason
                  self.cleanup_failures = tuple(cleanup_failures)


          def bounded_simulator_command(arguments, *, device_set, deadline, output_limit, stopped=None, prepared_launch=None, cleanup_originals=None, command_originals=None):
              """Unwired simctl client adapter; not containment of delegated services/apps.

              Requires non-reaping waitid (macOS Python 3.13+) and the default SIGCHLD
              disposition. No concurrent child reaper may steal this direct child.
              """
              import math
              import re
              import selectors
              import signal
              stage = 'admission'
              process = None
              selector = None
              directory_fd = None
              primary = None
              cleanup = []
              output = bytearray()
              last = None
              retained_bytes = 0
              def retain(kind, raw):
                  nonlocal retained_bytes
                  if command_originals is None:
                      return
                  need(type(raw) is bytes and len(raw)<=65536)
                  row=json.dumps({'kind':kind,'rawHex':raw.hex()},sort_keys=True,separators=(',',':')).encode()
                  need(len(command_originals)<1024 and retained_bytes+len(row)<=2*(output_limit+65536)+131072)
                  list.append(command_originals,row)
                  retained_bytes+=len(row)
              def check():
                  nonlocal last, stage
                  stage = 'deadline'
                  tick = time.monotonic()
                  need(math.isfinite(tick) and (last is None or tick >= last) and tick < deadline)
                  last = tick
                  if stopped is not None:
                      stage = 'stop'
                      value = stopped()
                      need(type(value) is bool and not value)
                  return tick
              try:
                  need(type(deadline) in (int, float) and math.isfinite(deadline))
                  need(type(output_limit) is int and 0 < output_limit <= 1024*1024)
                  need(stopped is None or callable(stopped))
                  need(cleanup_originals is None or (type(cleanup_originals) is list and not cleanup_originals))
                  need(command_originals is None or (type(command_originals) is list and not command_originals))
                  need(command_originals is None or command_originals is not cleanup_originals)
                  need(callable(getattr(BaseException, 'add_note', None)))
                  need(callable(getattr(os, 'waitid', None)) and
                       all(hasattr(os, name) for name in ('P_PID', 'WEXITED', 'WNOHANG', 'WNOWAIT', 'CLD_EXITED')))
                  need(signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL)
                  need(0 < deadline-check() <= 15)
                  stage = 'arguments'
                  need(type(arguments) is tuple and 0 < len(arguments) <= 4 and
                       all(type(arg) is str and 0 < len(arg.encode()) <= 4096 and
                           not any(ord(c) < 32 or ord(c) == 127 for c in arg) for arg in arguments))
                  operation = arguments[0]
                  if operation == 'list':
                      need(arguments in (('list', 'devices', '--json'), ('list', 'runtimes', '--json'),
                                         ('list', 'devicetypes', '--json')))
                  elif operation == 'runtime':
                      need(arguments == ('runtime', 'list', '--json'))
                  elif operation == 'get_app_container':
                      need(len(arguments) == 4 and
                           re.fullmatch(r'[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}', arguments[1]) is not None and
                           re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*(?:\.[A-Za-z0-9][A-Za-z0-9-]*)+', arguments[2]) is not None and
                           arguments[3] in ('app', 'data'))
                  elif operation == 'create':
                      need(len(arguments) == 4 and re.fullmatch(r'bw-asset-audit-[a-f0-9]{32}', arguments[1]) is not None and
                           re.fullmatch(r'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+', arguments[2]) is not None and
                           re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]{1,3}-[0-9]{1,3}(?:-[0-9]{1,3})?', arguments[3]) is not None)
                  else:
                      need(operation in ('boot', 'bootstatus', 'install', 'launch', 'terminate', 'shutdown', 'delete'))
                      expected = 2 if operation in ('boot', 'shutdown', 'delete') else 3
                      need(len(arguments) == expected and re.fullmatch(r'[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}', arguments[1]) is not None)
                      if operation == 'bootstatus':
                          need(arguments[2] == '-b')
                      elif operation == 'install':
                          need(Path(arguments[2]).is_absolute() and arguments[2].endswith('.app'))
                      elif operation in ('launch', 'terminate'):
                          need(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*(?:\.[A-Za-z0-9][A-Za-z0-9-]*)+', arguments[2]) is not None)
                  need(prepared_launch is None or (operation == 'launch' and
                       type(prepared_launch) is PreparedInstalledObservation))
                  stage = 'device-set'
                  directory = Path(device_set)
                  need(directory.is_absolute() and directory.resolve(strict=True) == directory and
                       re.fullmatch(r'bw-ios-assets-[a-f0-9]{32}\.deviceset', directory.name) is not None)
                  directory_fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  identity = os.fstat(directory_fd)
                  need(stat.S_ISDIR(identity.st_mode))
                  # Path snapshots are not an atomic namespace lease; actual ownership is
                  # independently admitted before any future wiring of this adapter.
                  def same_directory():
                      current = directory.stat(follow_symlinks=False)
                      need(stat.S_ISDIR(current.st_mode) and
                           (current.st_dev, current.st_ino) == (identity.st_dev, identity.st_ino) and
                           directory.resolve(strict=True) == directory)
                  same_directory()
                  check()
                  stage = 'spawn'
                  selector = selectors.DefaultSelector()
                  environment = {key: value for key, value in os.environ.items() if key in (
                      'PATH', 'HOME', 'TMPDIR', 'DEVELOPER_DIR', 'SDKROOT', 'LANG', 'LC_ALL', '__CF_USER_TEXT_ENCODING')}
                  if prepared_launch is not None:
                      stage = 'launch-binding'
                      audit_path = prepared_launch._launch_path(directory, arguments[1], arguments[2], deadline, starting=True)
                      check()
                      stage = 'launch-binding'
                      prepared_launch._parent_matches()
                      environment['SIMCTL_CHILD_BW_EMBEDDED_ASSET_AUDIT_PATH'] = audit_path
                  stage = 'spawn'
                  process = subprocess.Popen(['xcrun', 'simctl', '--set', str(directory), *arguments],
                      stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      start_new_session=True, close_fds=True, env=environment)
                  for pipe in (process.stdout, process.stderr):
                      os.set_blocking(pipe.fileno(), False)
                      selector.register(pipe, selectors.EVENT_READ)
                  used = 0
                  while True:
                      current = check()
                      for key, _ in selector.select(min(0.05, deadline-current)):
                          stage = 'read'
                          raw = os.read(key.fileobj.fileno(), 65536)
                          retain('stdout' if key.fileobj is process.stdout else 'stderr',raw)
                          if not raw:
                              selector.unregister(key.fileobj)
                              continue
                          used += len(raw)
                          stage = 'output'
                          need(used <= output_limit)
                          if key.fileobj is process.stdout:
                              output.extend(raw)
                      stage = 'exit-observation'
                      # Never poll()/wait() before the final killpg: retain the direct child
                      # PID until signaling the group so its numeric identity cannot recycle.
                      info = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if info is not None:
                          import struct
                          fields=tuple(getattr(info,key) for key in ('si_pid','si_uid','si_signo','si_status','si_code'))
                          need(all(type(value) is int and -(2**63)<=value<2**63 for value in fields))
                          retain('wait-terminal',struct.pack('<5q',*fields))
                          need(info.si_pid == process.pid)
                          if info.si_code != os.CLD_EXITED or info.si_status != 0:
                              stage = 'exit'
                              raise ValueError('command exit refused')
                          if not selector.get_map():
                              break
                  check()
                  stage = 'device-set'
                  same_directory()
              except BaseException as error:
                  primary = error
                  reason = stage
              finally:
                  if process is not None:
                      # Signal only this newly created command session, before reaping its
                      # leader. Descendants that leave the group/services are not contained.
                      try:
                          if sys.platform == 'darwin':
                              originals = darwin_owned_command_cleanup(process, deadline=time.monotonic()+2)
                              for row in originals:
                                  retain('darwin-cleanup',row)
                              if cleanup_originals is not None:
                                  list.extend(cleanup_originals, originals)
                          else:
                              os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      except BaseException as error:
                          if cleanup_originals is not None:
                              list.extend(cleanup_originals, getattr(error,'originals',
                                  getattr(error,'command_cleanup_originals',())))
                          cleanup.append('group-signal')
                          if not isinstance(error, Exception):
                              if primary is not None:
                                  error.command_primary_error = primary
                              primary, reason = error, 'cleanup'
                      try:
                          code=process.wait(timeout=2)
                          retain('leader-reaped',str(code).encode('ascii'))
                      except BaseException as error:
                          cleanup.append('leader-reap')
                          if not isinstance(error, Exception):
                              if primary is not None:
                                  error.command_primary_error = primary
                              primary, reason = error, 'cleanup'
                      for pipe in (process.stdout, process.stderr):
                          try:
                              pipe.close()
                          except BaseException as error:
                              cleanup.append('pipe-close')
                              if not isinstance(error, Exception):
                                  if primary is not None:
                                      error.command_primary_error = primary
                                  primary, reason = error, 'cleanup'
                  if selector is not None:
                      try:
                          selector.close()
                      except BaseException as error:
                          cleanup.append('selector-close')
                          if not isinstance(error, Exception):
                              if primary is not None:
                                  error.command_primary_error = primary
                              primary, reason = error, 'cleanup'
                  if directory_fd is not None:
                      try:
                          os.close(directory_fd)
                      except BaseException as error:
                          cleanup.append('directory-close')
                          if not isinstance(error, Exception):
                              if primary is not None:
                                  error.command_primary_error = primary
                              primary, reason = error, 'cleanup'
              if primary is None and not cleanup and prepared_launch is not None:
                  try:
                      stage = 'launch-binding'
                      prepared_launch._launch_path(directory, arguments[1], arguments[2], deadline, starting=False)
                      check()  # Recheck after readback and command cleanup, before returning.
                  except BaseException as error:
                      primary, reason = error, stage
              if primary is not None:
                  if not isinstance(primary, Exception):
                      if cleanup:
                          primary.add_note('simulator command cleanup incomplete: '+','.join(cleanup))
                      raise primary
                  raise SimulatorCommandRefused(reason, cleanup) from None
              if cleanup:
                  raise SimulatorCommandRefused('cleanup', cleanup)
              return bytes(output)


          def runtime_admission():
              import platform
