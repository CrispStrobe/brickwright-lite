name: mobile

on:
  workflow_dispatch:
    inputs:
      sign_ios:
        description: >-
          Also build a SIGNED iOS IPA. Off by default because it talks to
          App Store Connect and will create/download an Apple signing
          certificate and provisioning profile for the team.
        type: boolean
        default: false
      device_ipa:
        description: >-
          Build a SIDELOADABLE iOS IPA for the registered test iPad
          (ad-hoc / "release-testing" export). Unlike the App Store IPA
          from sign_ios, this one embeds a profile that names the device,
          so `xcrun devicectl device install app` accepts it.
        type: boolean
        default: false
      retain_ios_audit_inputs:
        description: Retain bounded unsigned iOS build inputs for independent audit; does not launch the app.
        type: boolean
        default: false
      ios_audit_runtime:
        description: Optional exact installed iOS runtime identifier for admission only; never launches an app.
        type: string
        default: ''
      ios_audit_runtime_build:
        description: Exact installed runtime build required when ios_audit_runtime is set.
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web bundle (vendor + integrate + webpack)
        run: bash scripts/vercel-build.sh || (echo "retrying web build" && bash scripts/vercel-build.sh)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: packages/scratch-gui/build
          retention-days: 3

  android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # v3.2.2's `packages` default was 'tools platform-tools', and Google has
      # REMOVED the legacy `tools` package from the SDK repository — so
      # sdkmanager exits 1 with `Warning: Failed to find package 'tools'` and
      # the whole android job dies before it builds anything. Nothing in this
      # repo changed; the remote repository did. It took out v0.1.17 and
      # v0.1.18 (runs 36234004552 and 36237451888), while ios-signed succeeded
      # on both — so tagging released iOS and silently released no Android.
      #
      # v4.0.4 dropped `tools` from the default (and moves to node24, which
      # also clears the Node 20 deprecation warning this step was emitting).
      # `packages` is ALSO named explicitly rather than left to the default:
      # the default is what broke us, and a default we did not choose can
      # change again without notice.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build Android APK (debug, unsigned)
        working-directory: apps/tauri
        run: |
          npx tauri android init --ci
          # `tauri android init` templates TAURI'S OWN logo into gen/android and
          # never looks at src-tauri/icons/android, so every APK shipped the
          # default launcher icon.
          node scripts/patch-mobile-icons.mjs android
          # tauri-plugin-blec's Android library requires minSdk 26; the generated
          # project defaults to 24, which fails the manifest merge.
          sed -i 's/minSdk = 24/minSdk = 26/' src-tauri/gen/android/app/build.gradle.kts
          # Allow cleartext ws:// to LAN bridge servers (bridge-mode hardware
          # over WiFi). The manifest ships a ${usesCleartextTraffic} placeholder.
          sed -i 's/${usesCleartextTraffic}/true/' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Camera + microphone for getUserMedia (Video Sensing, loudness, record
          # a sound). MODIFY_AUDIO_SETTINGS is required or the WebView gets the mic
          # grant but still fails with NotReadableError. Features are required=false
          # so devices without a camera can still install.
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$MANIFEST"
          # Request the runtime camera/mic permissions on launch (Tauri never does).
          cp android-overlay/MainActivity.kt \
            src-tauri/gen/android/app/src/main/java/com/crispstrobe/brickwright/MainActivity.kt
          npx tauri android build --apk --debug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-android-apk
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      # On a tag, attach the APK to the same draft GitHub Release the desktop
      # bundles go to (release.yml), so all platforms appear together.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    needs: build-web
    runs-on: macos-latest
    # Simulator-only, so no Apple signing certificate or developmentTeam is
    # needed. A real-device/TestFlight build still would be. This job is
    # blocking: it used to be continue-on-error, which hid a genuine link
    # failure (missing ExternalAccessory) for a month.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      # Frameworks come from bundle.iOS.frameworks in tauri.conf.json, and the
      # iOS-only Info.plist keys (ATS local networking, MFi accessory protocols,
      # camera/mic/speech usage strings) from src-tauri/Info.ios.plist — both
      # survive project regeneration, so there is nothing to patch here. Anything
      # this step would have to fix up belongs in one of those two files instead,
      # or local builds silently differ from CI.
      - name: Retain unsigned iOS inputs before build
        if: github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018')
        timeout-minutes: 3
        env:
          BW_RETAIN_IOS_INPUTS: ${{ inputs.retain_ios_audit_inputs }}
          BW_SIGN_IOS: ${{ inputs.sign_ios }}
          BW_DEVICE_IPA: ${{ inputs.device_ipa }}
        run: |
          set -euo pipefail
          set -o noclobber
          # BEGIN IOS INPUT RETENTION
          cat > "$RUNNER_TEMP/bw-ios-audit-capture.py" <<'PY'
          """Retain bounded unsigned build inputs; never start an app or claim active use."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import stat
          import subprocess
          import sys
          import time

          FILE = 64 * 1024 * 1024
          TOTAL = 512 * 1024 * 1024
          COUNT = 8192
          START = time.monotonic()
          LAST = START
          ROOT = Path(os.environ['GITHUB_WORKSPACE'])
          OUT = Path(os.environ['RUNNER_TEMP']) / 'bw-ios-audit-inputs'
          ROWS = []
          USED = 0


          def need(ok):
              if not ok:
                  raise ValueError('input retention refused')


          def clock():
              global LAST
              tick = time.monotonic()
              need(tick >= LAST and tick-START <= 120)
              LAST = tick


          def command(args, cwd=ROOT):
              clock()
              result = subprocess.run(args, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      timeout=15, check=True)
              need(len(result.stdout) <= 4*1024*1024)
              clock()
              return result.stdout


          def canonical(name):
              need(type(name) is str and 0 < len(name.encode()) <= 512 and
                   all(p not in ('', '.', '..') for p in name.split('/')) and
                   not any(ord(c) < 32 or ord(c) == 127 or c in '\\:' for c in name) and
                   all(part not in ('CLAUDE.md', 'AGENTS.md', '.env') and not part.startswith('.env.')
                       for part in name.split('/')))


          def read_file(file, cap=FILE):
              clock()
              # Refuse links in every component, not only the final name.
              for part in [file, *file.parents]:
                  need(not part.is_symlink())
              before = file.stat()
              need(stat.S_ISREG(before.st_mode) and before.st_size <= cap)
              fd = os.open(file, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  need((opened.st_dev, opened.st_ino) == (before.st_dev, before.st_ino))
                  raw = stream.read(cap+1)
                  after = os.fstat(stream.fileno())
              need(len(raw) == before.st_size and len(raw) <= cap and
                   (before.st_size, before.st_mtime_ns, before.st_ctime_ns) ==
                   (after.st_size, after.st_mtime_ns, after.st_ctime_ns))
              clock()
              return raw


          def retain(name, raw):
              global USED
              canonical(name)
              cap = 256*1024*1024 if name == 'native/executable' else FILE
              need(len(ROWS) < COUNT and len(raw) <= cap and USED+len(raw) <= TOTAL and
                   name.casefold() not in {r['path'].casefold() for r in ROWS})
              file = OUT / name
              file.parent.mkdir(parents=True, exist_ok=True)
              with file.open('xb') as stream:
                  stream.write(raw)
              ROWS.append({'path': name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
              USED += len(raw)


          def sources():
              raw = command(['git', 'ls-files', '-z', '--', 'apps/tauri/src-tauri',
                             'apps/tauri/scripts', 'apps/tauri/package.json', 'apps/tauri/package-lock.json',
                             '.github/workflows/mobile.yml', 'vendor-pins.json'])
              names = sorted(raw.decode().rstrip('\0').split('\0'))
              need(0 < len(names) <= COUNT)
              return names


          def web_files():
              web = ROOT/'packages/scratch-gui/build'
              names = []
              for base, dirs, files in os.walk(web, followlinks=False):
                  clock()
                  for name in dirs:
                      need(not (Path(base)/name).is_symlink())
                  for name in files:
                      file = Path(base)/name
                      relative = file.relative_to(web).as_posix()
                      canonical(relative)
                      names.append(relative)
                      need(len(names) <= COUNT)
              need(names)
              return sorted(names)


          def record_sources():
              for name in sources():
                  canonical(name)
                  raw = read_file(ROOT/name)
                  # Capture only exact tracked source bytes, not an uncommitted mutation.
                  need(raw == command(['git', 'show', 'HEAD:'+name]))
                  retain('source/'+name, raw)
              for name in web_files():
                  retain('web/'+name, read_file(ROOT/'packages/scratch-gui/build'/name))


          def toolchain_observation(phase, manifest):
              # Observe installed candidates only. No binaries or host paths are published.
              directory = Path(os.environ['RUNNER_TEMP']) / 'bw-ios-toolchain-inputs'
              if phase == 'before':
                  directory.mkdir(exist_ok=False)
              else:
                  need(directory.is_dir() and not directory.is_symlink())
              def installed(args):
                  value = command(args).decode().strip()
                  need(value and '\n' not in value)
                  return Path(value).resolve(strict=True)
              paths = {
                  'rustc': installed(['rustup', 'which', 'rustc']),
                  'cargo': installed(['rustup', 'which', 'cargo']),
                  'appleClang': installed(['xcrun', '--sdk', 'iphonesimulator', '--find', 'clang']),
                  'xcodeBuild': installed(['xcrun', '--find', 'xcodebuild']),
                  'simulatorSDKSettings': installed(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-path']) / 'SDKSettings.json'
              }
              identities = {}
              for role, file in paths.items():
                  raw = read_file(file, 256*1024*1024 if role != 'simulatorSDKSettings' else 1024*1024)
                  need(raw)
                  identities[role] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              value = {
                  'schema': 'brickwright.ios-toolchain-observations.v1', 'phase': phase,
                  'commit': manifest['commit'], 'tree': manifest['tree'],
                  'runID': manifest['runID'], 'attempt': manifest['attempt'],
                  'job': manifest['job'], 'ref': manifest['ref'],
                  'producerSHA256': hashlib.sha256(read_file(Path(__file__))).hexdigest(),
                  'tools': identities, 'compilerUsedInputsProved': False,
                  'completeToolchainClosureQualified': False, 'sdkContentsQualified': False,
                  'effectiveConfigurationJoined': False, 'actualAppObserved': False,
                  'resourceLifetimeQualified': False
              }
              if phase == 'after':
                  original = read_file(directory / 'before.json', 1024*1024)
                  before = json.loads(original)
                  expected = dict(value, phase='before')
                  need(before == expected)
                  value['beforeSHA256'] = hashlib.sha256(original).hexdigest()
              with (directory / (phase+'.json')).open('x') as stream:
                  json.dump(value, stream, sort_keys=True)


          def bounded_inventory():
              # Only an inventory request; never boot, create, install or launch a device.
              import selectors
              import signal
              need(callable(getattr(os, 'waitid', None)) and
                   all(hasattr(os, name) for name in ('P_PID', 'WEXITED', 'WNOHANG', 'WNOWAIT', 'CLD_EXITED')) and
                   signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL)
              process = subprocess.Popen(['xcrun', 'simctl', 'list', 'runtimes', '--json'],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              output = bytearray()
              used = 0
              selector = selectors.DefaultSelector()
              deadline = time.monotonic() + 15
              try:
                  for pipe in (process.stdout, process.stderr):
                      os.set_blocking(pipe.fileno(), False)
                      selector.register(pipe, selectors.EVENT_READ)
                  while selector.get_map():
                      clock()
                      need(time.monotonic() < deadline)
                      for key, _ in selector.select(min(0.1, max(0, deadline-time.monotonic()))):
                          raw = os.read(key.fileobj.fileno(), 65536)
                          if not raw:
                              selector.unregister(key.fileobj)
                              continue
                          used += len(raw)
                          need(used <= 1024*1024)
                          if key.fileobj is process.stdout:
                              output.extend(raw)
                  while True:
                      clock()
                      need(time.monotonic() < deadline)
                      info = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if info is not None:
                          need(info.si_pid == process.pid and info.si_code == os.CLD_EXITED and info.si_status == 0)
                          break
                      time.sleep(min(0.01, max(0, deadline-time.monotonic())))
                  clock()
                  return bytes(output)
              finally:
                  # Only this newly owned command group; never a simulator service or device.
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=2)
                  selector.close()
                  process.stdout.close()
                  process.stderr.close()


          def version(text):
              import re
              need(type(text) is str and re.fullmatch(r'[0-9]{1,3}(\.[0-9]{1,3}){0,2}', text) is not None)
              parts = tuple(int(n) for n in text.split('.'))
              need(parts[0] > 0 and all(n <= 255 for n in parts[1:]))
              return parts + (0,)*(3-len(parts))


          def simulator_header(raw):
              import struct
              # Independently read only the thin ARM64 header/build metadata. This is not
              # a loader or a dependency-graph/signature/authenticity validator. Format:
              # https://github.com/apple-oss-distributions/cctools/blob/7a5450708479bbff61527d5e0c32a3f7b7e4c1d0/include/mach-o/loader.h
              need(len(raw) >= 32)
              magic, cpu, subtype, kind, count, size, flags, reserved = struct.unpack_from('<8I', raw)
              need(magic == 0xfeedfacf and cpu == 0x0100000c and subtype == 0 and kind == 2 and reserved == 0)
              need(0 < count <= 4096 and 8*count <= size <= 1024*1024 and 32+size <= len(raw))
              offset = 32
              builds = []
              for _ in range(count):
                  need(offset+8 <= 32+size)
                  command_id, length = struct.unpack_from('<2I', raw, offset)
                  need(length >= 8 and length % 8 == 0 and offset+length <= 32+size)
                  # Legacy minimum-version commands do not establish the simulator platform.
                  need(command_id not in (0x24, 0x25, 0x2f, 0x30))
                  if command_id == 0x32:
                      need(length >= 24)
                      platform_id, minimum, sdk, tools = struct.unpack_from('<4I', raw, offset+8)
                      need(platform_id == 7 and length == 24+8*tools and tools <= 64)
                      unpack = lambda v: (v >> 16, (v >> 8) & 255, v & 255)
                      need(0 < unpack(minimum)[0] <= unpack(sdk)[0] and unpack(minimum) <= unpack(sdk))
                      builds.append(unpack(minimum))
                  offset += length
              need(offset == 32+size and len(builds) == 1)
              return builds[0]


          class SimulatorCommandRefused(RuntimeError):
              def __init__(self, reason, cleanup_failures=()):
                  super().__init__('simulator command refused')
                  self.reason = reason
                  self.cleanup_failures = tuple(cleanup_failures)


          def bounded_simulator_command(arguments, *, device_set, deadline, output_limit, stopped=None):
              """Unwired simctl client adapter; not containment of delegated services/apps.

              Requires non-reaping waitid (macOS Python 3.13+) and the default SIGCHLD
              disposition. No concurrent child reaper may steal this direct child.
              """
              import math
              import re
              import selectors
              import signal
              stage = 'admission'
              process = None
              selector = None
              directory_fd = None
              primary = None
              cleanup = []
              output = bytearray()
              last = None
              def check():
                  nonlocal last, stage
                  stage = 'deadline'
                  tick = time.monotonic()
                  need(math.isfinite(tick) and (last is None or tick >= last) and tick < deadline)
                  last = tick
                  if stopped is not None:
                      stage = 'stop'
                      value = stopped()
                      need(type(value) is bool and not value)
                  return tick
              try:
                  need(type(deadline) in (int, float) and math.isfinite(deadline))
                  need(type(output_limit) is int and 0 < output_limit <= 1024*1024)
                  need(stopped is None or callable(stopped))
                  need(callable(getattr(BaseException, 'add_note', None)))
                  need(callable(getattr(os, 'waitid', None)) and
                       all(hasattr(os, name) for name in ('P_PID', 'WEXITED', 'WNOHANG', 'WNOWAIT', 'CLD_EXITED')))
                  need(signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL)
                  need(0 < deadline-check() <= 15)
                  stage = 'arguments'
                  need(type(arguments) is tuple and 0 < len(arguments) <= 4 and
                       all(type(arg) is str and 0 < len(arg.encode()) <= 4096 and
                           not any(ord(c) < 32 or ord(c) == 127 for c in arg) for arg in arguments))
                  operation = arguments[0]
                  if operation == 'list':
                      need(arguments in (('list', 'devices', '--json'), ('list', 'runtimes', '--json'),
                                         ('list', 'devicetypes', '--json')))
                  elif operation == 'runtime':
                      need(arguments == ('runtime', 'list', '--json'))
                  elif operation == 'create':
                      need(len(arguments) == 4 and re.fullmatch(r'bw-asset-audit-[a-f0-9]{32}', arguments[1]) is not None and
                           re.fullmatch(r'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+', arguments[2]) is not None and
                           re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]{1,3}-[0-9]{1,3}(?:-[0-9]{1,3})?', arguments[3]) is not None)
                  else:
                      need(operation in ('boot', 'bootstatus', 'install', 'launch', 'terminate', 'shutdown', 'delete'))
                      expected = 2 if operation in ('boot', 'shutdown', 'delete') else 3
                      need(len(arguments) == expected and re.fullmatch(r'[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}', arguments[1]) is not None)
                      if operation == 'bootstatus':
                          need(arguments[2] == '-b')
                      elif operation == 'install':
                          need(Path(arguments[2]).is_absolute() and arguments[2].endswith('.app'))
                      elif operation in ('launch', 'terminate'):
                          need(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*(?:\.[A-Za-z0-9][A-Za-z0-9-]*)+', arguments[2]) is not None)
                  stage = 'device-set'
                  directory = Path(device_set)
                  need(directory.is_absolute() and directory.resolve(strict=True) == directory and
                       re.fullmatch(r'bw-ios-assets-[a-f0-9]{32}\.deviceset', directory.name) is not None)
                  directory_fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  identity = os.fstat(directory_fd)
                  need(stat.S_ISDIR(identity.st_mode))
                  # Path snapshots are not an atomic namespace lease; actual ownership is
                  # independently admitted before any future wiring of this adapter.
                  def same_directory():
                      current = directory.stat(follow_symlinks=False)
                      need(stat.S_ISDIR(current.st_mode) and
                           (current.st_dev, current.st_ino) == (identity.st_dev, identity.st_ino) and
                           directory.resolve(strict=True) == directory)
                  same_directory()
                  check()
                  stage = 'spawn'
                  selector = selectors.DefaultSelector()
                  environment = {key: value for key, value in os.environ.items() if key in (
                      'PATH', 'HOME', 'TMPDIR', 'DEVELOPER_DIR', 'SDKROOT', 'LANG', 'LC_ALL', '__CF_USER_TEXT_ENCODING')}
                  process = subprocess.Popen(['xcrun', 'simctl', '--set', str(directory), *arguments],
                      stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      start_new_session=True, close_fds=True, env=environment)
                  for pipe in (process.stdout, process.stderr):
                      os.set_blocking(pipe.fileno(), False)
                      selector.register(pipe, selectors.EVENT_READ)
                  used = 0
                  while True:
                      current = check()
                      for key, _ in selector.select(min(0.05, deadline-current)):
                          stage = 'read'
                          raw = os.read(key.fileobj.fileno(), 65536)
                          if not raw:
                              selector.unregister(key.fileobj)
                              continue
                          used += len(raw)
                          stage = 'output'
                          need(used <= output_limit)
                          if key.fileobj is process.stdout:
                              output.extend(raw)
                      stage = 'exit-observation'
                      # Never poll()/wait() before the final killpg: retain the direct child
                      # PID until signaling the group so its numeric identity cannot recycle.
                      info = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if info is not None:
                          need(info.si_pid == process.pid)
                          if info.si_code != os.CLD_EXITED or info.si_status != 0:
                              stage = 'exit'
                              raise ValueError('command exit refused')
                          if not selector.get_map():
                              break
                  check()
                  stage = 'device-set'
                  same_directory()
              except BaseException as error:
                  primary = error
                  reason = stage
              finally:
                  if process is not None:
                      # Signal only this newly created command session, before reaping its
                      # leader. Descendants that leave the group/services are not contained.
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      except Exception:
                          cleanup.append('group-signal')
                      try:
                          process.wait(timeout=2)
                      except Exception:
                          cleanup.append('leader-reap')
                      for pipe in (process.stdout, process.stderr):
                          try:
                              pipe.close()
                          except Exception:
                              cleanup.append('pipe-close')
                  if selector is not None:
                      try:
                          selector.close()
                      except Exception:
                          cleanup.append('selector-close')
                  if directory_fd is not None:
                      try:
                          os.close(directory_fd)
                      except Exception:
                          cleanup.append('directory-close')
              if primary is not None:
                  if not isinstance(primary, Exception):
                      if cleanup:
                          primary.add_note('simulator command cleanup incomplete: '+','.join(cleanup))
                      raise primary
                  raise SimulatorCommandRefused(reason, cleanup) from None
              if cleanup:
                  raise SimulatorCommandRefused('cleanup', cleanup)
              return bytes(output)


          def runtime_admission():
              import platform
              import re
              directory = Path(os.environ['RUNNER_TEMP']) / 'bw-ios-runtime-admission'
              directory.mkdir(exist_ok=False)
              value = {'schema': 'brickwright.ios-runtime-candidate.v1', 'status': 'partial',
                  'refusal': 'runtime-admission-incomplete', 'launchAllowed': False,
                  'actualAppObserved': False, 'deviceAdmitted': False,
                  'runtimeArchitectureQualified': False, 'resourceLifetimeQualified': False,
                  'executableLoadabilityQualified': False, 'officialArtifactAuthenticated': False}
              try:
                  value['refusal'] = 'runtime-request'
                  requested = os.environ.get('BW_IOS_AUDIT_RUNTIME', '')
                  build = os.environ.get('BW_IOS_AUDIT_RUNTIME_BUILD', '')
                  need(re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]{1,3}-[0-9]{1,3}(?:-[0-9]{1,3})?', requested) is not None)
                  need(re.fullmatch(r'[0-9]{1,3}[A-Z][0-9]{1,5}[a-z]?', build) is not None)
                  value['refusal'] = 'host-architecture'
                  need(platform.system() == 'Darwin' and platform.machine() == 'arm64')
                  value['refusal'] = 'retained-identity'
                  original = read_file(OUT/'completed.json', 8*1024*1024)
                  manifest = json.loads(original)
                  need(manifest['status'] == 'retained-candidates-only')
                  for field, env in (('commit', 'GITHUB_SHA'), ('runID', 'GITHUB_RUN_ID'),
                                     ('attempt', 'GITHUB_RUN_ATTEMPT'), ('job', 'GITHUB_JOB'), ('ref', 'GITHUB_REF')):
                      need(manifest[field] == os.environ[env])
                  need(manifest['commit'] == command(['git', 'rev-parse', 'HEAD']).decode().strip() and
                       manifest['tree'] == command(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip())
                  need(all(manifest[key] is False for key in ('completeBuildInputGraphQualified',
                      'effectiveConfigurationJoined', 'compilerUsedInputsProved', 'activeCodegenReferencesJoined',
                      'actualAppObserved', 'signedTargetJoined', 'resourceLifetimeQualified')))
                  rows = manifest['entries']
                  need(type(rows) is list and 0 < len(rows) <= COUNT)
                  need(len({r['path'].casefold() for r in rows}) == len(rows))
                  originals = {}
                  for name, cap in (('native/executable', 256*1024*1024), ('native/Info.plist', 1024*1024), ('producer/capture.py', FILE)):
                      row, = [r for r in rows if r['path'] == name]
                      raw = read_file(OUT/name, cap)
                      need(type(row['bytes']) is int and row['bytes'] == len(raw) and row['sha256'] == hashlib.sha256(raw).hexdigest())
                      originals[name] = raw
                  need(originals['producer/capture.py'] == read_file(Path(__file__)))
                  value['refusal'] = 'simulator-executable-metadata'
                  info = plistlib.loads(originals['native/Info.plist'])
                  need(info['CFBundleSupportedPlatforms'] == ['iPhoneSimulator'])
                  minimum = simulator_header(originals['native/executable'])
                  need(minimum == version(info['MinimumOSVersion']))
                  value['refusal'] = 'runtime-inventory'
                  inventory = bounded_inventory()
                  def unique(pairs):
                      result = {}
                      for k, v in pairs:
                          need(k not in result)
                          result[k] = v
                      return result
                  parsed = json.loads(inventory, object_pairs_hook=unique,
                      parse_constant=lambda _: need(False))
                  value['refusal'] = 'runtime-selection'
                  runtimes = parsed['runtimes']
                  need(type(runtimes) is list and len(runtimes) <= 128)
                  runtime, = [r for r in runtimes if r.get('identifier') == requested]
                  need(runtime.get('isAvailable') is True and not runtime.get('availabilityError'))
                  need(runtime['buildversion'] == build and version(runtime['version']) >= minimum)
                  need(version(requested.rsplit('.iOS-', 1)[1].replace('-', '.')) == version(runtime['version']))
                  value.update(status='runtime-candidate-only-launch-refused', refusal='device-resource-launch-admission-required',
                      commit=manifest['commit'], tree=manifest['tree'], runID=manifest['runID'],
                      attempt=manifest['attempt'], job=manifest['job'], ref=manifest['ref'],
                      retainedManifestSHA256=hashlib.sha256(original).hexdigest(),
                      producerSHA256=hashlib.sha256(originals['producer/capture.py']).hexdigest(),
                      executableSHA256=hashlib.sha256(originals['native/executable']).hexdigest(),
                      plistSHA256=hashlib.sha256(originals['native/Info.plist']).hexdigest(),
                      inventorySHA256=hashlib.sha256(inventory).hexdigest(), inventoryBytes=len(inventory),
                      runtimeIdentifier=requested, runtimeBuild=build, runtimeVersion=runtime['version'],
                      executableMinimumOS=list(minimum), executableArchitecture='arm64', hostArchitecture='arm64')
              finally:
                  # The inventory can contain host paths; retain only its digest and reviewed fields.
                  with (directory/'candidate.json').open('x') as stream:
                      json.dump(value, stream, sort_keys=True)
              print('iOS runtime candidate recorded; app launch remains refused')


          def owned_simulator_transaction(plan, invoke, observe, now=time.monotonic):
              """Unwired transaction core. Adapters must enforce command/observation bounds.

              Supplied admission fields are not authenticated capabilities. No workflow phase
              invokes this core until runtime/device/resource admission and adapters qualify.
              """
              import math
              import re
              keys = {'schema', 'runtimeIdentifier', 'deviceTypeIdentifier', 'name', 'bundleIdentifier',
                      'appPath', 'sourceSHA256', 'executableSHA256', 'runtimeArchitectureAdmitted',
                      'deviceModelAdmitted', 'processEnvelopeAdmitted'}
              need(type(plan) is dict and plan.keys() == keys)
              plan = dict(plan)  # Caller mutation during an adapter call cannot retarget ownership.
              need(plan['schema'] == 'brickwright.ios-owned-simulator-plan.v1')
              for field, expression in (
                  ('runtimeIdentifier', r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+'),
                  ('deviceTypeIdentifier', r'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+'),
                  ('name', r'bw-asset-audit-[a-f0-9]{32}'),
                  ('bundleIdentifier', r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'),
                  ('sourceSHA256', r'[a-f0-9]{64}'), ('executableSHA256', r'[a-f0-9]{64}')):
                  need(type(plan[field]) is str and re.fullmatch(expression, plan[field]) is not None)
              need(type(plan['appPath']) is str and 0 < len(plan['appPath'].encode()) <= 4096 and
                   not any(ord(c) < 32 or ord(c) == 127 for c in plan['appPath']))
              need(all(plan[key] is True for key in ('runtimeArchitectureAdmitted',
                   'deviceModelAdmitted', 'processEnvelopeAdmitted')))
              limits = {'activeSeconds': 90, 'cleanupSeconds': 20, 'commandSeconds': 15,
                        'maxActiveCommands': 32, 'maxCleanupCommands': 8,
                        'commandBytes': 1024*1024, 'receiptBytes': 8*1024*1024, 'observationSeconds': 30}
              result = {'schema': 'brickwright.ios-owned-simulator-transaction.v1', 'status': 'partial',
                        'primaryFailure': None, 'cleanupFailures': [], 'trace': [], 'limits': limits.copy(),
                        'creationAttempted': False, 'ownershipEstablished': False, 'creationUncertain': False,
                        'observationRetained': False, 'cleanupAbsenceObserved': False,
                        'suppliedAdmissionAuthenticated': False, 'callbackBoundsQualified': False,
                        'resourceLifetimeQualified': False, 'actualAppQualified': False}
              last = None
              broken_clock = False
              def tick():
                  nonlocal last, broken_clock
                  value = now()
                  if (broken_clock or type(value) not in (int, float) or not math.isfinite(value) or
                          (last is not None and value < last)):
                      broken_clock = True
                      raise ValueError('transaction clock refused')
                  last = value
                  return value
              start = tick()
              deadline = start + limits['activeSeconds']
              counts = [0, 0]
              def call(args, cleanup=False):
                  current = tick()
                  need(current < deadline)
                  slot = int(cleanup)
                  maximum = limits['maxCleanupCommands'] if cleanup else limits['maxActiveCommands']
                  need(counts[slot] < maximum)
                  counts[slot] += 1
                  command_deadline = min(deadline, current+limits['commandSeconds'])
                  value = invoke(tuple(args), deadline=command_deadline, output_limit=limits['commandBytes'])
                  need(tick() < command_deadline and type(value) is bytes and len(value) <= limits['commandBytes'])
                  return value
              def catalog(cleanup=False):
                  def unique(pairs):
                      value = {}
                      for key, item in pairs:
                          need(key not in value)
                          value[key] = item
                      return value
                  raw = call(('list', 'devices', '--json'), cleanup)
                  devices = json.loads(raw, object_pairs_hook=unique, parse_constant=lambda _: need(False))['devices']
                  need(type(devices) is dict and len(devices) <= 128)
                  rows = {}
                  for runtime, entries in devices.items():
                      need(type(entries) is list and len(entries) <= 1024)
                      for entry in entries:
                          identifier = entry['udid']
                          need(type(identifier) is str and re.fullmatch(r'[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}', identifier) is not None)
                          key = identifier.upper()
                          need(key not in rows and len(rows) < 4096)
                          rows[key] = (runtime, entry)
                  return rows
              owned = None
              boot_attempted = False
              launch_attempted = False
              observation = None
              stage = 'initial-catalog'
              def verify(cleanup=False):
                  rows = catalog(cleanup)
                  need(owned is not None and owned in rows)
                  runtime, row = rows[owned]
                  need(runtime == plan['runtimeIdentifier'] and row['name'] == plan['name'] and
                       row['deviceTypeIdentifier'] == plan['deviceTypeIdentifier'])
                  return row
              def operation(command, *arguments, cleanup=False):
                  row = verify(cleanup)
                  if not cleanup:
                      need(row['isAvailable'] is True)
                      if command == 'boot':
                          need(row['state'] == 'Shutdown')
                      elif command in ('install', 'launch'):
                          need(row['state'] == 'Booted')
                  return call((command, owned, *arguments), cleanup)
              try:
                  before = catalog()
                  need(not any(row['name'] == plan['name'] for _, row in before.values()))
                  stage = 'create'
                  result['creationAttempted'] = True
                  raw = call(('create', plan['name'], plan['deviceTypeIdentifier'], plan['runtimeIdentifier']))
                  identifier = raw.decode('ascii').strip().upper()
                  need(re.fullmatch(r'[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}', identifier) is not None)
                  need(identifier not in before)
                  stage = 'created-identity'
                  after = catalog()
                  need(identifier in after)
                  runtime, row = after[identifier]
                  need(runtime == plan['runtimeIdentifier'] and row['name'] == plan['name'] and
                       row['deviceTypeIdentifier'] == plan['deviceTypeIdentifier'] and
                       row['state'] == 'Shutdown' and row['isAvailable'] is True)
                  owned = identifier
                  result['ownershipEstablished'] = True
                  result['trace'].append('created-identity')
                  stage = 'boot'
                  boot_attempted = True
                  operation('boot')
                  stage = 'boot-ready'
                  operation('bootstatus', '-b')
                  need(verify()['state'] == 'Booted')
                  stage = 'install'
                  operation('install', plan['appPath'])
                  stage = 'launch'
                  launch_attempted = True
                  raw = operation('launch', plan['bundleIdentifier'])
                  match = re.fullmatch(re.escape(plan['bundleIdentifier']) + r': ([1-9][0-9]{0,9})\s*', raw.decode('ascii'))
                  need(match is not None and int(match[1]) <= 2147483647)
                  stage = 'observe'
                  need(verify()['state'] == 'Booted')
                  current = tick()
                  need(current < deadline)
                  # Adapter owns environment binding, installed-code/readback, PID/RSS checks,
                  # bounded waiting and original retention; this core cannot invent those facts.
                  observation_deadline = min(deadline, current+limits['observationSeconds'])
                  observation = observe(owned, int(match[1]), deadline=observation_deadline,
                                        output_limit=limits['receiptBytes'])
                  need(type(observation) is bytes and 0 < len(observation) <= limits['receiptBytes'])
                  result['observationRetained'] = True
                  result['observationSHA256'] = hashlib.sha256(observation).hexdigest()
                  result['observationBytes'] = len(observation)
                  need(tick() < observation_deadline)
              except Exception:
                  result['primaryFailure'] = stage  # No exception payload, args, paths, UUIDs or device names.
              finally:
                  result['creationUncertain'] = result['creationAttempted'] and not result['ownershipEstablished']
                  if owned is not None:
                      try:
                          deadline = tick() + limits['cleanupSeconds']
                      except Exception:
                          result['cleanupFailures'].append('cleanup-clock')
                      for command, arguments, required in (
                              ('terminate', (plan['bundleIdentifier'],), launch_attempted),
                              ('shutdown', (), boot_attempted), ('delete', (), True)):
                          if required:
                              try:
                                  operation(command, *arguments, cleanup=True)
                                  result['trace'].append(command)
                              except Exception:
                                  result['cleanupFailures'].append(command)
                      try:
                          need(owned not in catalog(cleanup=True))
                          result['cleanupAbsenceObserved'] = True
                      except Exception:
                          result['cleanupFailures'].append('absence-readback')
              result['activeCommands'] = counts[0]
              result['cleanupCommands'] = counts[1]
              if result['primaryFailure'] is None and not result['cleanupFailures'] and result['observationRetained']:
                  result['status'] = 'observed-transaction-only'
              return result, observation if result['observationRetained'] else None


          class PreparedInstalledObservation:
              """Unwired receiver. Prepare an absent output before launch; caller owns admission.

              Process samples and expected pins are supplied, not authenticated by this class.
              Receipt headers are checked here; standalone readers must join asset contents.
              """
              def __init__(self, spec, *, deadline, now=time.monotonic):
                  import re
                  keys = {'schema', 'appDirectory', 'bundleIdentifier', 'executableSHA256',
                          'plistSHA256', 'receiptPath', 'sourceCommit', 'baseConfigSHA256'}
                  self._parent = None
                  self._receipt = None
                  self._closed = False
                  self._started = False
                  self._close_errors = ()
                  self._last_tick = None
                  self._now = now
                  self.last_raw = None
                  try:
                      need(type(spec) is dict and spec.keys() == keys)
                      self._spec = dict(spec)
                      need(spec['schema'] == 'brickwright.ios-installed-observation-plan.v1')
                      for field, expression in (('sourceCommit', r'[a-f0-9]{40}'),
                              ('executableSHA256', r'[a-f0-9]{64}'), ('plistSHA256', r'[a-f0-9]{64}'),
                              ('baseConfigSHA256', r'[a-f0-9]{64}'),
                              ('bundleIdentifier', r'[A-Za-z0-9][A-Za-z0-9-]*(?:\.[A-Za-z0-9][A-Za-z0-9-]*)+')):
                          need(type(spec[field]) is str and re.fullmatch(expression, spec[field]) is not None)
                      tick = self._check(deadline)
                      need(deadline-tick <= 15)
                      app = Path(spec['appDirectory'])
                      need(app.is_absolute() and app.name.endswith('.app') and app.resolve(strict=True) == app)
                      self._plist_path = app/'Info.plist'
                      self._plist_identity, digest, raw = self._file(self._plist_path, 1024*1024, deadline, keep=True)
                      need(digest == spec['plistSHA256'])
                      info = plistlib.loads(raw)
                      name = info['CFBundleExecutable']
                      need(type(name) is str and re.fullmatch(r'[A-Za-z0-9_-][A-Za-z0-9_.-]*', name) is not None and
                           info['CFBundleIdentifier'] == spec['bundleIdentifier'] and
                           info['CFBundleSupportedPlatforms'] == ['iPhoneSimulator'])
                      self._executable = app/name
                      self._exe_identity, digest, _ = self._file(self._executable, 256*1024*1024, deadline)
                      need(digest == spec['executableSHA256'])
                      target = Path(spec['receiptPath'])
                      need(target.is_absolute() and target.name == 'bw-embedded-asset-observation.json' and
                           target.parent.resolve(strict=True) == target.parent)
                      self._parent_path = target.parent
                      self._parent = os.open(target.parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                      self._parent_identity = os.fstat(self._parent)
                      need(stat.S_ISDIR(self._parent_identity.st_mode))
                      self._parent_matches()
                      try:
                          os.stat(target.name, dir_fd=self._parent, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          raise ValueError('receipt already exists')
                      self._name = target.name
                      self._check(deadline)
                  except BaseException:
                      self.close()
                      raise

              def _check(self, deadline):
                  import math
                  need(not self._closed)
                  tick = self._now()
                  need(type(deadline) in (int, float) and math.isfinite(deadline) and
                       type(tick) in (int, float) and math.isfinite(tick) and
                       (self._last_tick is None or tick >= self._last_tick) and tick < deadline)
                  self._last_tick = tick
                  return tick

              @staticmethod
              def _identity(info):
                  return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_nlink)

              def _file(self, path, cap, deadline, keep=False):
                  need(path.is_absolute() and path.resolve(strict=True) == path)
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      before = os.fstat(fd)
                      need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and 0 < before.st_size <= cap)
                      digest = hashlib.sha256()
                      body = bytearray()
                      used = 0
                      while True:
                          self._check(deadline)
                          raw = os.read(fd, min(65536, cap+1-used))
                          if not raw:
                              break
                          used += len(raw)
                          need(used <= cap)
                          digest.update(raw)
                          if keep:
                              body.extend(raw)
                      need(used == before.st_size and self._identity(before) == self._identity(os.fstat(fd)))
                      return self._identity(before), digest.hexdigest(), bytes(body)
                  finally:
                      os.close(fd)

              def _parent_matches(self):
                  need(not self._closed and self._parent is not None)
                  held = os.fstat(self._parent)
                  need((held.st_dev, held.st_ino) == (self._parent_identity.st_dev, self._parent_identity.st_ino))
                  current = self._parent_path.stat(follow_symlinks=False)
                  need(self._parent_path.resolve(strict=True) == self._parent_path and
                       stat.S_ISDIR(current.st_mode) and (current.st_dev, current.st_ino) ==
                       (self._parent_identity.st_dev, self._parent_identity.st_ino))

              def _read_receipt(self, deadline, cap):
                  self._parent_matches()
                  if self._receipt is None:
                      try:
                          self._receipt = os.open(self._name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=self._parent)
                      except FileNotFoundError:
                          return None
                  before = os.fstat(self._receipt)
                  current = os.stat(self._name, dir_fd=self._parent, follow_symlinks=False)
                  need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and 0 <= before.st_size <= cap and
                       (current.st_dev, current.st_ino) == (before.st_dev, before.st_ino))
                  os.lseek(self._receipt, 0, os.SEEK_SET)
                  body = bytearray()
                  while True:
                      self._check(deadline)
                      raw = os.read(self._receipt, min(65536, cap+1-len(body)))
                      if not raw:
                          break
                      body.extend(raw)
                      need(len(body) <= cap)
                  self.last_raw = bytes(body)
                  after = os.fstat(self._receipt)
                  self._parent_matches()
                  current = os.stat(self._name, dir_fd=self._parent, follow_symlinks=False)
                  need((current.st_dev, current.st_ino) == (before.st_dev, before.st_ino))
                  if self._identity(before) != self._identity(after) or len(body) != before.st_size:
                      return None  # A still-growing original is partial, not a complete replacement.
                  self._last_receipt_identity = self._identity(after)
                  return self.last_raw

              def _header(self, raw):
                  import re
                  def unique(pairs):
                      result = {}
                      for key, value in pairs:
                          need(key not in result)
                          result[key] = value
                      return result
                  try:
                      value = json.loads(raw, object_pairs_hook=unique, parse_float=lambda _: need(False),
                                         parse_constant=lambda _: need(False))
                  except json.JSONDecodeError:
                      return False  # The single original may still be in the middle of its write.
                  fields = {'schema', 'observation', 'asset_config_projection', 'source_label',
                      'source_label_is_build_proof', 'effective_config_sha256', 'base_config_sha256',
                      'executable_and_artifact_join', 'development_filesystem_fallback',
                      'resolver_internal_fallback_excluded', 'signed_target_map_joined',
                      'resource_and_process_lifetime_admitted'}
                  need(type(value) is dict and value.keys() == fields and
                       value['schema'] == 'brickwright.installed-asset-envelope.v2' and
                       value['source_label'] == self._spec['sourceCommit'] and
                       value['base_config_sha256'] == self._spec['baseConfigSHA256'])
                  need(all(value[key] is False for key in ('source_label_is_build_proof',
                      'development_filesystem_fallback', 'resolver_internal_fallback_excluded',
                      'signed_target_map_joined', 'resource_and_process_lifetime_admitted')) and
                      value['executable_and_artifact_join'] == 'required-external-independent-qualification')
                  observation = value['observation']
                  need(observation['schema'] == 'brickwright.installed-asset-observation.v1' and
                       observation['status'] == 'complete-observation-only' and observation['refusal'] is None)
                  projection = value['asset_config_projection']
                  need(projection.keys() == {'schema', 'status', 'refusal', 'profile', 'runtime_config_sha256',
                       'values', 'full_configuration_joined', 'raw_configuration_exposed', 'compiler_inputs_proved'} and
                       projection['schema'] == 'brickwright.asset-config-projection.v1' and
                       projection['status'] == 'complete-projection-only' and projection['refusal'] is None and
                       projection['profile'] == 'tauri-2.11.5-utils-2.9.3-codegen-2.6.3-asset-config.v1')
                  digest = value['effective_config_sha256']
                  need(type(digest) is str and re.fullmatch(r'[a-f0-9]{64}', digest) is not None and
                       projection['runtime_config_sha256'] == digest and
                       all(projection[key] is False for key in ('full_configuration_joined',
                           'raw_configuration_exposed', 'compiler_inputs_proved')))
                  expected = {'dev_url_absent': True, 'csp_absent': True, 'dev_csp_absent': True,
                              'pattern': 'brownfield', 'freeze_prototype': False,
                              'disable_asset_csp_modification': False, 'asset_protocol_enabled': False}
                  values = projection['values']
                  need(type(values) is dict and values.keys() == expected.keys() and
                       all(type(values[key]) is type(want) and values[key] == want for key, want in expected.items()))
                  return True

              def capture(self, pid, identity_sha256, sample, *, deadline, output_limit, stopped=None, pause=time.sleep):
                  import re
                  need(not self._closed and not self._started)
                  self._started = True
                  result = {'schema': 'brickwright.ios-installed-capture.v1', 'status': 'partial',
                      'refusal': 'capture-admission', 'polls': 0, 'sampledPeakRSSBytes': 0,
                      'sampledRSSThresholdBytes': 1024*1024*1024, 'cleanupFailures': [],
                      'receiverClosed': False, 'installedFilesStable': False, 'receiptHeaderMatched': False,
                      'samplerAuthenticated': False, 'hardMemoryLimitQualified': False,
                      'runningExecutableJoined': False, 'assetContentsJoined': False, 'actualAppQualified': False}
                  stage = 'capture-admission'
                  try:
                      need(not self._closed and type(pid) is int and 0 < pid <= 2147483647 and
                           type(identity_sha256) is str and re.fullmatch(r'[a-f0-9]{64}', identity_sha256) is not None and
                           type(output_limit) is int and 0 < output_limit <= 8*1024*1024 and
                           callable(sample) and callable(pause) and (stopped is None or callable(stopped)))
                      need(deadline-self._check(deadline) <= 30)
                      def check_stop():
                          nonlocal stage
                          if stopped is not None:
                              stage = 'stop'
                              flag = stopped()
                              need(type(flag) is bool and not flag)
                      def process_sample():
                          nonlocal stage
                          stage = 'process-sample'
                          snapshot = sample(pid)
                          self._check(deadline)
                          check_stop()
                          stage = 'process-sample'
                          need(type(snapshot) is dict and snapshot.keys() == {'pid', 'identitySHA256', 'rssBytes'} and
                               type(snapshot['pid']) is int and snapshot['pid'] == pid and
                               type(snapshot['identitySHA256']) is str and snapshot['identitySHA256'] == identity_sha256 and
                               type(snapshot['rssBytes']) is int and
                               0 <= snapshot['rssBytes'] <= result['sampledRSSThresholdBytes'])
                          result['sampledPeakRSSBytes'] = max(result['sampledPeakRSSBytes'], snapshot['rssBytes'])
                      for _ in range(600):
                          stage = 'deadline'
                          tick = self._check(deadline)
                          check_stop()
                          process_sample()
                          stage = 'receipt-read'
                          raw = self._read_receipt(deadline, output_limit)
                          stage = 'receipt-header'
                          if raw and self._header(raw):
                              process_sample()
                              stage = 'installed-files'
                              identity, digest, _ = self._file(self._plist_path, 1024*1024, deadline)
                              need(identity == self._plist_identity and digest == self._spec['plistSHA256'])
                              identity, digest, _ = self._file(self._executable, 256*1024*1024, deadline)
                              need(identity == self._exe_identity and digest == self._spec['executableSHA256'])
                              stage = 'receipt-readback'
                              self._parent_matches()
                              current = os.stat(self._name, dir_fd=self._parent, follow_symlinks=False)
                              need((current.st_dev, current.st_ino) == self._last_receipt_identity[:2])
                              need(self._identity(os.fstat(self._receipt)) == self._last_receipt_identity)
                              self._check(deadline)
                              check_stop()
                              result.update(status='captured-header-only', refusal=None,
                                            installedFilesStable=True, receiptHeaderMatched=True)
                              break
                          result['polls'] += 1
                          stage = 'deadline'
                          pause(min(0.05, max(0, deadline-self._check(deadline))))
                      else:
                          raise ValueError('poll budget refused')
                  except Exception:
                      result['refusal'] = stage  # No paths, process records, exception payload or raw bytes.
                  finally:
                      result['cleanupFailures'] = list(self.close())
                      result['receiverClosed'] = not result['cleanupFailures']
                      if result['cleanupFailures']:
                          result['status'] = 'partial'
                          if result['refusal'] is None:
                              result['refusal'] = 'receiver-cleanup'
                  if self.last_raw is not None:
                      result['rawBytes'] = len(self.last_raw)
                      result['rawSHA256'] = hashlib.sha256(self.last_raw).hexdigest()
                  return result, self.last_raw

              def close(self):
                  if not self._closed:
                      errors = []
                      for attribute in ('_receipt', '_parent'):
                          fd = getattr(self, attribute)
                          setattr(self, attribute, None)
                          if fd is not None:
                              try:
                                  os.close(fd)
                              except Exception:
                                  errors.append(attribute+'-close')
                      self._close_errors = tuple(errors)
                      self._closed = True
                  return self._close_errors


          def main():
              global ROWS, USED
              need(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                   os.environ.get('GITHUB_REPOSITORY') == 'CrispStrobe/brickwright-lite' and
                   os.environ.get('GITHUB_REF') in ('refs/heads/main',
                       'refs/heads/lane/ios-active-asset-source-20261018') and
                   os.environ.get('BW_RETAIN_IOS_INPUTS') == 'true' and
                   os.environ.get('BW_SIGN_IOS') == 'false' and os.environ.get('BW_DEVICE_IPA') == 'false')
              phase = sys.argv[1]
              need(phase in ('before', 'after', 'runtime'))
              if phase == 'runtime':
                  runtime_admission()
                  return
              if phase == 'before':
                  OUT.mkdir(exist_ok=False)
                  record_sources()
                  retain('producer/capture.py', read_file(Path(__file__)))
                  toolchain = {}
                  for name, args in (
                      ('rustc', ['rustc', '-Vv']), ('cargo', ['cargo', '--version']),
                      ('xcode', ['xcodebuild', '-version']),
                      ('simulatorSDK', ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'])):
                      text = command(args).decode().strip()
                      need(len(text.encode()) <= 65536 and not any(x in text for x in ('/Users/', '/home/', '/mnt/')))
                      toolchain[name] = text
                  retain('toolchain/versions.json', (json.dumps(toolchain, sort_keys=True)+'\n').encode())
                  commit = command(['git', 'rev-parse', 'HEAD']).decode().strip()
                  need(commit == os.environ['GITHUB_SHA'])
                  manifest = {'schema': 'brickwright.ios-retained-inputs.v1', 'status': 'before-build-inputs-only',
                      'commit': commit, 'tree': command(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(),
                      'runID': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'job': os.environ['GITHUB_JOB'], 'ref': os.environ['GITHUB_REF'], 'entries': ROWS,
                      'totalBytes': USED, 'completeBuildInputGraphQualified': False,
                      'effectiveConfigurationJoined': False, 'compilerUsedInputsProved': False,
                      'activeCodegenReferencesJoined': False, 'actualAppObserved': False,
                      'signedTargetJoined': False, 'resourceLifetimeQualified': False}
                  with (OUT/'manifest.json').open('x') as stream:
                      json.dump(manifest, stream, sort_keys=True)
              else:
                  manifest = json.loads(read_file(OUT/'manifest.json', 8*1024*1024))
                  need(manifest['status'] == 'before-build-inputs-only' and
                       manifest['commit'] == os.environ['GITHUB_SHA'] and
                       manifest['runID'] == os.environ['GITHUB_RUN_ID'] and
                       manifest['attempt'] == os.environ['GITHUB_RUN_ATTEMPT'])
                  need(manifest['commit'] == command(['git', 'rev-parse', 'HEAD']).decode().strip() and
                       all(manifest[key] is False for key in ('completeBuildInputGraphQualified',
                           'effectiveConfigurationJoined', 'compilerUsedInputsProved',
                           'activeCodegenReferencesJoined', 'actualAppObserved', 'signedTargetJoined',
                           'resourceLifetimeQualified')))
                  ROWS = manifest['entries']
                  need(type(ROWS) is list and 0 < len(ROWS) <= COUNT)
                  for row in ROWS:
                      canonical(row['path'])
                      need(type(row['bytes']) is int and 0 <= row['bytes'] <= FILE and
                           type(row['sha256']) is str and len(row['sha256']) == 64)
                  need(len({row['path'].casefold() for row in ROWS}) == len(ROWS))
                  USED = sum(row['bytes'] for row in ROWS)
                  need(USED == manifest['totalBytes'] and USED <= TOTAL)
                  expected_sources = sorted(row['path'][7:] for row in ROWS if row['path'].startswith('source/'))
                  expected_web = sorted(row['path'][4:] for row in ROWS if row['path'].startswith('web/'))
                  need(sources() == expected_sources and web_files() == expected_web)
                  for row in ROWS:
                      original = read_file(OUT/row['path'])
                      need(len(original) == row['bytes'] and hashlib.sha256(original).hexdigest() == row['sha256'])
                      if row['path'] == 'producer/capture.py':
                          need(read_file(Path(__file__)) == original)
                      if row['path'].startswith(('source/', 'web/')):
                          local = ROOT/row['path'][7:] if row['path'].startswith('source/') else ROOT/'packages/scratch-gui/build'/row['path'][4:]
                          need(read_file(local) == original)
                  metadata = json.loads(command(['cargo', 'metadata', '--no-deps', '--format-version', '1',
                                                 '--locked', '--offline'], ROOT/'apps/tauri/src-tauri'))
                  target = Path(metadata['target_directory'])/'aarch64-apple-ios-sim/release/build'
                  candidates = sorted(target.glob('brickwright-tauri-*/out/tauri-codegen-assets'))
                  need(0 < len(candidates) <= 32)
                  count = 0
                  for candidate in candidates:
                      # Retain all observed candidates, including stale ones. No active-use inference.
                      for base, dirs, files in os.walk(candidate, followlinks=False):
                          clock()
                          need(not Path(base).is_symlink())
                          for name in dirs:
                              need(not (Path(base)/name).is_symlink())
                          for name in sorted(files):
                              file = Path(base)/name
                              relative = file.relative_to(target).as_posix()
                              retain('codegen/'+relative, read_file(file))
                              count += 1
                  need(count > 0)
                  apps = list((ROOT/'apps/tauri/src-tauri/gen/apple/build').rglob('*.app'))
                  need(len(apps) == 1)
                  app = apps[0]
                  plist = read_file(app/'Info.plist', 1024*1024)
                  info = plistlib.loads(plist)
                  name = info['CFBundleExecutable']
                  canonical(name)
                  need('/' not in name and info['CFBundleSupportedPlatforms'] == ['iPhoneSimulator'])
                  retain('native/Info.plist', plist)
                  retain('native/executable', read_file(app/name, 256*1024*1024))
                  manifest.update(status='retained-candidates-only', entries=ROWS, totalBytes=USED,
                                  rawCodegenCandidates=len(candidates), rawCodegenFiles=count,
                                  rawCodegenSelection='all-observed-package-output-candidates; active-reference-join-required')
                  with (OUT/'completed.json').open('x') as stream:
                      json.dump(manifest, stream, sort_keys=True)
              toolchain_observation(phase, manifest)
              print('iOS input retention: '+phase+' complete; no app launched')


          try:
              main()
          except Exception:
              # No exception payloads, tool stderr, host paths or environment dumps in CI.
              print('::error::iOS input retention refused; retained partial inputs are not qualification')
              sys.exit(1)
          PY
          # END IOS INPUT RETENTION
          python3 "$RUNNER_TEMP/bw-ios-audit-capture.py" before

      - name: Build iOS app (simulator, unsigned)
        working-directory: apps/tauri
        run: |
          npx tauri ios init --ci
          node scripts/prepare-ios-device-build.mjs
          # PrivacyInfo.xcprivacy has no tauri.conf equivalent, so it is patched
          # straight into the generated pbxproj. Deliberately NOT via project.yml
          # + `xcodegen generate`: regenerating discards the signing settings the
          # tauri CLI writes into the pbxproj, which breaks the signed job.
          node scripts/patch-ios-privacy.mjs
          # Same shape, different asset: `tauri ios init` templates Tauri's own
          # logo into gen/apple's AppIcon.appiconset and never looks at
          # src-tauri/icons/ios, so every build — including the ones testers
          # installed from TestFlight — carried the Tauri icon, not the robot.
          node scripts/patch-mobile-icons.mjs ios
          npx tauri ios build --target aarch64-sim

      # Guard the two things that were silently missing before: the frameworks
      # Xcode must link itself (Rust's autolink hints are dropped for staticlibs)
      # and the merged Info.plist keys. Cheap, and fails loudly rather than
      # producing an app that dies on first BLE or camera use.
      - name: Verify frameworks and Info.plist made it into the app
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          PROJ=src-tauri/gen/apple/project.yml
          for fw in CoreBluetooth ExternalAccessory; do
            grep -q "$fw.framework" "$PROJ" || { echo "::error::$fw.framework missing from $PROJ"; exit 1; }
          done
          APP=$(find src-tauri/gen/apple/build -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          # Apple requires the privacy manifest at the bundle ROOT, not nested.
          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the app bundle root"; exit 1; }
          PLIST="$APP/Info.plist"
          for key in NSAppTransportSecurity UISupportedExternalAccessoryProtocols \
                     NSBluetoothAlwaysUsageDescription NSCameraUsageDescription \
                     NSMicrophoneUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1 \
              || { echo "::error::$key missing from the built app's Info.plist"; exit 1; }
          done

          # The icon is the one thing no test looks at and every tester sees.
          # Assert the SOURCE that went into the asset catalog is ours (the
          # compiled Assets.car is not readable without actool), and that actool
          # emitted a bundle-root icon at all.
          SET=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          cmp -s src-tauri/icons/ios/AppIcon-512@2x.png "$SET/AppIcon-512@2x.png" \
            || { echo "::error::the app icon set is not ours — patch-mobile-icons did not run"; exit 1; }
          ls "$APP"/AppIcon*.png >/dev/null 2>&1 \
            || { echo "::error::no AppIcon*.png in the built app — actool compiled no icon"; exit 1; }
          echo "frameworks + Info.plist keys + robot app icon present in $APP"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-ios-sim
          path: apps/tauri/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 7

      - name: Retain unsigned iOS products after build
        if: github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018')
        timeout-minutes: 3
        env:
          BW_RETAIN_IOS_INPUTS: ${{ inputs.retain_ios_audit_inputs }}
          BW_SIGN_IOS: ${{ inputs.sign_ios }}
          BW_DEVICE_IPA: ${{ inputs.device_ipa }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bw-ios-audit-capture.py" after

      - name: Admit installed unsigned iOS runtime candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018')) && inputs.ios_audit_runtime != ''
        timeout-minutes: 3
        env:
          BW_RETAIN_IOS_INPUTS: ${{ inputs.retain_ios_audit_inputs }}
          BW_SIGN_IOS: ${{ inputs.sign_ios }}
          BW_DEVICE_IPA: ${{ inputs.device_ipa }}
          BW_IOS_AUDIT_RUNTIME: ${{ inputs.ios_audit_runtime }}
          BW_IOS_AUDIT_RUNTIME_BUILD: ${{ inputs.ios_audit_runtime_build }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bw-ios-audit-capture.py" runtime

      - name: Upload unsigned iOS runtime admission
        if: always() && inputs.ios_audit_runtime != '' && (github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-ios-runtime-admission
          path: ${{ runner.temp }}/bw-ios-runtime-admission
          if-no-files-found: error
          retention-days: 3

      - name: Upload retained unsigned iOS inputs
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-ios-audit-inputs
          path: ${{ runner.temp }}/bw-ios-audit-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload unsigned iOS toolchain observations
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.retain_ios_audit_inputs && !inputs.sign_ios && !inputs.device_ipa && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ios-active-asset-source-20261018'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-ios-toolchain-inputs
          path: ${{ runner.temp }}/bw-ios-toolchain-inputs
          if-no-files-found: error
          retention-days: 3

  # Signed, App-Store-shaped IPA. Opt-in — runs on a version tag, or on a manual
  # dispatch with sign_ios=true.
  #
  # MANUAL signing: the tauri CLI reads IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD
  # / IOS_MOBILE_PROVISION itself, imports the cert into a temporary keychain,
  # installs the profile, and sets CODE_SIGN_STYLE=Manual +
  # PROVISIONING_PROFILE_SPECIFIER + a matching ExportOptions.plist. That avoids
  # automatic provisioning entirely, which is what previously failed: `tauri ios
  # build` runs -exportArchive WITHOUT the -authenticationKey* flags, so the
  # export could not talk to Apple ("No Accounts" / "No profiles ... were found")
  # no matter what the archive step had cached.
  #
  # The Apple Distribution identity is shared between macOS and iOS, so the
  # existing MACOS_CERT_P12 is reused rather than storing a second copy.
  ios-signed:
    needs: build-web
    if: ${{ github.event_name == 'push' || inputs.sign_ios }}
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: N9XSJ4M3GT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build signed IPA
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          for v in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            [ -n "${!v:-}" ] || { echo "::error::$v is not set — cannot sign."; exit 1; }
          done

          npx tauri ios init --ci
          node scripts/prepare-ios-device-build.mjs
          node scripts/patch-ios-privacy.mjs
          node scripts/patch-mobile-icons.mjs ios

          # The CLI's IOS_* variables import the certificate but do not touch the
          # Xcode project, so install the profile where Xcode looks for it and
          # point the project at it by name.
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/app.plist")
          NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/app.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFDIR/$UUID.mobileprovision"
          echo "installed provisioning profile '$NAME' ($UUID)"

          node scripts/patch-ios-signing.mjs "$APPLE_DEVELOPMENT_TEAM" "$NAME"

          npx tauri ios build --export-method app-store-connect

      - name: Verify the IPA is really signed
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "IPA: $IPA"
          WORK=$(mktemp -d); unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the IPA"; exit 1; }
          [ -f "$APP/embedded.mobileprovision" ] \
            || { echo "::error::no embedded provisioning profile — the app is not distribution-signed"; exit 1; }
          ls "$APP"/AppIcon*.png >/dev/null 2>&1 \
            || { echo "::error::no AppIcon*.png in the IPA — this is the build testers install"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "signed, privacy manifest present, profile embedded, app icon present"
          echo "IPA=apps/tauri/$IPA" >> "$GITHUB_ENV"

      # Validate + upload to App Store Connect -- only on real version tags,
      # never on workflow_dispatch test runs, matching release.yml (macOS).
      #
      # Until 2026-08-17 this job stopped at "signed IPA in a GitHub artifact":
      # it built and verified a distribution-signed build and then never sent it
      # to Apple, so iOS TestFlight silently stayed on whatever was uploaded by
      # hand (0.1.0, 2026-08-05) while macOS moved on. Tagging looked like it
      # released both platforms and only released one.
      #
      # THE GUARD NOW SAYS WHAT THE COMMENT ABOVE SAYS. It read
      # `startsWith(github.ref, 'refs/tags/')` alone -- and a workflow_dispatch
      # ON A TAG satisfies that, so a manual test run did attempt a real App
      # Store upload, which is the one thing the comment says must never happen.
      #
      # Measured: run 34031659129, workflow_dispatch on v0.1.15. Build, signing
      # and validation all succeeded; Apple refused the upload with
      #
      #   status 409  ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE
      #   The bundle version must be higher than the previously uploaded
      #   version: '0.1.15'.
      #
      # The correct answer, reported as a failed `ios-signed` job -- which reads
      # as a signing problem, two steps after signing demonstrably succeeded.
      #
      # ONLY THIS STEP IS GATED ON THE EVENT. The tester-notes and TestFlight
      # steps below are idempotent and their comments say a re-run is the
      # recovery path, so a dispatch over a tag still repairs those for a build
      # Apple already has. It just no longer tries to upload that build twice.
      - name: Validate + upload to App Store Connect
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

          BUNDLE_VERSION=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          echo "Uploading iOS $BUNDLE_VERSION from $IPA"

          # --apple-id is REQUIRED here, unlike the macOS validate in
          # release.yml. Without it altool resolves the app from bundle id +
          # platform, and that lookup fails for iOS because this app record has
          # no iOS appStoreVersion yet (macOS has one, which is why the macOS
          # job gets away with omitting it):
          #   ERROR: Cannot determine the Apple ID from Bundle ID
          #   'com.crispstrobe.brickwright' and platform 'IOS'. (19)
          xcrun altool --validate-app -f "$IPA" \
            --type ios \
            --apple-id ${{ vars.APPSTORE_APP_ID }} \
            --bundle-id com.crispstrobe.brickwright \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apple-id ${{ vars.APPSTORE_APP_ID }} \
            --bundle-id com.crispstrobe.brickwright \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_VERSION" \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

      # The "What to Test" text testers actually read. `docs/app-store-metadata.md`
      # is its source and a gate asserts the sections for this version exist --
      # but nothing ever SENT them, so 0.1.7 and 0.1.8 both reached App Store
      # Connect with whatsNew EMPTY in both locales while that gate stayed green.
      # Polls, because a build is only patchable once Apple finishes processing.
      - name: Send tester notes to App Store Connect
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
        # --platform IOS: one app record carries both platforms and
        # release.yml uploads the macOS build on the same tag, so an
        # unqualified "wait for a VALID build" is a race. It lost on
        # 0.1.10 and that build's notes went out empty.
        run: node scripts/push-tester-notes.mjs --platform IOS

      # ...and then actually put it in front of testers. Uploading a build and
      # annotating it distributes it to nobody: the group assignment and the
      # Beta App Review submission were done by hand from a document, per
      # release, which is why on 2026-08-26 the EXTERNAL group held every version
      # up to 0.1.9 while the INTERNAL group still held 0.1.0 — nine releases of
      # internal testers looking at the first build ever made.
      #
      # Idempotent, so a re-run after a partial failure is the recovery. It also
      # covers the macOS build, which shares this app record and is uploaded by
      # release.yml on the same tag.
      - name: Distribute to TestFlight (internal + external)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
        run: node scripts/testflight-submit.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Never let the artifact sink the release: the upload above is the point,
        # and a hit artifact-storage quota has already failed a run whose IPA was
        # perfectly good (WordUniverse, 2026-08-17).
        continue-on-error: true
        with:
          name: brickwright-ios-ipa
          path: apps/tauri/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 7

  # Sideloadable, device-installable IPA. Opt-in via workflow_dispatch.
  #
  # WHY THIS EXISTS, given ios-signed already produces a signed IPA: that one is
  # an App Store package. Its profile carries get-task-allow=false and NO
  # ProvisionedDevices, so iOS refuses it outright —
  #   xcrun devicectl device install app  ->  the app cannot be installed
  # and the only route onto hardware is TestFlight. The `ios` job is worse for
  # this purpose: it targets aarch64-sim, which a physical iPad cannot run at
  # all. So neither existing job could answer "put this build on the iPad", and
  # BLE against real LEGO hardware stayed unverifiable from CI.
  #
  # This job exports "release-testing" (Xcode 15's name for ad-hoc) against a
  # profile that names the test iPad by UDID. Deliberately reuses the SAME
  # Apple Distribution cert as ios-signed (MACOS_CERT_P12) rather than adding a
  # development certificate: ad-hoc is a distribution method, so no second
  # private key has to be exported into CI secrets. The only new secret is the
  # profile itself.
  #
  # To add another device: register it, regenerate the IOS_APP_ADHOC profile
  # with the extra device, and refresh IOS_PROFILE_ADHOC_BASE64. A device that
  # is not in the profile cannot install the IPA, however it is signed.
  ios-device:
    needs: build-web
    if: ${{ inputs.device_ipa }}
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROFILE_ADHOC_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: N9XSJ4M3GT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install app dependencies
        working-directory: apps/tauri
        run: npm ci

      - name: Build sideloadable IPA
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          for v in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            [ -n "${!v:-}" ] || { echo "::error::$v is not set — cannot sign."; exit 1; }
          done

          npx tauri ios init --ci
          node scripts/prepare-ios-device-build.mjs
          node scripts/patch-ios-privacy.mjs
          node scripts/patch-mobile-icons.mjs ios

          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/app.plist")
          NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/app.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFDIR/$UUID.mobileprovision"
          echo "installed provisioning profile '$NAME' ($UUID)"

          # Fail here rather than after a 20-minute build: an App Store profile
          # in this secret would produce an IPA no device can install, and the
          # symptom would only appear at install time on someone's desk.
          plutil -extract ProvisionedDevices xml1 -o - "$RUNNER_TEMP/app.plist" >/dev/null 2>&1 \
            || { echo "::error::IOS_PROFILE_ADHOC_BASE64 has no ProvisionedDevices — that is an App Store profile, not an ad-hoc one."; exit 1; }

          node scripts/patch-ios-signing.mjs "$APPLE_DEVELOPMENT_TEAM" "$NAME"

          npx tauri ios build --target aarch64 --export-method release-testing

      - name: Verify the IPA can actually be installed on a device
        working-directory: apps/tauri
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa produced"; exit 1; }
          WORK=$(mktemp -d); unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          security cms -D -i "$APP/embedded.mobileprovision" > "$WORK/embedded.plist"

          # The whole point of this job: without ProvisionedDevices the IPA is
          # an App Store package and devicectl will reject it.
          plutil -extract ProvisionedDevices xml1 -o - "$WORK/embedded.plist" >/dev/null \
            || { echo "::error::the built IPA names no devices — it cannot be sideloaded"; exit 1; }
          DEVICE_COUNT=$(plutil -extract ProvisionedDevices xml1 -o - "$WORK/embedded.plist" | grep -c '<string>')
          [ "$DEVICE_COUNT" -gt 0 ] || { echo "::error::ad-hoc profile has no registered devices"; exit 1; }
          echo "ad-hoc profile verified: provisioned device count=$DEVICE_COUNT"

          [ -f "$APP/PrivacyInfo.xcprivacy" ] \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the IPA"; exit 1; }
          ls "$APP"/AppIcon*.png >/dev/null 2>&1 \
            || { echo "::error::no AppIcon*.png in the IPA"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "ad-hoc signed, device-provisioned, privacy manifest and icon present"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-ios-device-ipa
          path: apps/tauri/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
