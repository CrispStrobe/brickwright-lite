                  need(len({r['path'].casefold() for r in rows}) == len(rows))
                  originals = {}
                  for name, cap in (('native/executable', 256*1024*1024), ('native/Info.plist', 1024*1024), ('producer/capture.py', FILE)):
                      row, = [r for r in rows if r['path'] == name]
                      raw = read_file(OUT/name, cap)
                      need(type(row['bytes']) is int and row['bytes'] == len(raw) and row['sha256'] == hashlib.sha256(raw).hexdigest())
                      originals[name] = raw
