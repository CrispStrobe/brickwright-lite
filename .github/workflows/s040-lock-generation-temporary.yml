name: S040 lock generation (temporary)
on:
  push:
    branches: [lane/s040-lock-generation-20261106]
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_ignore_scripts: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Generate exact lockfiles
        run: |
          set -euo pipefail
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd packages/scratch-gui && npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
          mkdir -p s040-lock-output/packages/scratch-gui
          cp package-lock.json s040-lock-output/package-lock.json
          cp packages/scratch-gui/package-lock.json s040-lock-output/packages/scratch-gui/package-lock.json
          cp vendor-pins.json package.json s040-lock-output/
          cp packages/scratch-gui/package.json s040-lock-output/packages/scratch-gui/package.json
          printf '%s\n' "$GITHUB_SHA" > s040-lock-output/source-head.txt
          (cd s040-lock-output && sha256sum package-lock.json packages/scratch-gui/package-lock.json package.json packages/scratch-gui/package.json vendor-pins.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s040-generated-locks
          path: s040-lock-output/
          if-no-files-found: error
          retention-days: 7
