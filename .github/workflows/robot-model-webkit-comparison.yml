name: Robot model WebKit comparison
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/robot-model-webkit-comparison.yml
      - scripts/qualify-robot-model-webkit.mjs
      - test/robot-model-webkit-comparison.test.mjs
      - lanes/2026-10-23-robot-model-webkit-comparison.md
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: >-
      github.repository == 'CrispStrobe/brickwright-lite' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/robot-model-webkit-comparison-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: '0'
      GIT_CONFIG_KEY_1: maintenance.auto
      GIT_CONFIG_VALUE_1: 'false'
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/model-webkit
    steps:
      - name: Checkout exact comparison source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d0efff3ea00688f2d2255bcaf6ed21b86d188991
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install frozen Node inputs without package lifecycle scripts
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Admission and resource refusal controls
        working-directory: harness
        run: node --test test/robot-model-webkit-comparison.test.mjs
      - name: Install supported WebKit runtime
        working-directory: candidate
        run: npx --no-install playwright install --with-deps webkit
      - name: Admit existing frontend and run unchanged WebKit examples
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BW_MODEL_WEBKIT_CONSUMER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p test-results
          node --max-old-space-size=2048 harness/scripts/qualify-robot-model-webkit.mjs candidate test-results/webkit-comparison
      - name: Preserve comparison originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-webkit-comparison-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/webkit-comparison/
            !test-results/webkit-comparison/site/**
            candidate/artifacts/sim-lab/new-models/
          if-no-files-found: error
          retention-days: 30
