name: SAMD actual browser and installed game qualification
on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Exact reviewed Lite source commit
        type: string
        required: true
      frontend_run:
        description: Same-consumer automatic successful Build run
        type: string
        required: true
      native_run:
        description: Successful native executable producer run for this consumer and frontend
        type: string
        required: true
      producer_run:
        description: Qualified BW engine producer run with source-built game observations
        type: string
        required: true
      producer_head:
        description: Exact reviewed BW producer workflow source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: ${{ github.repository == 'CrispStrobe/brickwright-lite' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate explicit immutable request
        env:
          CONSUMER: ${{ inputs.consumer }}
          FRONTEND: ${{ inputs.frontend_run }}
          NATIVE: ${{ inputs.native_run }}
          PRODUCER: ${{ inputs.producer_run }}
          PRODUCER_HEAD: ${{ inputs.producer_head }}
        run: |
          node -e 'for(const k of ["CONSUMER","PRODUCER_HEAD"])if(!/^[0-9a-f]{40}$/.test(process.env[k]))throw Error(k);for(const k of ["FRONTEND","NATIVE","PRODUCER"])if(!/^[1-9][0-9]{0,15}$/.test(process.env[k])||!Number.isSafeInteger(Number(process.env[k])))throw Error(k);'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.consumer }}
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: reader
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exercise independent metadata, checkout and asset refusal controls
        run: node --test reader/test/samd-native-profile.test.mjs
      - name: Admit official metadata, acquire each original once, and join all source bytes
        env:
          BW_SAMD_ADMISSION_SOURCE: ${{ github.workspace }}/consumer
          GH_TOKEN: ${{ github.token }}
          CONSUMER: ${{ inputs.consumer }}
          FRONTEND: ${{ inputs.frontend_run }}
          NATIVE: ${{ inputs.native_run }}
          PRODUCER: ${{ inputs.producer_run }}
          PRODUCER_HEAD: ${{ inputs.producer_head }}
        run: |
          node reader/scripts/verify-samd-native-game-browser.mjs --admit-inputs "$CONSUMER" "$FRONTEND" "$NATIVE" "$PRODUCER" "$PRODUCER_HEAD" qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samd-official-input-admission
          path: qualification/
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.consumer }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: samd-official-input-admission
          path: qualification
      - name: Install the existing locked browser observer
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Three fresh actual browser game instances on shipped assets
        run: node scripts/verify-samd-native-game-browser.mjs qualification/frontend qualification/fixture samd-browser-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samd-actual-browser-game
          path: samd-browser-results/
          if-no-files-found: error
          retention-days: 14
  installed:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.consumer }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: samd-official-input-admission
          path: qualification
      - name: Install existing native observer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libdbus-1-dev libudev-dev webkit2gtk-driver xvfb dbus-x11 bluez
          chmod 755 qualification/native/brickwright-tauri
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Install the existing pinned Tauri driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Three fresh actual installed game instances on embedded assets
        run: |
          xvfb-run -a dbus-run-session -- node scripts/verify-samd-native-game-installed.mjs qualification/native/brickwright-tauri qualification/native/receipt.json qualification/frontend qualification/fixture samd-installed-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samd-actual-installed-game
          path: samd-installed-results/
          if-no-files-found: error
          retention-days: 14
