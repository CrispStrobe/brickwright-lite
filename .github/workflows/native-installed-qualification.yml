name: Native installed qualification build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-installed-qualification.yml'
      - 'scripts/native-installed-qualification.py'
      - 'scripts/native-installed-qualification-profile.json'
      - 'test/native-installed-qualification*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/native-installed-qualification.yml'
      - 'scripts/native-installed-qualification.py'
      - 'scripts/native-installed-qualification-profile.json'
      - 'test/native-installed-qualification*'
  workflow_dispatch:
    inputs:
      consumer:
        description: Exact reviewed consumer commit (40 lowercase hexadecimal characters)
        required: false
        type: string
      frontend_run:
        description: Automatic Build workflow run publishing the same consumer's official frontend
        required: false
        type: string
      compile_pins:
        description: Closed JSON compile-pin declaration from the verified private resource profile (no payloads)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  admission-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Exercise source, artifact and resource refusal controls
        run: python3 test/native-installed-qualification-controls.py

  executable:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: admission-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the qualification producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: producer
          persist-credentials: false
      - name: Validate the complete reviewed build request
        id: request
        env:
          NATIVE_CONSUMER: ${{ inputs.consumer }}
          NATIVE_FRONTEND_RUN: ${{ inputs.frontend_run }}
          BW_NATIVE_PROFILE_PINS: ${{ inputs.compile_pins }}
        run: |
          python3 producer/scripts/native-installed-qualification.py request \
            --defaults producer/scripts/native-installed-qualification-profile.json
      - name: Check out the exact reviewed consumer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.request.outputs.consumer }}
          path: consumer
          persist-credentials: false
      - name: Admit official frontend and freeze native source
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_HEAD: ${{ steps.request.outputs.consumer }}
          FRONTEND_RUN: ${{ steps.request.outputs.frontend_run }}
          BW_NATIVE_PROFILE_PINS: ${{ steps.request.outputs.compile_pins }}
        run: |
          python3 producer/scripts/native-installed-qualification.py prepare \
            --consumer consumer --head "$CONSUMER_HEAD" \
            --frontend-run "$FRONTEND_RUN" --output qualification
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Compile the resource-bound native executable
        run: python3 producer/scripts/native-installed-qualification.py build --output qualification
      # This is not an installer or release: actual resources stay private and
      # must be independently assembled/verified on the direct qualification host.
      - name: Retain executable and complete build-input receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-installed-executable
          path: qualification/result/
          if-no-files-found: error
          retention-days: 7
