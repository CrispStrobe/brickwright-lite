name: Reference-qualified teaching instruments

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/lib/reference-qualified-circuits.mjs
      - scripts/lib/reference-qualified-compare.mjs
      - scripts/reference-qualified-instrument-study.mjs
      - scripts/read-reference-qualified-instruments.py
      - test/reference-qualified-instrument-study.test.mjs
      - .github/workflows/reference-qualified-instruments.yml
  push:
    branches: [study/reference-qualified-v1]

permissions:
  contents: read
  actions: read

concurrency:
  group: reference-qualified-instruments-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REVIEWED_STUDY_HEAD: ${{ vars.REFERENCE_QUALIFIED_STUDY_HEAD }}
  ADMITTED_INTENT: e4ce664ab57feecbe697132187b234c1b85ea5c634524a8f758429951a78e631

jobs:
  controls:
    if: github.repository == 'CrispStrobe/brickwright-lite'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CrispStrobe/bw-circuit-ui
          ref: 1bc233c9297e03abb9b7eb603e045b4e92b0bb40
          path: admitted-ui-metadata
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Test source and independent retained-original reader with synthetic inputs
        env:
          REFERENCE_UI_PACKAGE_JSON: admitted-ui-metadata/package.json
        run: node --max-old-space-size=384 --test test/reference-qualified-instrument-study.test.mjs
      - name: Admit the frozen candidate intent without executing a circuit
        run: |
          node --input-type=module - <<'JS'
          import {createManifest,canonical,sha256} from './scripts/lib/reference-qualified-circuits.mjs';
          const actual=sha256(canonical(createManifest()));
          if(actual!==process.env.ADMITTED_INTENT) throw new Error('Frozen intent changed before study');
          JS

  study:
    needs: controls
    if: >-
      github.repository == 'CrispStrobe/brickwright-lite' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/study/reference-qualified-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Admit one frozen owned push before setup or numerical work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir reference-study-event
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > reference-study-event/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=study/reference-qualified-v1&event=push&per_page=100" > reference-study-event/selections.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/study/reference-qualified-v1" > reference-study-event/ref.json
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createManifest,canonical,sha256,SOURCES} from './scripts/lib/reference-qualified-circuits.mjs';
          const read=name=>JSON.parse(readFileSync('reference-study-event/'+name+'.json'));
          const r=read('run'),selections=read('selections'),ref=read('ref');
          if(!/^[0-9a-f]{40}$/.test(process.env.REVIEWED_STUDY_HEAD??'')||process.env.REVIEWED_STUDY_HEAD!==process.env.GITHUB_SHA||
              process.env.GITHUB_RUN_ATTEMPT!=='1'||r.id!==Number(process.env.GITHUB_RUN_ID)||r.run_attempt!==1||
              r.head_sha!==process.env.GITHUB_SHA||r.head_branch!=='study/reference-qualified-v1'||r.event!=='push'||
              r.repository?.full_name!=='CrispStrobe/brickwright-lite'||
              r.path!=='.github/workflows/reference-qualified-instruments.yml'||ref.object?.sha!==process.env.GITHUB_SHA||
              selections.total_count!==selections.workflow_runs?.length||selections.total_count>100||
              new Set(selections.workflow_runs.map(x=>x.id)).size!==selections.workflow_runs.length||
              selections.workflow_runs.filter(x=>x.id===r.id&&x.path===r.path).length!==1||
              selections.workflow_runs.some(x=>x.path===r.path&&x.id!==r.id)) {
              throw new Error('Fresh one-shot study event/ref/history admission refused');
          }
          const pins=JSON.parse(readFileSync('vendor-pins.json'));
          if(Object.entries(SOURCES).some(([name,sha])=>pins[name]!==sha)||
              sha256(canonical(createManifest()))!==process.env.ADMITTED_INTENT)throw new Error('Source/intent admission refused');
          writeFileSync('reference-study-event/admission.json',JSON.stringify({schemaVersion:1,repositoryName:'CrispStrobe/brickwright-lite',
              reviewAuthority:'repository-variable:REFERENCE_QUALIFIED_STUDY_HEAD',reviewedHead:process.env.REVIEWED_STUDY_HEAD,
              headSha:r.head_sha,runId:r.id,
              runAttempt:r.run_attempt,intentSha256:process.env.ADMITTED_INTENT,
              limits:'Event admission only; no numerical or physical result yet'},null,2)+'\n',{flag:'wx'});
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CrispStrobe/bw-board
          ref: 836867513c3e7fac420ddaa32c17e1c7b6d3e513
          path: admitted-sources/bw-board
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CrispStrobe/bw-circuit-ui
          ref: 1bc233c9297e03abb9b7eb603e045b4e92b0bb40
          path: admitted-sources/bw-circuit-ui
          persist-credentials: false
      - name: Install locked public packages and the admitted oracle version
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ngspice
      - name: Collect the new authored cohort once with diagnostics preserved
        id: collect
        env:
          BW_BOARD: ''
          NODE_PATH: ''
          NODE_OPTIONS: ''
        run: |
          node scripts/reference-qualified-instrument-study.mjs --run \
            --output reference-study-originals --installed-root node_modules \
            --board-source admitted-sources/bw-board --cui-source admitted-sources/bw-circuit-ui \
            --admitted-intent "$ADMITTED_INTENT" --admission-file reference-study-event/admission.json
      - name: Independently read retained originals without rerunning a simulator
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          if [ -d reference-study-originals ]; then
            python3 -I -B scripts/read-reference-qualified-instruments.py reference-study-originals \
              --head "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          else
            echo 'No numerical originals: setup or event admission failed'
            exit 1
          fi
      - name: Preserve original event admission and outputs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-qualified-instruments-${{ github.run_id }}
          path: |
            reference-study-event/
            reference-study-originals/
          if-no-files-found: error
          retention-days: 30
