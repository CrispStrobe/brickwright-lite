name: Rust notices

on:
  workflow_dispatch:
  push:
    # GitHub cannot workflow_dispatch a brand-new workflow until the file is on
    # the default branch. Let the path-filtered push create that first branch
    # receipt; PR and push runs share the concurrency group below.
    paths:
      - '.github/workflows/rust-notices.yml'
      - 'THIRD-PARTY-NOTICES.md'
      - 'scripts/gen-rust-notices.mjs'
      - 'test/rust-notices-generator.test.mjs'
      - 'test/helpers/quiet-console.mjs'
      - 'package.json'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/**/Cargo.toml'
  pull_request:
    paths:
      - '.github/workflows/rust-notices.yml'
      - 'THIRD-PARTY-NOTICES.md'
      - 'scripts/gen-rust-notices.mjs'
      - 'test/rust-notices-generator.test.mjs'
      - 'test/helpers/quiet-console.mjs'
      - 'package.json'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/**/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: rust-notices-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the notices source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable
      - name: Test the bounded notices writer
        run: node --test test/rust-notices-generator.test.mjs
      - name: Check the notices against locked Cargo metadata
        run: npm run gen:notices:check
