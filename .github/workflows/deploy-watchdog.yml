# The 60-red-runs lesson (2026-08-15): every push failed for a full day
# and no lane noticed, because nobody owns WATCHING lite's CI. This
# watchdog owns it: hourly, if the last 3 build runs on main all
# failed, it opens (or refreshes) a loud issue. Closing the issue is
# the ack; it reopens while the condition holds.
#
# The zombie-run lesson (same day): one build hung in_progress for 35
# minutes and the concurrency group queued every later build behind it —
# Pages froze on a stale deploy while everything LOOKED green. The
# stuck-run step cancels any build run in flight longer than 25 minutes
# (a healthy build takes ~10–15) and says so in an issue.
#
# STILL CORRECT AFTER ROADMAP §2.1 (2026-08-30), for a different reason.
# build.yml now groups pushes per COMMIT, so a hung build no longer holds a
# queue behind it — the sentence above describes a world that ended. What did
# not change is that a hung build burns a runner for its full 30-minute timeout
# and produces no verdict, and that several builds can now legitimately be
# in_progress at once. The step measures each run's own execution age, so
# parallel healthy builds are not affected by each other; only a genuinely
# stuck one is cancelled. Do not "simplify" this to a count of in-progress runs.
#
# The red-streak check above is unaffected: still one build run per push, so
# three consecutive failures still mean Pages is not deploying. Cancellations
# do not enter it, which is right — a superseded DEPLOY is now an ordinary
# outcome (§2.1: an older tree standing down for a newer one), and alerting on
# it would train everyone to ignore this watchdog.
name: deploy-watchdog
# CADENCE IS A REQUEST, NOT A GUARANTEE. This asks for hourly and does not
# get it: measured 2026-09-05 over the last ten runs, the mean gap is 3.8
# hours and the range is 2.4 to 5.4. GitHub delays and drops scheduled runs
# on public repos under load, and this repo builds constantly. So anything
# below that reasons about "within the hour" is reasoning about a cadence
# this workflow does not have -- a red streak can stand for most of a
# working day before the issue is filed. Do not tighten the thresholds to
# compensate; that trades a slow alarm for a false one. If detection
# latency ever matters, trigger from workflow_run instead of a schedule.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  issues: write
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a red streak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=main&per_page=3" \
            --jq '[.workflow_runs[].conclusion] | join(",")')
          echo "last 3 build conclusions: $runs"
          if [ "$runs" = "failure,failure,failure" ]; then
            title="deploy watchdog: lite build is RED on main (3+ consecutive)"
            existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title" --json number --jq '.[0].number // empty')
            body="The last 3 build.yml runs on main all failed — GH Pages is NOT deploying. See the Actions tab. This issue reopens every 6h while the streak holds."
            if [ -n "$existing" ]; then gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body (still red)"; \
            else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cancel stuck build runs (zombie blocks the concurrency group)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # WHICH runs are stuck is decided by scripts/watchdog-stuck-runs.mjs,
          # not here, because the interesting distinction is invisible from the
          # run object alone: a run reports `in_progress` the moment GitHub
          # accepts it, while its jobs can still be QUEUED with a null
          # started_at. Such a run has no execution age yet -- which is not an
          # age of zero -- and the previous shell fell back to the creation
          # time, inventing exactly the queue time it was trying to exclude. On
          # 2026-09-05 five consecutive main runs were cancelled while queued.
          # The selector is pure and has fixtures in
          # test/deploy-watchdog-age.test.mjs; this step only gathers and acts.
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=in_progress&per_page=10" \
            --jq '[.workflow_runs[].id]')
          payload='[]'
          for id in $(echo "$runs" | jq -r '.[]'); do
            jobs=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | {started_at}]' 2>/dev/null || echo '[]')
            payload=$(jq -c --argjson j "$jobs" --arg id "$id" '. + [{id: $id, jobs: $j}]' <<<"$payload")
          done
          echo "$payload" | node scripts/watchdog-stuck-runs.mjs | while read -r id age; do
            echo "run $id EXECUTING for ${age}m — cancelling"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel"
            title="deploy watchdog: cancelled a stuck build run"
            body="Build run $id has been EXECUTING for ${age} minutes (healthy: 10-15; queue time excluded, and a run whose jobs have not started is skipped rather than aged). Cancelled it so the runner is freed. If this recurs, something in the build hangs — check that run's logs."
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" || true
          done
