name: cycle-core-qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 3'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle-core-qualification.yml'
      - 'docs/DEBUGGER-NEXT-ROADMAP.md'
      - 'docs/CYCLE-ACCURATE-CORE-EVALUATION.md'
      - 'scripts/qualify-cycle-candidates.mjs'
      - 'scripts/generate-floooh-z80-oracle-header.mjs'
      - 'scripts/fixtures/qualify-floooh-z80.c'
      - 'scripts/fixtures/qualify-floooh-z80-wasm.c'
      - 'scripts/fixtures/freestanding/string.h'
      - 'scripts/verify-cycle-candidate-browser.mjs'
      - 'scripts/lib/cycle-browser-receipt.mjs'
      - 'scripts/lib/cycle-candidate-decision.mjs'
      - 'scripts/fixtures/qualify-jsmoo-w65c02.mjs'
      - 'test/fixtures/cycle-core-candidates.json'
      - 'test/cycle-core-qualification.test.mjs'
      - 'test/cycle-browser-receipt.test.mjs'
      - 'test/cycle-candidate-decision.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/cycle-core-qualification.yml'
      - 'scripts/qualify-cycle-candidates.mjs'
      - 'scripts/generate-floooh-z80-oracle-header.mjs'
      - 'scripts/fixtures/qualify-floooh-z80.c'
      - 'scripts/fixtures/qualify-floooh-z80-wasm.c'
      - 'scripts/fixtures/freestanding/string.h'
      - 'scripts/verify-cycle-candidate-browser.mjs'
      - 'scripts/lib/cycle-browser-receipt.mjs'
      - 'scripts/lib/cycle-candidate-decision.mjs'
      - 'scripts/fixtures/qualify-jsmoo-w65c02.mjs'
      - 'test/fixtures/cycle-core-candidates.json'
      - 'test/cycle-core-qualification.test.mjs'
      - 'test/cycle-browser-receipt.test.mjs'
      - 'test/cycle-candidate-decision.test.mjs'

permissions:
  contents: read

concurrency:
  group: cycle-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    # Cheap, dependency-free policy verdict before GitHub spends minutes on
    # four external checkouts, native/WASM compilers and Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - name: Static qualification contracts
        run: node --test test/cycle-core-qualification.test.mjs test/cycle-browser-receipt.test.mjs test/cycle-candidate-decision.test.mjs

  qualify:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: floooh/chips
          ref: ca7d7ddd3ba77b48685d24120cf413ea53786767
          path: .cycle-candidates/z80
          sparse-checkout: |
            chips/z80.h
            LICENSE
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: SingleStepTests/z80
          ref: ebe1875d48f374bcfd4b505d8eb8ee751568b5f7
          path: .cycle-oracles/z80
          sparse-checkout: |
            v1/00.json
            v1/3e.json
            v1/32.json
            v1/cb 00.json
            LICENSE
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: raddad772/jsmoo
          ref: b6cc506e7c2f7b2b14cce6e98d0463467eb8c4d6
          path: .cycle-candidates/w65c02
          sparse-checkout: |
            component/cpu/m6502
            license.txt
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: SingleStepTests/65x02
          ref: 2f6980a2d95757486c7bee24355c360e40e2a224
          path: .cycle-oracles/w65c02
          sparse-checkout: |
            LICENSE
            wdc65c02/README.md
            wdc65c02/v1/04.json
            wdc65c02/v1/07.json
            wdc65c02/v1/0f.json
            wdc65c02/v1/1a.json
            wdc65c02/v1/64.json
            wdc65c02/v1/80.json
            wdc65c02/v1/a9.json
            wdc65c02/v1/ea.json
          sparse-checkout-cone-mode: false
      - name: Generate the bounded Z80 corpus from pinned oracle JSON
        env:
          CI: '1'
          Z80_ORACLE_ROOT: ${{ github.workspace }}/.cycle-oracles/z80
          Z80_ORACLE_HEADER: ${{ runner.temp }}/oracle-vectors.h
        run: node scripts/generate-floooh-z80-oracle-header.mjs | tee "$RUNNER_TEMP/z80-oracle-selection.json"
      - name: Compile the pinned native Z80 microstep runner
        run: cc -std=c99 -O2 -I .cycle-candidates/z80/chips -I "$RUNNER_TEMP" -DZ80_ORACLE_HEADER='"oracle-vectors.h"' scripts/fixtures/qualify-floooh-z80.c -o "$RUNNER_TEMP/qualify-z80"
      - name: Install the WebAssembly linker
        run: sudo apt-get update && sudo apt-get install -y lld-18
      - name: Compile the pinned freestanding Z80 browser module
        run: |
          mkdir -p artifacts/cycle-core-qualification
          clang --target=wasm32 -Oz -nostdlib \
            -I scripts/fixtures/freestanding -I .cycle-candidates/z80/chips \
            scripts/fixtures/qualify-floooh-z80-wasm.c \
            -Wl,--no-entry -Wl,--export=candidate_init -Wl,--export=candidate_run_batch \
            -Wl,--export-memory \
            -o artifacts/cycle-core-qualification/z80.wasm
      - name: Qualify pinned cycle candidates
        env:
          CI: '1'
          CYCLE_CANDIDATE_ROOT: ${{ github.workspace }}/.cycle-candidates
          CYCLE_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/cycle-core-qualification/report.json
          Z80_QUALIFICATION_RUNNER: ${{ runner.temp }}/qualify-z80
          W65C02_QUALIFICATION_RUNNER: ${{ github.workspace }}/scripts/fixtures/qualify-jsmoo-w65c02.mjs
          W65C02_ORACLE_ROOT: ${{ github.workspace }}/.cycle-oracles/w65c02
        run: node scripts/qualify-cycle-candidates.mjs
      - name: Install the qualification browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Measure the candidate in Chromium
        env:
          CI: '1'
          Z80_QUALIFICATION_WASM: ${{ github.workspace }}/artifacts/cycle-core-qualification/z80.wasm
          CYCLE_BROWSER_OUTPUT: ${{ github.workspace }}/artifacts/cycle-core-qualification/browser-report.json
        run: node scripts/verify-cycle-candidate-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cycle-core-qualification
          path: artifacts/cycle-core-qualification/**
          if-no-files-found: error
