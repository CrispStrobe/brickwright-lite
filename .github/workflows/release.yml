name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# SPIKE runtime for the macOS app (docs/SPIKE-MACOS.md): exact sources of the
# own NuttX guest and of the Renode Runtime that the macOS leg bundles.
env:
  SPIKE_FIRMWARE_SHA: 91cf0c07784441ac114b85a1705737327db2d9f8
  SPIKE_RUNTIME_SHA: 961a01f5c0fa9dd7f004df03dfbb37e1a5c55a67

jobs:
  # Own source-built NuttX guest (TI-free simulation profile only), staged by the
  # existing package producer. No reference or original LEGO firmware.
  spike-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out own firmware
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/brickwright-spike-prime-fw
          ref: 91cf0c07784441ac114b85a1705737327db2d9f8
          path: .spike/firmware
          persist-credentials: false
      - name: Check out the bundled SPIKE Runtime (platforms, state service)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/renode-spike-prime
          ref: 961a01f5c0fa9dd7f004df03dfbb37e1a5c55a67
          path: .spike/runtime
          persist-credentials: false
      - name: Build own NuttX simulation firmware
        working-directory: .spike/firmware
        run: |
          set -o pipefail
          git -C ../runtime submodule update --init --depth 1 src/Infrastructure
          git submodule update --init nuttx nuttx-apps
          python3 tools/apply_nuttx_backports.py
          docker build --pull -t nuttx-builder -f docker/Dockerfile.nuttx docker
          make nuttx BOARD_CONFIG=simulation V=1 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 20
          python3 tools/check_ti_free_image.py \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf \
            --build-log "$RUNNER_TEMP/build.log" \
            --build-root nuttx --build-root nuttx-apps --build-root apps \
            --config nuttx/.config --elf nuttx/nuttx_user.elf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Stage the own NuttX package (compiled models)
        run: |
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y -q binutils-arm-none-eabi
          printf 'placeholder\n' > "$RUNNER_TEMP/runtime-placeholder"
          node scripts/prepare-spike-nuttx-package.mjs .spike/firmware .spike/runtime .spike/runtime/src/Infrastructure \
            "$RUNNER_TEMP/runtime-placeholder" "$RUNNER_TEMP/spike-nuttx" --compiled-models
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-nuttx-package
          path: ${{ runner.temp }}/spike-nuttx
          if-no-files-found: error
          retention-days: 7

  # Multi-file SPIKE Renode for macOS (separate signable files, shipped tlib,
  # .NET notices, no Packet.Net/pip), built from the exact Runtime commit.
  spike-renode-macos:
    # Workflow file pinned separately from the Runtime source (runtime_ref): 86a58f1b
    # only moves its osx-arm64 leg from the retired macos-14 image to macos-15.
    uses: CrispStrobe/renode-spike-prime/.github/workflows/macos-spike-renode.yml@86a58f1bb4640bfd0bd987395a684a6a2c69a04c
    permissions:
      contents: read
    with:
      runtime_ref: 961a01f5c0fa9dd7f004df03dfbb37e1a5c55a67

  # Build the web bundle once (it is identical across OSes) and share it, so the
  # per-platform Tauri jobs don't each rebuild scratch-gui (and hit its OOM 3×).
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web bundle (vendor + integrate + webpack)
        # The webpack step OOMs marginally at times — retry once before failing.
        run: bash scripts/vercel-build.sh || (echo "retrying web build" && bash scripts/vercel-build.sh)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: packages/scratch-gui/build
          retention-days: 3

  tauri:
    needs: [build-web, spike-guest, spike-renode-macos]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Restore the prebuilt web bundle to the path tauri.conf.json's
      # frontendDist points at (repo-root packages/scratch-gui/build).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: packages/scratch-gui/build

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libdbus-1-dev libudev-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri

      # tauri-action runs `npm run tauri build` but does not install deps itself,
      # so the @tauri-apps/cli must be present first.
      - name: Install app dependencies (tauri CLI)
        working-directory: apps/tauri
        run: npm ci

      - name: Stage the SPIKE runtime as app resources (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: renode-spike-macos-osx-arm64
          path: ${{ runner.temp }}/spike-renode
      - if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spike-nuttx-package
          path: ${{ runner.temp }}/spike-nuttx
      - name: Freeze SPIKE resources and compile-time pins (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/spike-renode/renode-spike-macos-osx-arm64.tar.gz" -C "$RUNNER_TEMP/spike-renode"
          cat "$RUNNER_TEMP/spike-renode/provenance.json"
          node scripts/stage-spike-macos-resources.mjs "$RUNNER_TEMP/spike-renode/renode" "$RUNNER_TEMP/spike-nuttx" "$GITHUB_WORKSPACE/.spike-macos"
          node -e 'const p=require(process.argv[1]);for(const[k,v]of Object.entries(p))console.log(`${k}=${v}`)' "$GITHUB_WORKSPACE/.spike-macos/compile-pins.json" >> "$GITHUB_ENV"
          echo "SPIKE_TAURI_CONFIG=$GITHUB_WORKSPACE/.spike-macos/tauri-config.json" >> "$GITHUB_ENV"
      - name: Native SPIKE child-environment test (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib renode_child_env

      # Mac App Store provisioning profile: not part of tauri-action's own
      # keychain setup, so install it to the standard Xcode lookup path
      # ourselves before the build.
      - name: Install macOS provisioning profile
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE }}" | base64 --decode > /tmp/brickwright.provisionprofile
          PROFILE_UUID=$(security cms -D -i /tmp/brickwright.provisionprofile | plutil -extract UUID raw -)
          cp /tmp/brickwright.provisionprofile "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"

      # Both identities (Distribution for the .app, Installer for the .pkg
      # below) need to be on the keychain search list for the whole job, not
      # just Tauri's own build step -- hence a persistent keychain here
      # rather than relying on any built-in ephemeral cert-import.
      - name: Import Apple certificates (persistent, for productbuild)
        if: matrix.os == 'macos-latest'
        run: |
          KEYCHAIN=$RUNNER_TEMP/brickwright-ci.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${{ secrets.MACOS_CERT_P12_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the Tauri app (+ draft release on tags)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing: NOT importing APPLE_CERTIFICATE here on purpose.
          # Tauri's own bundler would import it into a second temp keychain,
          # colliding (ambiguous identity, same name) with the persistent one
          # just set up above for productbuild. tauri.conf.json already
          # declares signingIdentity, so the bundler just needs the identity
          # findable on the keychain search list -- which it now is. Harmless
          # no-op on the ubuntu/windows matrix legs either way. No notarization
          # vars are set on purpose -- Mac App Store builds go through App
          # Review, not notarization.
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        with:
          projectPath: apps/tauri
          # On a tag push, create/append to a draft GitHub release; on manual
          # runs both are empty, so tauri-action just builds (no release).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Brickwright {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          # macOS: bundle the staged SPIKE runtime (empty elsewhere).
          args: ${{ matrix.os == 'macos-latest' && format('--config {0}', env.SPIKE_TAURI_CONFIG) || '' }}

      # TestFlight (and App Store submission generally) requires the
      # provisioning profile physically embedded in the .app bundle as
      # Contents/embedded.provisionprofile, not just installed where
      # codesign can find it for identity/entitlement resolution. Tauri's
      # bundler doesn't embed it, so copy it in and re-sign (embedding
      # after the original sign invalidates that signature, so this has
      # to re-seal the whole bundle). Xcode normally also merges the
      # profile's own entitlements (application-identifier,
      # com.apple.developer.team-identifier, keychain-access-groups) into
      # what gets signed; a plain codesign --entitlements <ours> doesn't,
      # so extract them from the actual profile and merge rather than
      # hardcoding the team ID a second time here.
      - name: Embed provisioning profile + re-sign
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/tauri/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          cp /tmp/brickwright.provisionprofile "$APP_PATH/Contents/embedded.provisionprofile"

          security cms -D -i /tmp/brickwright.provisionprofile \
            | plutil -extract Entitlements xml1 -o /tmp/profile-entitlements.plist -
          cp apps/tauri/src-tauri/entitlements.plist /tmp/merged-entitlements.plist
          /usr/libexec/PlistBuddy -c "Merge /tmp/profile-entitlements.plist" /tmp/merged-entitlements.plist

          codesign --force --deep --strict --timestamp --options runtime \
            --entitlements /tmp/merged-entitlements.plist \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            "$APP_PATH"

          # SPIKE runtime under Contents/Resources/renode: --deep does not cover
          # Resources, so sign every nested Mach-O there individually, then the
          # Renode host as an app-sandbox + inherit child, then re-seal the app
          # (without --deep, so the child keeps its own entitlements).
          RENODE_DIR="$APP_PATH/Contents/Resources/renode"
          test -x "$RENODE_DIR/renode"
          # Mac App Store validation requires app-sandbox on EVERY executable
          # (90296; 0.1.29's .NET `createdump` helper failed it), so helper
          # executables get the same sandbox + inherit child entitlements as the
          # host; libraries are signed without entitlements, as before.
          find "$RENODE_DIR" -type f ! -path "$RENODE_DIR/renode" -print0 | while IFS= read -r -d '' f; do
            kind=$(file -b "$f")
            case "$kind" in
              Mach-O*executable*)
                codesign --force --timestamp --options runtime \
                  --entitlements apps/tauri/src-tauri/entitlements-renode-child.plist \
                  --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$f" ;;
              Mach-O*)
                codesign --force --timestamp --options runtime --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$f" ;;
            esac
          done
          codesign --force --timestamp --options runtime \
            --entitlements apps/tauri/src-tauri/entitlements-renode-child.plist \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$RENODE_DIR/renode"
          codesign --force --strict --timestamp --options runtime \
            --entitlements /tmp/merged-entitlements.plist \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements - "$RENODE_DIR/renode"

      # Mac App Store submission needs a .pkg installer wrapper signed with
      # the *separate* "3rd Party Mac Developer Installer" identity -- the
      # Apple Distribution identity above only covers the .app itself.
      - name: Build signed .pkg for Mac App Store submission
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find apps/tauri/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          productbuild --component "$APP_PATH" /Applications \
            --sign "3rd Party Mac Developer Installer: Christian Ströbele (${{ secrets.MACOS_TEAM_ID }})" \
            apps/tauri/src-tauri/target/release/bundle/macos/Brickwright.pkg

      # Installed-app test: install the signed .pkg on this hosted runner and boot
      # the own NuttX guest with the app's own signed SPIKE Renode child, plus the
      # hardened-runtime entitlement measurement with the real Team ID.
      - name: SPIKE installed-app test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo installer -pkg apps/tauri/src-tauri/target/release/bundle/macos/Brickwright.pkg -target /
          APP=$(find /Applications -maxdepth 1 -name 'Brickwright*.app' | head -1)
          test -n "$APP"
          bash scripts/macos/spike-installed-test.sh "$APP" "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$RUNNER_TEMP/spike-installed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.os == 'macos-latest'
        with:
          name: spike-installed-test
          path: ${{ runner.temp }}/spike-installed
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'macos-latest'
        with:
          name: brickwright-macos-appstore-pkg
          path: apps/tauri/src-tauri/target/release/bundle/macos/Brickwright.pkg
          if-no-files-found: warn
          retention-days: 7

      # Validate + upload to App Store Connect -- only on real version tags,
      # never on workflow_dispatch test runs (avoids spamming builds onto the
      # app record while iterating on this workflow).
      #
      # AND THE GUARD SAYS SO NOW. It read the ref shape alone, and a
      # workflow_dispatch ON A TAG satisfies that — so "avoids spamming builds
      # onto the app record while iterating on this workflow" was a sentence,
      # not a condition. Found 2026-09-11 by the gate written for mobile.yml's
      # identical defect, which is the only reason this one was looked at.
      - name: Validate + upload to App Store Connect
        if: github.event_name == 'push' && matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

          PKG=apps/tauri/src-tauri/target/release/bundle/macos/Brickwright.pkg
          BUNDLE_VERSION=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")

          xcrun altool --validate-app -f "$PKG" \
            --type macos \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

          xcrun altool --upload-package "$PKG" \
            --type macos \
            --apple-id ${{ vars.APPSTORE_APP_ID }} \
            --bundle-id com.crispstrobe.brickwright \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_VERSION" \
            --api-key ${{ secrets.APPSTORE_API_KEY_ID }} \
            --api-issuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

      # The macOS build shares the iOS app record, but mobile.yml's tester-notes
      # and distribution steps finish before this upload exists, so until
      # 0.1.29 the macOS build was uploaded to nobody. Same scripts, named
      # platform: both wait for the macOS build to be VALID and are idempotent.
      - name: Send macOS tester notes to App Store Connect
        if: github.event_name == 'push' && matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
        run: node scripts/push-tester-notes.mjs --platform MAC_OS

      - name: Distribute the macOS build to TestFlight (internal + external)
        if: github.event_name == 'push' && matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ vars.APPSTORE_APP_ID }}
        run: node scripts/testflight-submit.mjs --platform MAC_OS

      # Also expose the bundles as workflow artifacts (useful for manual runs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brickwright-${{ matrix.os }}
          path: apps/tauri/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
