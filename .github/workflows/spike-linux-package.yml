name: SPIKE Linux package exercise

# Hosted end-to-end run of scripts/build-spike-linux-desktop.mjs: real builder,
# notice/inventory gates, Rust compile, crate notices, dpkg-deb, a normal-policy
# dpkg install in a throwaway container and the installed-layout check. The
# Renode runtime, MicroPython support profile and frontend are labelled
# placeholders (no public pinned producer exists for the first two); see
# docs/SPIKE-LINUX-DESKTOP.md "Hosted packaging exercise". No package is uploaded.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spike-linux-package.yml'
      - 'scripts/ci-spike-linux-package-exercise.mjs'
      - 'scripts/build-spike-linux-desktop.mjs'
      - 'scripts/verify-spike-linux-installed-layout.sh'
      - 'scripts/prepare-spike-micropython-pins.mjs'
      - 'scripts/gen-spike-linux-crate-inventory.mjs'
      - 'scripts/lib/spike-linux-*.mjs'
      - 'scripts/lib/spike-resource-profile.mjs'
      - 'apps/tauri/src-tauri/Cargo.toml'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/tauri.conf.json'
      - 'docs/generated/spike-linux-crate-inventory.json'
      - 'docs/spike-linux-licence-review.json'
      - 'docs/notices/rust-crates-supplemental/**'
  pull_request:
    paths:
      - '.github/workflows/spike-linux-package.yml'
      - 'scripts/ci-spike-linux-package-exercise.mjs'
      - 'scripts/build-spike-linux-desktop.mjs'
      - 'scripts/verify-spike-linux-installed-layout.sh'
      - 'scripts/prepare-spike-micropython-pins.mjs'
      - 'scripts/gen-spike-linux-crate-inventory.mjs'
      - 'scripts/lib/spike-linux-*.mjs'
      - 'scripts/lib/spike-resource-profile.mjs'
      - 'apps/tauri/src-tauri/Cargo.toml'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/tauri.conf.json'
      - 'docs/generated/spike-linux-crate-inventory.json'
      - 'docs/spike-linux-licence-review.json'
      - 'docs/notices/rust-crates-supplemental/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tauri/src-tauri
      # The builder compiles with --locked --offline; fetch the locked crates first.
      - name: Fetch locked crates
        run: cargo fetch --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Assemble the package with placeholder runtime and support inputs
        run: node scripts/ci-spike-linux-package-exercise.mjs "$RUNNER_TEMP/spike-linux-package"
      # Ubuntu base images exclude /usr/share/doc/*; drop that policy so the
      # notice checks see what a normal system installs. The image is pinned by digest.
      - name: Install with normal dpkg policy and check the installed layout
        run: |
          out="$RUNNER_TEMP/spike-linux-package/package-output"
          deb="$(cd "$out" && ls brickwright_*_amd64.deb)"
          docker run --rm \
            -v "$out:/package:ro" -v "$PWD/scripts:/check:ro" \
            ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            bash -euo pipefail -c "rm -f /etc/dpkg/dpkg.cfg.d/excludes
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /package/$deb >/dev/null
              bash /check/verify-spike-linux-installed-layout.sh"
