          persist-credentials: false
      - name: Install empty Python cache prefix and refuse unreviewed actual source
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 022
          prefix=/home/runner/work/_temp/bw-gui-hdd-python-cache
          for parent in / /home /home/runner /home/runner/work /home/runner/work/_temp; do
            test -d "$parent" && test ! -L "$parent"
            test "$(realpath -e "$parent")" = "$parent"
          done
          mkdir gui-setup
          mkdir -m 0555 "$prefix"
          entry_marker="$(find "$prefix" -mindepth 1 -maxdepth 1 -printf x -quit)"
          test -z "$entry_marker"
          set -o noclobber
          {
            echo bw.gui-hdd.python-startup-install.v1
            echo "$prefix"
            echo created-exclusive
            echo empty-before-entry
            stat -c '%d %i %f %u %g %h %s %Y' "$prefix"
          } > gui-setup/python-startup.original.txt
          chmod 0444 gui-setup/python-startup.original.txt
          /usr/bin/python3.12 -I -S -B -X pycache_prefix=/home/runner/work/_temp/bw-gui-hdd-python-cache scripts/run-i80386-hdd-gui-actual.py actual-v6-guard
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
