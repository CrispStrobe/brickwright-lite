      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-finite-inventory-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-finite-inventory-v4
          if-no-files-found: error
          retention-days: 14

  # This finite v5 route was consumed by its one-shot failed observation.
  # Retain its original protocol and artifact history with execution retired.
  finite-inventory-five:
    if: >-
      ${{ false && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v5' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V5_SHA256: ${{ vars.BW_GUI_HDD_FINITE_INVENTORY_V5_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v5 body, event and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v5
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v5-guard \
            > gui-finite-inventory-v5/guard.stdout 2> gui-finite-inventory-v5/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite v5 package and Chromium setup
        timeout-minutes: 10
        run: |
