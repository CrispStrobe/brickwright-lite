          node node_modules/playwright/cli.js install --with-deps chromium \
            > gui-finite-inventory-v4/chromium.stdout 2> gui-finite-inventory-v4/chromium.stderr
      - name: Record finite v4 core runtime and installed CUI bytes without tool probes
        timeout-minutes: 4
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory \
            --request "$GITHUB_WORKSPACE/gui-finite-inventory-v4/runtime-template.json" \
