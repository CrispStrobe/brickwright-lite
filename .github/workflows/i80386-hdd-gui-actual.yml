          echo '45b1fa7c52dd996c3bfa5e352ffcd410781b952a6ad629f15a4c9ec4bbaefc5a  gui-inputs/FD14-FloppyEdition.zip' | sha256sum --check
          unzip -p gui-inputs/FD14-FloppyEdition.zip 120m/x86BOOT.img > gui-inputs/floppy.img
          timeout 30s node scripts/prepare-i80386-freedos-interaction.mjs \
