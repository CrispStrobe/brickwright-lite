name: 386 GUI HDD and forward-debug acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Owned ready pull request number
        required: true
        type: string
      source_head:
        description: Reviewed 40-hex source head
        required: true
        type: string
      request_sha256:
        description: Reviewed canonical request SHA-256
        required: true
        type: string
      tag_name:
        description: One reviewed source tag name
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gui-hdd-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # The finite v6 metadata event is consumed. Its standalone reader and
  # historical protocol remain; the execution gate is retired.
  finite-inventory-six:
    if: >-
      ${{ false && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v6' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V6_SHA256: ${{ vars.BW_GUI_HDD_FINITE_INVENTORY_V6_SHA256 }}
      BW_FINITE_INVENTORY_V6_TEMPLATE_B64: ${{ vars.BW_GUI_HDD_FINITE_INVENTORY_V6_TEMPLATE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v6 body, event and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v6
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v6-guard \
            > gui-finite-inventory-v6/guard.stdout 2> gui-finite-inventory-v6/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite v6 package and Chromium setup
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund \
            > gui-finite-inventory-v6/npm.stdout 2> gui-finite-inventory-v6/npm.stderr
          node node_modules/playwright/cli.js install --with-deps chromium \
            > gui-finite-inventory-v6/chromium.stdout 2> gui-finite-inventory-v6/chromium.stderr
      - name: Record finite v6 runtime and installed regular bytes without guest
        timeout-minutes: 4
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v6 \
            --request "$GITHUB_WORKSPACE/gui-finite-inventory-v6/runtime-template.json" \
            --expected-sha256 "$BW_FINITE_INVENTORY_V6_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-finite-inventory-v6/inventory-original.json" \
            > gui-finite-inventory-v6/controller.stdout 2> gui-finite-inventory-v6/controller.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-finite-inventory-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-finite-inventory-v6
          if-no-files-found: error
          retention-days: 14


  # Fresh CUI 408 installed inventory route; source and event gate are separate.
  finite-inventory-seven:
    if: >-
      ${{ false && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v7' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V7_SHA256: ${{ vars.BW_FINITE_INVENTORY_V7_SHA256 }}
      BW_FINITE_INVENTORY_V7_TEMPLATE_B64: ${{ vars.BW_FINITE_INVENTORY_V7_TEMPLATE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v7 body, event and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v7
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v7-guard \
            > gui-finite-inventory-v7/guard.stdout 2> gui-finite-inventory-v7/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite v7 package and Chromium setup
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund \
            > gui-finite-inventory-v7/npm.stdout 2> gui-finite-inventory-v7/npm.stderr
          node node_modules/playwright/cli.js install --with-deps chromium \
            > gui-finite-inventory-v7/chromium.stdout 2> gui-finite-inventory-v7/chromium.stderr
      - name: Record finite v7 runtime and installed regular bytes without guest
        timeout-minutes: 4
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v7 \
            --request "$GITHUB_WORKSPACE/gui-finite-inventory-v7/runtime-template.json" \
            --expected-sha256 "$BW_FINITE_INVENTORY_V7_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-finite-inventory-v7/inventory-original.json" \
            > gui-finite-inventory-v7/controller.stdout 2> gui-finite-inventory-v7/controller.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-finite-inventory-v7-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-finite-inventory-v7
          if-no-files-found: error
          retention-days: 14


  finite-inventory-eight:
    if: >-
      ${{ false && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v8' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V8_SHA256: ${{ vars.BW_FINITE_INVENTORY_V8_SHA256 }}
      BW_FINITE_INVENTORY_V8_TEMPLATE_B64: ${{ vars.BW_FINITE_INVENTORY_V8_TEMPLATE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v8 body, event and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v8
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v8-guard \
            > gui-finite-inventory-v8/guard.stdout 2> gui-finite-inventory-v8/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite v8 package and Chromium setup
        timeout-minutes: 10
        run: |
          set -euo pipefail
          {
            sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs
          } > gui-finite-inventory-v8/bootstrap.stdout 2> gui-finite-inventory-v8/bootstrap.stderr
          npm ci --ignore-scripts --no-audit --no-fund \
            > gui-finite-inventory-v8/npm.stdout 2> gui-finite-inventory-v8/npm.stderr
          node node_modules/playwright/cli.js install --with-deps chromium \
            > gui-finite-inventory-v8/chromium.stdout 2> gui-finite-inventory-v8/chromium.stderr
      - name: Record finite v8 runtime and installed regular bytes without guest
        timeout-minutes: 4
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v8 \
            --request "$GITHUB_WORKSPACE/gui-finite-inventory-v8/runtime-template.json" \
            --expected-sha256 "$BW_FINITE_INVENTORY_V8_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-finite-inventory-v8/inventory-original.json" \
            > gui-finite-inventory-v8/controller.stdout 2> gui-finite-inventory-v8/controller.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-finite-inventory-v8-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-finite-inventory-v8
          if-no-files-found: error
          retention-days: 14


  finite-inventory-nine:
    if: >-
      ${{ true && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v9' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V9_SHA256: ${{ vars.BW_FINITE_INVENTORY_V9_SHA256 }}
      BW_FINITE_INVENTORY_V9_TEMPLATE_B64: ${{ vars.BW_FINITE_INVENTORY_V9_TEMPLATE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v9 body, event and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v9
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v9-guard \
            > gui-finite-inventory-v9/guard.stdout 2> gui-finite-inventory-v9/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite v9 package and Chromium setup
        timeout-minutes: 10
        run: |
          set -euo pipefail
          {
            sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs
          } > gui-finite-inventory-v9/bootstrap.stdout 2> gui-finite-inventory-v9/bootstrap.stderr
          npm ci --ignore-scripts --no-audit --no-fund \
            > gui-finite-inventory-v9/npm.stdout 2> gui-finite-inventory-v9/npm.stderr
          node node_modules/playwright/cli.js install --with-deps chromium \
            > gui-finite-inventory-v9/chromium.stdout 2> gui-finite-inventory-v9/chromium.stderr
      - name: Record finite v9 runtime and installed regular bytes without guest
        timeout-minutes: 4
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-v9 \
            --request "$GITHUB_WORKSPACE/gui-finite-inventory-v9/runtime-template.json" \
            --expected-sha256 "$BW_FINITE_INVENTORY_V9_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-finite-inventory-v9/inventory-original.json" \
            > gui-finite-inventory-v9/controller.stdout 2> gui-finite-inventory-v9/controller.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-finite-inventory-v9-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-finite-inventory-v9
          if-no-files-found: error
          retention-days: 14


  controls:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Source and manufactured-original controls only
        run: >-
          node --test test/i80386-hdd-gui-actual.test.mjs
          test/i80386-hdd-download.test.mjs

  # These two literal guards require a later reviewed activation commit. Variables
  # transport independently frozen Git blobs/digests; they never approve them.
  inventory:
    if: >-
      ${{ true && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-inventory' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_TEMPLATE_BLOB: ${{ vars.BW_GUI_HDD_TEMPLATE_BLOB }}
      BW_TEMPLATE_SHA256: ${{ vars.BW_GUI_HDD_TEMPLATE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse unreviewed inventory before setup or input retrieval
        run: /usr/bin/python3 -B scripts/run-i80386-hdd-gui-actual.py inventory-guard
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install unchanged selected packages and Chromium without frontend build
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Install externally selected immutable template and record observations
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir gui-inventory
          /usr/bin/python3 -B scripts/run-i80386-hdd-gui-actual.py install-input \
            --blob "$BW_TEMPLATE_BLOB" --expected-sha256 "$BW_TEMPLATE_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-inventory/runtime-template.json" \
            > gui-inventory/input-install.stdout 2> gui-inventory/input-install.stderr
          /usr/bin/python3 -B scripts/run-i80386-hdd-gui-actual.py inventory \
            --request "$GITHUB_WORKSPACE/gui-inventory/runtime-template.json" \
            --expected-sha256 "$BW_TEMPLATE_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-inventory/inventory-original.json" \
            > gui-inventory/controller.stdout 2> gui-inventory/controller.stderr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i80386-hdd-gui-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: gui-inventory
          if-no-files-found: error
          retention-days: 14

  # Consumed finite v4 observation; preserve its original and reader without
  # admitting a second execution. No font selection/browser/guest runs.
  finite-inventory-v4:
    if: >-
      ${{ false && github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'x86-hdd-gui-finite-inventory-v4' && github.actor == 'CrispStrobe' &&
          github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_FINITE_INVENTORY_V4_SHA256: ${{ vars.BW_GUI_HDD_FINITE_INVENTORY_V4_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit finite v4 body, event, scope and exact source before package acquisition
        run: |
          set -euo pipefail
          mkdir -m 0700 gui-finite-inventory-v4
          /usr/bin/python3.12 -I -S -B scripts/run-i80386-hdd-gui-actual.py finite-inventory-guard \
            > gui-finite-inventory-v4/guard.stdout 2> gui-finite-inventory-v4/guard.stderr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Trusted finite inventory package and Chromium setup
        timeout-minutes: 10
        run: |
