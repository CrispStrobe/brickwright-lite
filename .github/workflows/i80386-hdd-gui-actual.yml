            test -z "$entry_marker"
            /usr/bin/python3.12 -I -S -B -X pycache_prefix=/home/runner/work/_temp/bw-gui-hdd-python-cache "$@"
          }
          python_actual scripts/run-i80386-hdd-gui-actual.py install-input \
            --blob "$BW_REQUEST_BLOB" --expected-sha256 "$BW_REQUEST_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-inputs/request.json" \
            > gui-setup/input-install.stdout 2> gui-setup/input-install.stderr
          python_actual scripts/run-i80386-hdd-gui-actual.py actual-v6-preflight \
            --request "$GITHUB_WORKSPACE/gui-inputs/request.json" --expected-sha256 "$BW_REQUEST_SHA256" \
            --output "$GITHUB_WORKSPACE/gui-setup/preflight" \
