        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium
      # V5 preflight admits source/event/tools before one bounded font+notice
      # acquisition into an exclusive owned root; actual reuses those bytes.
      - name: Install externally admitted request and refuse runtime/source drift
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir gui-inputs gui-originals
          python_actual() {
            local prefix=/home/runner/work/_temp/bw-gui-hdd-python-cache
            test "$(realpath -e "$prefix")" = "$prefix" && test ! -L "$prefix"
