          if-no-files-found: error
          retention-days: 14

  # Actual v6 is armed but unselected. Exact-head source checks and a separate
  # reviewed Build, request and one-shot event remain required before scenarios.
  # Chromium/Board scenarios use no QEMU adapter.
  actual:
    if: >-
      ${{ false && github.event_name == 'pull_request' &&
          github.event.action == 'labeled' && github.event.label.name == 'x86-hdd-gui-actual-v6' &&
          github.actor == 'CrispStrobe' && github.run_attempt == 1 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # Setup consumes this same job budget. The31min step ceiling is not a
    # sufficiency claim; later resource review must admit measured setup margin.
    timeout-minutes: 35
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_REQUEST_BLOB: ${{ vars.BW_GUI_HDD_ACTUAL_V6_REQUEST_BLOB }}
      BW_REQUEST_SHA256: ${{ vars.BW_GUI_HDD_ACTUAL_V6_REQUEST_SHA256 }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      NODE_V8_COVERAGE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
