name: Build (permissive base)
on:
  workflow_dispatch:
  push:
    branches: [main, bundle-test]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      - name: Install
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      - name: Build the editor (proves the permissive base compiles)
        run: |
          cd packages/scratch-gui
          /usr/bin/time -v sh -c 'NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build' 2>&1 | tee build.log
          echo "---"
          grep "Maximum resident" build.log || true
          du -sh build/
          echo "=== Build output by size ==="
          find build/ -type f \( -name '*.js' -o -name '*.css' \) -exec ls -lhS {} + | head -20
          echo "=== Static assets by size ==="
          du -sh build/static/*/  2>/dev/null || true
          find build/static/ -type f -size +100k -exec ls -lhS {} + 2>/dev/null | head -20
      - uses: actions/upload-artifact@v4
        with: { name: editor-build, path: packages/scratch-gui/build }
