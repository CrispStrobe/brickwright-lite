name: Build (permissive base)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      - name: Install
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs

      # --- guards: catch silent reverts before the build runs ---

      - name: Guard — bundled stc12 has all emitted opcodes
        run: |
          FILE=overlay/scratch-vm/src/extensions/crispstrobe/stc12/index.js
          COUNT=$(grep -c 'opcode:' "$FILE")
          echo "stc12 opcodes: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Bundled stc12 has only $COUNT opcodes (need ≥10). Was it rebuilt from the gallery?"
            exit 1
          fi

      - name: Guard — WASM pin is not older than the crash-fix floor
        run: |
          PIN=$(grep "const PIN" scripts/sync-emu8051-wasm.mjs | head -1)
          echo "$PIN"
          # The crash fix is at 85ed23d. The original crashing pin is 2f896b1a.
          # Fail if the pin is the known-bad value.
          if echo "$PIN" | grep -q '2f896b1a'; then
            echo "::error::WASM pin is the crashing pre-fix build (2f896b1a). Re-pin to 85ed23d or later."
            exit 1
          fi
          node scripts/sync-emu8051-wasm.mjs --check

      - name: Guard — toolbox reducer does not import makeToolboxXML
        run: |
          # The crash: reducers/toolbox.js importing and calling makeToolboxXML(true)
          # at module level touches scratch-blocks before the lazy loader resolves.
          FILE=overlay/scratch-gui/src/reducers/toolbox.js
          if [ ! -f "$FILE" ]; then
            FILE=packages/scratch-gui/src/reducers/toolbox.js
          fi
          if grep -v '^\s*//' "$FILE" | grep -q 'import.*makeToolboxXML\|require.*make-toolbox-xml'; then
            echo "::error::toolbox.js imports makeToolboxXML — GUI will crash (scratch-blocks not loaded yet)"
            exit 1
          fi
          echo "toolbox reducer: no makeToolboxXML import (good)"

      # --- build ---

      - name: Build the editor
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build
      - uses: actions/upload-artifact@v4
        with: { name: editor-build, path: packages/scratch-gui/build }
