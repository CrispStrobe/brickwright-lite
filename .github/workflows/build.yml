name: Build (permissive base)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      - name: Install
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      - name: Apply the scratch-paint overlay (extended costume designer)
        run: node scripts/apply-paint-overlay.mjs

      # --- guards: catch silent reverts before the build runs ---
      #
      # Falsified 2026-08-09 on branch guard-falsification (deleted):
      #   1. stc12 truncated to 4 opcodes → CAUGHT (run 31312830786)
      #      "Bundled stc12 has only 4 opcodes (need ≥10)"
      #   2. PIN=2f896b1a with matching binary → CAUGHT (run 31312945118)
      #      "WASM PIN is not a descendant of the crash-fix floor (85ed23d)"
      #      Proved the floor check, not a single-hash blacklist.
      #   3. blocks.jsx null-guard removed → CAUGHT (run 31313002380)
      #      "blocks.jsx is missing the toolbox null-guard"
      #      Exact replay of the 0ba092b revert that caused the live outage.
      #   4. HOC throw (unknown GUI crash) → CAUGHT (run 31331264070)
      #      "FAIL: GUI did not render" — all 3 static guards passed, only the
      #      headless browser check caught it. Proved it catches unknown causes,
      #      not just the three named regressions. Branch: guard4-falsification.

      - name: Guard — bundled stc12 has all emitted opcodes
        run: |
          FILE=overlay/scratch-vm/src/extensions/crispstrobe/stc12/index.js
          COUNT=$(grep -c 'opcode:' "$FILE")
          echo "stc12 opcodes: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Bundled stc12 has only $COUNT opcodes (need ≥10). Was it rebuilt from the gallery?"
            exit 1
          fi

      - name: Guard — WASM pin is a descendant of the crash-fix floor
        run: |
          # The floor: 85ed23d is the commit with the emu_init crash fix and
          # corrected BUILD-INFO.md. Any pin older than this ships a crashing
          # binary. Bump the floor when a newer build is deliberately adopted.
          FLOOR=85ed23d
          PIN=$(node -e "
            const src = require('fs').readFileSync('scripts/sync-emu8051-wasm.mjs','utf8');
            const m = src.match(/const PIN = '([^']+)'/);
            console.log(m ? m[1] : '');
          ")
          echo "PIN=$PIN  FLOOR=$FLOOR"
          if [ -z "$PIN" ]; then
            echo "::error::Could not extract PIN from sync-emu8051-wasm.mjs"
            exit 1
          fi
          # Clone just enough of emu8051-stc to check ancestry
          git clone --bare --filter=blob:none https://github.com/CrispStrobe/emu8051-stc.git /tmp/emu8051-stc.git 2>/dev/null
          if ! git -C /tmp/emu8051-stc.git merge-base --is-ancestor "$FLOOR" "$PIN" 2>/dev/null; then
            echo "::error::WASM PIN ($PIN) is not a descendant of the crash-fix floor ($FLOOR). Re-pin to $FLOOR or later."
            exit 1
          fi
          echo "PIN is at or after the floor — good"
          node scripts/sync-emu8051-wasm.mjs --check

      - name: Guard — blocks.jsx has the toolbox null-guard
        run: |
          # The crash: blocks.jsx passes this.props.toolboxXML to ScratchBlocks.inject().
          # toolboxXML is null at startup (deferred because scratch-blocks is lazy-loaded).
          # Without the null-guard, inject() gets null and the GUI doesn't mount.
          FILE=overlay/scratch-gui/src/containers/blocks.jsx
          if ! grep -q 'this.props.toolboxXML || makeToolboxXML' "$FILE"; then
            echo "::error::blocks.jsx is missing the toolbox null-guard (this.props.toolboxXML || makeToolboxXML). GUI will not render."
            exit 1
          fi
          echo "blocks.jsx: toolbox null-guard present (good)"

      - name: Guard — vendored sources are not stale
        run: |
          # Compare vendored overlay against upstream HEAD for key files.
          # Warns (does not fail) — silent staleness is how finished work
          # becomes invisible to users.
          stale=0
          for pair in \
            "bw-circuit-ui:CrispStrobe/bw-circuit-ui:src/index.js:overlay/scratch-gui/src/lib/bw-circuit-ui/index.js" \
            "bw-board:CrispStrobe/bw-board:src/index.js:overlay/scratch-gui/src/lib/bw-board/index.js"; do
            IFS=: read -r name repo remote local <<< "$pair"
            if [ ! -f "$local" ]; then continue; fi
            upstream=$(curl -sf "https://raw.githubusercontent.com/$repo/master/$remote" 2>/dev/null || \
                       curl -sf "https://raw.githubusercontent.com/$repo/main/$remote" 2>/dev/null || echo "")
            if [ -z "$upstream" ]; then echo "$name: upstream not accessible (private repo?)"; continue; fi
            local_hash=$(sha256sum "$local" | cut -d' ' -f1)
            remote_hash=$(echo "$upstream" | sha256sum | cut -d' ' -f1)
            if [ "$local_hash" != "$remote_hash" ]; then
              echo "::warning::$name overlay differs from upstream HEAD — re-vendor needed"
              stale=$((stale+1))
            else
              echo "$name: up to date"
            fi
          done
          echo "vendor staleness: $stale stale"

      # --- tests ---

      # Milestone 0: the shipped example corpus must be proven to EXECUTE, and
      # the gate that proves it must be present and must still be able to fail.
      # `npm test` below runs both gates through its glob; this step exists so a
      # deleted gate, or a ratchet quietly padded until nothing is red any more,
      # is a build failure and not an absence nobody notices. Both failure modes
      # have happened in this repo: five gates were found that could not fail,
      # and a dead-module exclusion list grew from five entries to sixteen while
      # staying green.
      #
      # Mutation-proven 2026-08-23 (docs/EXAMPLE-CORPUS-FINDINGS.md, seven
      # mutations): breaking a shipped example, deleting an opcode from a
      # bundled extension, padding a ratchet, and removing the corpus each make
      # the gate red.
      - name: Guard — the example execution gates exist and their ratchets have not grown
        run: |
          set -e
          for gate in test/example-vm-execution.test.mjs test/example-execution.test.mjs; do
            if [ ! -f "$gate" ]; then
              echo "::error::$gate is missing — the shipped example corpus would be unproven"
              exit 1
            fi
          done
          # A waiver list may only shrink. These ceilings are the counts measured
          # on 2026-08-23; lower them as examples are fixed, never raise them.
          node -e "
            const fs = require('fs');
            const gate = fs.readFileSync('test/example-vm-execution.test.mjs', 'utf8');
            const count = (name, open, close) => {
              const at = gate.indexOf(name);
              if (at < 0) { console.error('::error::' + name + ' is gone from the gate'); process.exit(1); }
              const body = gate.slice(gate.indexOf(open, at), gate.indexOf(close, at));
              return (body.match(/'[^']+'/g) || []).length;
            };
            const ceilings = {KNOWN_INERT: 9, KNOWN_SHADOWED_WRITES: 19, KNOWN_NO_BLOCKS: 2};
            let bad = 0;
            for (const [name, ceiling] of Object.entries(ceilings)) {
              const n = count(name, '[', ']');
              console.log(name + ': ' + n + ' waived (ceiling ' + ceiling + ')');
              if (n > ceiling) {
                console.error('::error::' + name + ' grew to ' + n + ' entries (ceiling ' + ceiling +
                  '). A waiver list may only shrink.');
                bad++;
              }
            }
            const undefinedOpcodes = (gate.slice(gate.indexOf('KNOWN_MISSING_OPCODES'),
              gate.indexOf('KNOWN_INERT')).match(/'[a-z0-9]+_[a-z0-9_]+'/g) || []).length;
            console.log('KNOWN_MISSING_OPCODES: ' + undefinedOpcodes + ' opcodes waived (ceiling 28)');
            if (undefinedOpcodes > 28) {
              console.error('::error::KNOWN_MISSING_OPCODES grew to ' + undefinedOpcodes + ' opcodes.');
              bad++;
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Run unit tests
        run: |
          if ! grep -q '"test"' package.json; then
            echo "::error::package.json has no test script — tests exist but nothing runs them"
            exit 1
          fi
          npm test

      # --- build ---

      - name: Build the editor
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build

      - name: Smoke-test the debugger
        run: |
          if ! grep -q '"smoke:debugger"' package.json; then
            echo "::error::package.json has no smoke:debugger script — the debugger is untested"
            exit 1
          fi
          # smoke:debugger needs SDCC + stc-compiler locally. In CI, report
          # absence rather than silently skipping — but do not fail the build
          # for a tool the runner cannot provide.
          npm run smoke:debugger || {
            EXIT=$?
            if [ $EXIT -eq 2 ]; then
              echo "::warning::smoke:debugger skipped (exit 2 = missing local tool, e.g. SDCC). Runs locally."
            else
              exit $EXIT
            fi
          }

      # Browser acceptance BEFORE the artifact leaves this job. The
      # 930000d incident shipped a wall-to-wall visual regression on
      # green unit tests — unit suites cannot see a lost theme, a
      # broken pane, or a dead button. These gates drive the ACTUAL
      # BUILT APP and block the deploy when it is visibly wrong.
      - name: Install Playwright browser
        id: playwright
        # Gate-only tool (the gates drive the built app), NOT an app dependency —
        # and NOT worth blocking a deploy over. If chromium can't install (a
        # CDN/infra outage, exit 100), this step fails softly and the gates below
        # skip, so an outage can't freeze the deploy. The gates still run and
        # block whenever chromium installs normally.
        continue-on-error: true
        # The verify scripts import the playwright package from the repo
        # root; install it ephemerally (--no-save) plus its chromium.
        run: |
          # Playwright's chromium download can hang on a flaky mirror; with no
          # timeout a stalled download froze the whole deploy for ~90 min. Bound
          # each attempt and retry so it fails fast and recovers.
          npm install --no-save playwright
          ok=0
          for i in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright chromium install attempt $i failed/timed out; retrying"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::playwright chromium install failed after 3 attempts"; exit 1; }
      - name: Serve the built app
        if: steps.playwright.outcome == 'success'
        run: |
          python3 -m http.server 8617 --directory packages/scratch-gui/build &
          for i in $(seq 1 30); do curl -sf http://localhost:8617/ >/dev/null && break; sleep 1; done
      - name: Browser gate — circuit UX
        if: steps.playwright.outcome == 'success'
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-circuit-ux.mjs
      - name: Browser gate — circuit rendering and placement
        if: steps.playwright.outcome == 'success'
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-circuit-rendering.mjs
      - name: Browser gate — view buttons
        if: steps.playwright.outcome == 'success'
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-view-buttons.mjs
      - name: Browser gate — editor
        if: steps.playwright.outcome == 'success'
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-editor.mjs
      # The debugger dock has now regressed to a blank pane twice, and the
      # serial console was output-only for as long as it existed. Both are
      # invisible to every unit suite: one is a chunk that was never
      # requested, the other a machine that could not be answered.
      - name: Browser gate — debugger dock and serial input
        if: steps.playwright.outcome == 'success'
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-debug-dock.mjs

      - uses: actions/upload-pages-artifact@v3
        with: { path: packages/scratch-gui/build }

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-gui:
    needs: deploy
    runs-on: ubuntu-latest
    # Smoke-test the deployed site in a headless browser. Catches GUI-breaking
    # regressions that pass all static guards — the unknown-cause class.
    steps:
      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium --with-deps
      - name: Verify GUI renders on deployed site
        run: |
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const url = 'https://crispstrobe.github.io/brickwright-lite/';
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 1400, height: 800 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));

              console.log('Loading ' + url + ' ...');
              await page.goto(url, {
                waitUntil: 'networkidle', timeout: 60000
              });

              try {
                await page.waitForSelector('[class*=\"menu-bar\"], [class*=\"gui_\"], [role=\"tab\"]', { timeout: 60000 });
              } catch {
                console.error('FAIL: GUI did not render');
                if (errors.length) console.error('Page errors:', errors);
                process.exit(1);
              }

              const tabs = await page.locator('[role=tab]').allInnerTexts();
              console.log('Tabs:', tabs.join(', '));

              if (tabs.length === 0) {
                console.error('FAIL: No tabs rendered — GUI is broken');
                if (errors.length) console.error('Page errors:', errors);
                process.exit(1);
              }

              console.log('OK: GUI renders with', tabs.length, 'tabs');

              // --- Extension-block regression guard (e155ca1) ---
              // Node cannot reproduce this bug: the browser and node disagree about
              // whether sb3.js drops blocks with unknown extension prefixes. This
              // headless browser check is the only harness that distinguishes 5/7 from 7/7.
              await page.addScriptTag({ url: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' });
              const extResult = await page.evaluate(async () => {
                const guiEl = document.querySelector('[class*=\"gui_body\"]') || document.querySelector('[class*=\"gui\"]');
                const key = Object.keys(guiEl).find(k => k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance'));
                let fiber = guiEl[key], vm = null;
                for (let i = 0; i < 30 && fiber; i++) {
                  if (fiber.memoizedProps && fiber.memoizedProps.vm) { vm = fiber.memoizedProps.vm; break; }
                  fiber = fiber.return;
                }
                if (!vm) return { error: 'vm not found' };
                const project = {
                  targets: [{ isStage: true, name: 'Stage', variables: {}, lists: {}, broadcasts: {},
                    blocks: {
                      h: { opcode: 'event_whenflagclicked', next: 'f', parent: null, inputs: {}, fields: {}, shadow: false, topLevel: true, x: 0, y: 0 },
                      f: { opcode: 'control_forever', next: null, parent: 'h', inputs: { SUBSTACK: [2, 's'] }, fields: {}, shadow: false, topLevel: false },
                      s: { opcode: 'stc12_setpin', next: null, parent: 'f', inputs: {}, fields: { PIN: ['P1.0', null], STATE: ['on', null] }, shadow: false, topLevel: false },
                    },
                    comments: {}, currentCostume: 0,
                    costumes: [{ name: 'b', bitmapResolution: 1, dataFormat: 'svg', assetId: 'cd21514d0531fdffb22204e0ec5ed84a', md5ext: 'cd21514d0531fdffb22204e0ec5ed84a.svg', rotationCenterX: 240, rotationCenterY: 180 }],
                    sounds: [], volume: 100, layerOrder: 0, tempo: 60, videoTransparency: 50, videoState: 'on', textToSpeechLanguage: null
                  }],
                  monitors: [], extensions: ['stc12'],
                  meta: { semver: '3.0.0', vm: '0.2.0' }
                };
                const zip = new JSZip();
                zip.file('project.json', JSON.stringify(project));
                zip.file('cd21514d0531fdffb22204e0ec5ed84a.svg', '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"360\"></svg>');
                await vm.loadProject(await zip.generateAsync({ type: 'arraybuffer' }));
                const ops = {};
                for (const t of vm.runtime.targets) {
                  for (const b of Object.values(t.blocks._blocks)) ops[b.opcode] = (ops[b.opcode] || 0) + 1;
                }
                return { opcodes: ops, stc12Loaded: vm.extensionManager.isExtensionLoaded('stc12') };
              });

              if (extResult.error) {
                console.error('FAIL: extension guard could not find VM:', extResult.error);
                process.exit(1);
              }
              const hasForever = !!extResult.opcodes['control_forever'];
              const hasSetpin = !!extResult.opcodes['stc12_setpin'];
              if (!hasForever) {
                console.error('FAIL: control_forever missing — loadProject dropped everything');
                process.exit(1);
              }
              if (!hasSetpin) {
                console.error('FAIL: stc12_setpin missing — extension blocks dropped during deserialization (the e155ca1 regression)');
                process.exit(1);
              }
              console.log('OK: extension guard — control_forever + stc12_setpin both present after loadProject');

              if (errors.length) console.log('Page errors (non-fatal):', errors);
              await browser.close();
              process.exit(0);
            })();
          "
