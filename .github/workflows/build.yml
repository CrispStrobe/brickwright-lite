name: Build (permissive base)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    # A LEDGER ROW IS NOT A BUILD, and until now every one started a full
    # vendor -> install -> build -> Playwright run.
    #
    # Measured on 2026-08-25: main took 12 pushes between 12:00 and 13:20 and
    # got ZERO verdicts. `concurrency: pages-<ref>` keeps one run per ref, so
    # each new push superseded the pending one and the older run came back
    # `cancelled` — which reads like somebody chose to stop it. Nine of those
    # twelve pushes changed nothing but LANES.md. The queue behind them also
    # starved `vendor-freshness`, whose runs sat queued and never started.
    #
    # WHY THIS IS A LIST AND NOT `**.md`. sb3-creator's ci.yml can use the
    # blanket glob; lite cannot, and copying it here would silently switch off
    # gates that can genuinely go red:
    #
    #   overlay/scratch-gui/examples/**/intro.md   SHIPPED CONTENT. webpack
    #     copies `examples` wholesale into build/, and ExamplesBrowser.jsx
    #     fetches `examples/<dir>/intro.md` at runtime.
    #   overlay/scratch-gui/examples/**/EXPECTED.md   TEST INPUT. The lesson
    #     claim gates read these; wave7 asserts on ttl-clock-module's text.
    #   THIRD-PARTY-NOTICES.md   TEST INPUT, and a licence one. Three tests
    #     readFileSync it and assert a dependency is named in it.
    #   docs/generated/**, docs/schematic-baselines/**   TEST INPUT, read through
    #     CONSTRUCTED paths no name census can see. Safe only because the
    #     one-level `!docs/*.md` below never reaches a subdirectory — that depth
    #     is load-bearing, and the test refuses a constructed TOP-LEVEL path.
    #
    # This is a `paths` filter (everything, minus what nothing reads) rather
    # than `paths-ignore`, because `paths-ignore` cannot say "except". The
    # root prose is negated by name; `docs/*.md` is negated as a whole and then
    # every doc some NON-COMMENT line of test/, scripts/, .github/ or overlay/
    # mentions is put back — mention, not read, so the rule errs toward
    # building. bw-ci measured the gap on 2026-09-05: 41 of 47 docs read by
    # nothing, each edit to one a full build slot on a day nine of twenty main
    # builds were cancelled. The re-include list below is NOT hand-maintained:
    # test/build-trigger-paths.test.mjs (scripts/lib/doc-triggers.mjs) computes
    # the mentioned set from the tree and fails by name when a mentioned doc is
    # missing here or a listed one is mentioned nowhere. Census 2026-09-06:
    # 48 docs, 17 mentioned, 31 skip.
    #
    # A skipped run means no Pages deploy for that push. That is correct: the
    # app is byte-identical, and deploy-daily republishes regardless.
    paths:
      - '**'
      - '!BLOCKED.md'
      - '!BUILD.md'
      - '!CLAUDE.md'
      - '!HANDOFF.md'
      - '!LANES.md'
      - '!MBIT-BUILD.md'
      - '!PLAN.md'
      - '!README.md'
      - '!ROADMAP.md'
      - '!docs/*.md'
      - 'docs/CYCLE-ACCURATE-CORE-EVALUATION.md'
      - 'docs/DEBUGGER-NEXT-ROADMAP.md'
      - 'docs/EXTENSION-SECURITY.md'
      - 'docs/FETCH-PINNING.md'
      - 'docs/FULL-DEBUGGER-ARCHITECTURE.md'
      - 'docs/LANGUAGE-DEVICE-MATRIX-PLAN.md'
      - 'docs/LESSON-ACHIEVABILITY-SWEEP.md'
      - 'docs/LESSON-REVIEW-WAVE-2.md'
      - 'docs/LESSON-REVIEW-WAVE-3.md'
      - 'docs/LESSON-REVIEW-WAVE-4.md'
      - 'docs/LESSON-REVIEW-WAVE-5.md'
      - 'docs/LESSON-REVIEW-WAVE-6.md'
      - 'docs/LESSON-REVIEW-WAVE-7.md'
      - 'docs/VENDOR-DIVERGENCE-BW-CIRCUIT-UI.md'
      - 'docs/VENDOR-DIVERGENCE-I8086-MACHINE.md'
      - 'docs/WAVE-OPEN-DEFECTS.md'
      - 'docs/app-store-metadata.md'
permissions:
  contents: read
  pages: write
  id-token: write
# ROADMAP §2.1, and the reason this is keyed on the COMMIT rather than the ref.
#
# `pages-<ref>` is one group for all of main, and GitHub holds exactly ONE
# pending entry per group: a third push cancels the second while it is still
# queued. Measured over the 200 most recent main runs (2026-08-24 .. 2026-08-30):
# 101 success, 26 failure, **72 cancelled** — and 62 of those 72 had ZERO JOBS.
# No runner, no verdict, no minutes, and a conclusion that reads as if somebody
# chose to stop it. Serializing PUBLICATION is required. Serializing VALIDATION
# never was, and it is what threw away 62 verdicts in six days.
#
# Keyed on the sha, no two pushes share a group, so nothing is cancelled while
# queued. The deploy job below carries the one shared group that is left, plus a
# guard that refuses to publish a tree older than the published one — because
# ordering by queue release is not ordering by commit, which is what "the site
# lags several commits, arriving out of order" was.
#
# PROVEN IN A SCRATCH REPO FIRST, per this item's own instruction, because the
# previous attempt took the live site down: CrispStrobe/bw-pages-concurrency-proof.
# Baseline burst of 5 pushes -> 2 verdicts, 3 runs with zero jobs. Candidate
# burst of 5 -> 5 build verdicts, 0 starved. See RESULTS.md there for run ids.
concurrency:
  group: pages-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  # A newer commit makes an older PR build obsolete, so PRs still collapse to
  # the latest push. Main gets one group per commit and is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Require green upstream evidence for the pinned 8086 engine
        run: npm run verify:bwboard-ci
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      # Same static asset Vercel deploys, so the browser gate below runs against the
      # shape users get rather than one where the heavy tier is silently missing.
      # Non-fatal on purpose: if the release fetch fails, the engine is simply not
      # offered — lib/labwired-engine.js already answers null instead of throwing,
      # and the gate covers that degraded path too.
      - name: Fetch the heavy simulation engine (labwired-wasm)
        run: node scripts/sync-labwired-wasm.mjs || echo "labwired-wasm unavailable — the heavy tier will not be offered"
      - name: Install
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      # Everything from here to `Serve the built app` is an INDEPENDENT check —
      # guards, unit tests, the lazy-bundle inspection, the debugger smoke test.
      # None of them produces an input the next one needs, so none of them should
      # silence the next one. They hang off this id, the last step of the actual
      # prerequisite chain (vendor -> integrate -> install -> overlays).
      - name: Apply the scratch-paint overlay (extended costume designer)
        run: node scripts/apply-paint-overlay.mjs
      # One patch: text costumes wait for the lazy render-fonts chunk (ROADMAP §2.4).
      - name: Apply the scratch-render overlay (lazy render fonts)
        id: overlays
        run: node scripts/apply-render-overlay.mjs

      # --- guards: catch silent reverts before the build runs ---
      #
      # Falsified 2026-08-09 on branch guard-falsification (deleted):
      #   1. stc12 truncated to 4 opcodes → CAUGHT (run 31312830786)
      #      "Bundled stc12 has only 4 opcodes (need ≥10)"
      #   2. PIN=2f896b1a with matching binary → CAUGHT (run 31312945118)
      #      "WASM PIN is not a descendant of the crash-fix floor (85ed23d)"
      #      Proved the floor check, not a single-hash blacklist.
      #   3. blocks.jsx null-guard removed → CAUGHT (run 31313002380)
      #      "blocks.jsx is missing the toolbox null-guard"
      #      Exact replay of the 0ba092b revert that caused the live outage.
      #   4. HOC throw (unknown GUI crash) → CAUGHT (run 31331264070)
      #      "FAIL: GUI did not render" — all 3 static guards passed, only the
      #      headless browser check caught it. Proved it catches unknown causes,
      #      not just the three named regressions. Branch: guard4-falsification.

      - name: Guard — bundled stc12 has all emitted opcodes
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          FILE=overlay/scratch-vm/src/extensions/crispstrobe/stc12/index.js
          COUNT=$(grep -c 'opcode:' "$FILE")
          echo "stc12 opcodes: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Bundled stc12 has only $COUNT opcodes (need ≥10). Was it rebuilt from the gallery?"
            exit 1
          fi

      - name: Guard — WASM pin is a descendant of the crash-fix floor
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The floor: 85ed23d94a1fbf8a15c2ddff068d438a832913cc is the commit
          # with the emu_init crash fix and corrected BUILD-INFO.md. Any pin
          # older than this ships a crashing binary. Bump the floor when a
          # newer build is deliberately adopted.
          #
          # Full 40-hex, like the PIN it is compared against: an abbreviation is
          # unique only within one repo at one moment, and `--is-ancestor` given
          # an ambiguous or unknown rev fails in a way this step reads as "not a
          # descendant" — a true-looking error about the wrong thing.
          FLOOR=85ed23d94a1fbf8a15c2ddff068d438a832913cc
          PIN=$(node -e "
            const src = require('fs').readFileSync('scripts/sync-emu8051-wasm.mjs','utf8');
            const m = src.match(/const PIN = '([^']+)'/);
            console.log(m ? m[1] : '');
          ")
          echo "PIN=$PIN  FLOOR=$FLOOR"
          if [ -z "$PIN" ]; then
            echo "::error::Could not extract PIN from sync-emu8051-wasm.mjs"
            exit 1
          fi
          # Clone just enough of emu8051-stc to check ancestry
          git clone --bare --filter=blob:none https://github.com/CrispStrobe/emu8051-stc.git /tmp/emu8051-stc.git 2>/dev/null
          if ! git -C /tmp/emu8051-stc.git merge-base --is-ancestor "$FLOOR" "$PIN" 2>/dev/null; then
            echo "::error::WASM PIN ($PIN) is not a descendant of the crash-fix floor ($FLOOR). Re-pin to $FLOOR or later."
            exit 1
          fi
          echo "PIN is at or after the floor — good"
          node scripts/sync-emu8051-wasm.mjs --check

      - name: Guard — blocks.jsx has the toolbox null-guard
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The crash: blocks.jsx passes this.props.toolboxXML to ScratchBlocks.inject().
          # toolboxXML is null at startup (deferred because scratch-blocks is lazy-loaded).
          # Without the null-guard, inject() gets null and the GUI doesn't mount.
          FILE=overlay/scratch-gui/src/containers/blocks.jsx
          if ! grep -q 'this.props.toolboxXML || makeToolboxXML' "$FILE"; then
            echo "::error::blocks.jsx is missing the toolbox null-guard (this.props.toolboxXML || makeToolboxXML). GUI will not render."
            exit 1
          fi
          echo "blocks.jsx: toolbox null-guard present (good)"

      - name: Guard — the vendored overlay matches the commit it PINS
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # WHAT THIS COMPARES, AND WHAT IT USED TO.
          #
          # It used to fetch the raw CDN at `<repo>/master/<file>` with a
          # `main` fallback and compare the overlay against THAT. Three things
          # were wrong with one line:
          #
          #   1. It named a MUTABLE ref. Upstream advancing made this warn, so
          #      the warning meant "someone pushed", not "lite is broken" — and
          #      a warning that fires for a non-problem is one nobody reads.
          #   2. It read the RAW CDN, which caches branch URLs for minutes. A
          #      run right after a push compares against the previous commit and
          #      says "up to date" about a tree it did not see. That exact
          #      mechanism vendored a stale bw-board on 2026-08-23.
          #   3. `master || main` guessed the branch name, and a wrong guess
          #      curls a 404 into `$upstream`, which this reads as "not
          #      accessible (private repo?)" — a confident, well-formed, wrong
          #      statement about why nothing was compared.
          #
          # The right comparand is what lite CLAIMS: vendor-pins.json. Fetched
          # sha-addressed, so the CDN cannot lie about it, and a difference now
          # means the overlay does not match its own pin — an integrity failure
          # rather than news about upstream. Freshness-vs-HEAD is a separate
          # question and it has its own workflow (vendor-freshness.yml, nightly).
          #
          # Still a warning, not a failure: vendor-freshness.yml is the blocking
          # gate, and two red gates for one fact is how a real one gets muted.
          mismatch=0
          for pair in \
            "bw-circuit-ui:CrispStrobe/bw-circuit-ui:src/index.js:overlay/scratch-gui/src/lib/bw-circuit-ui/index.js" \
            "bw-board:CrispStrobe/bw-board:src/index.js:overlay/scratch-gui/src/lib/bw-board/index.js"; do
            IFS=: read -r name repo remote local <<< "$pair"
            if [ ! -f "$local" ]; then continue; fi
            pin=$(jq -r --arg r "$name" '.[$r] // empty' vendor-pins.json)
            case "$pin" in
              [0-9a-f]*) [ ${#pin} -eq 40 ] || { echo "::error::vendor-pins.json pins $name to '$pin', which is not a 40-hex sha"; exit 1; } ;;
              *) echo "::warning::$name has no pin in vendor-pins.json — nothing to compare against"; continue ;;
            esac
            upstream=$(curl -sf "https://raw.githubusercontent.com/$repo/$pin/$remote" || echo "")
            if [ -z "$upstream" ]; then
              # A sha-addressed 404 is NOT ambiguous the way the branch-name
              # version was: the commit is unreachable, so say that.
              echo "::warning::$name: $repo@$pin/$remote is not fetchable (private repo, or the pin names a commit that is gone)"
              continue
            fi
            local_hash=$(sha256sum "$local" | cut -d' ' -f1)
            # `echo` not `printf '%s'`: command substitution stripped the
              # trailing newline curl delivered, and the file on disk has one.
              remote_hash=$(echo "$upstream" | sha256sum | cut -d' ' -f1)
            if [ "$local_hash" != "$remote_hash" ]; then
              echo "::warning::$name overlay does NOT match its own pin $pin — re-run the sync, or correct vendor-pins.json"
              mismatch=$((mismatch+1))
            else
              echo "$name: overlay matches pin $pin"
            fi
          done
          echo "overlay-vs-pin mismatches: $mismatch"

      # --- tests ---

      # Milestone 0: the shipped example corpus must be proven to EXECUTE, and
      # the gate that proves it must be present and must still be able to fail.
      # `npm test` below runs both gates through its glob; this step exists so a
      # deleted gate, or a ratchet quietly padded until nothing is red any more,
      # is a build failure and not an absence nobody notices. Both failure modes
      # have happened in this repo: five gates were found that could not fail,
      # and a dead-module exclusion list grew from five entries to sixteen while
      # staying green.
      #
      # Mutation-proven 2026-08-23 (docs/EXAMPLE-CORPUS-FINDINGS.md, seven
      # mutations): breaking a shipped example, deleting an opcode from a
      # bundled extension, padding a ratchet, and removing the corpus each make
      # the gate red.
      - name: Guard — the example execution gates exist and their ratchets have not grown
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          for gate in test/example-vm-execution.test.mjs test/example-execution.test.mjs; do
            if [ ! -f "$gate" ]; then
              echo "::error::$gate is missing — the shipped example corpus would be unproven"
              exit 1
            fi
          done
          # A waiver list may only shrink. Lower these as examples are fixed,
          # never raise them. All four example waivers are now ZERO, so these
          # ceilings are zero: any reappearance is a regression, not a budget to
          # spend. KNOWN_INERT 4 -> 0 and KNOWN_MISSING_OPCODES -> 0 when the
          # eleven devices_oled*/devices_tft* opcodes were defined (37 -> 48
          # blocks); KNOWN_SHADOWED_WRITES 19 -> 0 and KNOWN_NO_BLOCKS 2 -> 0 with
          # the sb3-creator pin bump to 1a83dfa. TIME_GATED is NOT a waiver list
          # -- its entries still carry a static assertion -- but it is capped too,
          # so it cannot quietly become one.
          node -e "
            const fs = require('fs');
            // Strip line comments before counting. The counter looks for quoted
            // strings, and a stray apostrophe in prose reads as a quoted span —
            // it reported an entry in a list with none. A guard that miscounts is
            // worse than no guard, so it does not get to read prose.
            const gate = fs.readFileSync('test/example-vm-execution.test.mjs', 'utf8')
              .split('\n').map(l => l.replace(/^\s*\/\/.*$/, '')).join('\n');
            // A Set entry is 'id'; a Map entry is ['id', 'reason'] and would
            // otherwise count double. Count the id, whichever shape it is in.
            const count = (name) => {
              const at = gate.indexOf(name);
              if (at < 0) { console.error('::error::' + name + ' is gone from the gate'); process.exit(1); }
              const isMap = /new Map\(/.test(gate.slice(at, at + 40));
              const body = gate.slice(gate.indexOf('[', at), gate.indexOf(isMap ? '])' : ']', at));
              return (body.match(isMap ? /\['[^']+'/g : /'[^']+'/g) || []).length;
            };
            const ceilings = {KNOWN_INERT: 0, KNOWN_SHADOWED_WRITES: 0, KNOWN_NO_BLOCKS: 0, TIME_GATED: 2};
            let bad = 0;
            for (const [name, ceiling] of Object.entries(ceilings)) {
              const n = count(name);
              console.log(name + ': ' + n + ' waived (ceiling ' + ceiling + ')');
              if (n > ceiling) {
                console.error('::error::' + name + ' grew to ' + n + ' entries (ceiling ' + ceiling +
                  '). A waiver list may only shrink.');
                bad++;
              }
            }
            const undefinedOpcodes = (gate.slice(gate.indexOf('KNOWN_MISSING_OPCODES'),
              gate.indexOf('KNOWN_INERT')).match(/'[a-z0-9]+_[a-z0-9_]+'/g) || []).length;
            console.log('KNOWN_MISSING_OPCODES: ' + undefinedOpcodes + ' opcodes waived (ceiling 0)');
            if (undefinedOpcodes > 0) {
              console.error('::error::KNOWN_MISSING_OPCODES grew to ' + undefinedOpcodes + ' opcodes.');
              bad++;
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Guard — the fetch-pinning gate exists and can still fail
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          # `npm test` below runs test/fetch-pinning.test.mjs through its glob.
          # This step exists for the two failure modes a green suite cannot
          # distinguish from a passing gate: the gate DELETED, and the gate
          # unable to go red. Both have happened in this repo — five gates were
          # found that could not fail, and one of them walked a tree containing
          # its own prover, so every string-literal target matched itself.
          #
          # The prover mutates tracked files and reverts each in a finally
          # block; it exits 2 if the tree does not come back green, so a failed
          # revert cannot be mistaken for a passing run.
          if [ ! -f test/fetch-pinning.test.mjs ]; then
            echo "::error::test/fetch-pinning.test.mjs is missing — every fetch in this repo would be unchecked"
            exit 1
          fi
          # No `git diff` here. By this point `npm install`, vendor and integrate
          # have modified thousands of tracked files, so a dirty tree says
          # nothing about the prover — and the first version of this step
          # reported "the pinning prover left the tree dirty" after the prover
          # had just printed 11/11 caught (run 32762117022). A well-formed,
          # confident statement about the wrong thing, in the step meant to
          # catch exactly that. The prover checks its own restoration at BYTE
          # level against what each file held before it touched it, which is
          # the question, and exits 2 if a revert failed.
          node scripts/prove-fetch-pinning.mjs

      # Three checks that read example JSON off disk — no browser, no server,
      # no built app. They were sitting unrun with the browser gates purely
      # because of their filename, and they cost about a second each.
      - name: Content gates — faceplates, hub faces, retro console
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          node scripts/verify-faceplate-blinkenrocket.mjs
          node scripts/verify-lego-hub-faces.mjs
          node scripts/verify-retro-console.mjs

      - name: Run unit tests
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          if ! grep -q '"test"' package.json; then
            echo "::error::package.json has no test script — tests exist but nothing runs them"
            exit 1
          fi
          set -o pipefail
          # Everything except the two corpus walks (every lesson bench solved,
          # twice over): those are ~14 CPU-minutes and were this step's whole
          # duration. They run in the `corpus` job below, in parallel with this
          # one, and the deploy needs both. `npm test` locally is still all of it.
          mkdir -p test-results
          # The runner's OWN exit status is captured and returned at the end, so
          # the two readings below print on red runs too — the days they matter
          # most — instead of the shell's -e ending the step at the pipeline.
          set +e
          npm run test:fast 2>&1 | tee /tmp/unit.tap
          rc=${PIPESTATUS[0]}
          set -e
          # The GUI-scope resolve hook (scripts/lib/gui-scope-hooks.mjs) is the
          # boundary between root tests and GUI dependencies, and it must stay a
          # MEASURED list: every bare specifier it re-resolved from
          # packages/scratch-gui, by count, so growth is seen rather than hidden.
          echo "bare specifiers re-resolved from packages/scratch-gui by the unit tests:"
          if [ -s test-results/fast.gui-scope.tsv ]; then cut -f1 test-results/fast.gui-scope.tsv | sort | uniq -c | sort -rn; else echo "  (none)"; fi
          # Measured, then DECLARED: every specifier and every test above must be in
          # scripts/lib/gui-scope-allowed.json, or this fails by name. The boundary
          # grows only by review.
          node scripts/check-gui-scope.mjs --log test-results/fast.gui-scope.tsv
          # Did the run report on what it was handed? Every file
          # scripts/list-tests.mjs puts in this set must appear in the per-file
          # census with at least one test, and any `not ok` must be counted by
          # the summary (header of the script). On a red run this still names a
          # file that vanished or failed to construct, beside the real failure.
          node scripts/check-test-run.mjs --set fast --tap /tmp/unit.tap --census test-results/fast.census.json
          # A SUITE THAT CANNOT BE CONSTRUCTED CURRENTLY READS AS A SUITE THAT
          # PASSED, and that is not a hypothesis — it happened in run
          # 32779945069 on this branch. `test/wait-census.test.mjs` calls a
          # script that could not resolve its import, so the `describe` body
          # threw while the suite was being built. The runner printed
          #
          #     not ok 662 - the wait census: fixed sleeps are counted…
          #     # tests 1014   # pass 1013   # fail 0
          #
          # and the step went GREEN on the runner's node (22.23.2). The same
          # minimal repro exits 1 on node 20.20.2, so the exit-code half is
          # version-dependent; the miscount is not — `# fail 0` alongside a
          # `not ok` appears on both.
          #
          # A construction failure is the WORST kind to lose: the gate did not
          # run at all, so it cannot have found anything, and a green line says
          # it did. This repo has found five gates that could not fail; this one
          # could not even be built. Read the stream, not the summary.
          if grep -qE '^not ok ' /tmp/unit.tap; then
            echo "::error::TAP reports failures the summary did not count — a suite probably threw while being CONSTRUCTED (a missing import, a fixture that cannot be built). Those are not counted in \`# fail\` and may not affect the exit code."
            grep -E '^not ok ' /tmp/unit.tap | head -20
            exit 1
          fi
          exit "$rc"

      # A green suite says every assertion PASSED. It does not say any of them could have
      # failed. These mutations weaken a real enforcement point and require the named suite to
      # go red — the proofs existed before this step, by hand, in commit messages, which means
      # they decayed silently the moment anyone edited a guard. Seven seconds.
      #
      # It restores every file in a `finally`, and a mutation whose anchor no longer occurs
      # exactly once is a FAILURE rather than a skip: a rotted mutation proves nothing while
      # continuing to look like a proof.
      - name: Mutation proofs — every enforcement layer must be able to fail
        run: node scripts/mutation-proof.mjs

      # --- build ---

      - name: Guard — packaged native broker proof authority is fresh
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/package-native-broker-proof-pins.mjs --check

      - name: Guard — packaged native broker host and worker assets are fresh
        run: node scripts/package-native-broker-assets.mjs --check

      - name: Build the editor
        id: build_editor
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build

      # The heavy tier is 20 MB and MUST stay out of the first load. That is a
      # question about a real build, so it cannot be a unit test — `npm test`
      # above runs before the build and would skip on every CI run. Two
      # one-character edits (a lost `webpackChunkName`, a dynamic import turned
      # static) put the loader in the entry bundle with nothing else noticing:
      # the app still works, every suite still passes, the engine still runs.
      # Deliberately NOT gated on the artifact fetch above — this inspects
      # bundle contents, which exist whether or not the release download did.
      - name: Guard — the labwired engine stays lazily loaded
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/verify-labwired-lazy-bundle.mjs

      # Same question for everything the 2026-09-05 campaign moved OUT of the
      # first load — music samples, render fonts, LEGO hub drivers, the asset
      # library manifests, the lesson waves — and for the text-encoding polyfill
      # that was aliased away. Each is one edit from quietly coming back, and the
      # app works identically either way, so only a look at the built bytes can
      # tell. Header of scripts/verify-boot-payload.mjs has the measurements.
      - name: Guard — the first load stays lean
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/verify-boot-payload.mjs

      # The debugger smoke compares lite's own emitter against an INDEPENDENT
      # disassembler, which lives in another repo. Fetching it is what turns
      # this step from a permanent skip into a verdict — see below.
      - name: Fetch stc-compiler (the debugger smoke's disassembly oracle)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/stc-compiler
          path: .stc-compiler

      - name: Smoke-test the debugger
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        env:
          STC_COMPILER: ${{ github.workspace }}/.stc-compiler
        run: |
          if ! grep -q '"smoke:debugger"' package.json; then
            echo "::error::package.json has no smoke:debugger script — the debugger is untested"
            exit 1
          fi
          # Exit 2 means "a prerequisite is missing", and it USED to be
          # downgraded to a warning here. Because the runner had no compiler,
          # that downgrade ran on every build for months: the step was green,
          # the debugger was never exercised, and three real defects sat behind
          # it (D-SMOKE1, then D-EMU-BP2 and D-EMU-BP3 once it could run).
          #
          # CI now supplies everything the script needs. The 8051 toolchain is
          # in-tree WASM and runs under Node, native sdcc is NOT required
          # (measured: the script exits 0 with sdcc absent from PATH), and the
          # disassembly oracle is checked out above. So exit 2 no longer means
          # "a tool this runner cannot provide" — it means the workflow is
          # broken, and it fails.
          # No `||` branch on purpose: this step no longer swallows anything,
          # and the script's own stderr names any missing prerequisite.
          npm run smoke:debugger
      # `!cancelled()` because the built app is the primary DIAGNOSTIC, and the
      # runs you most want to inspect are the ones that failed. Without it this
      # step carries an implicit success() and is skipped after any red gate, so
      # a failing run uploads proof artifacts for the gates that passed and NOT
      # the app they were driving. Measured on PR #105: two gates failed, no
      # github-pages artifact, and the only way to reproduce locally was to fix
      # the tree and run CI again — a full queue cycle to learn what one download
      # would have shown. Deploying is unaffected: the `deploy` job needs `build`
      # to have succeeded, so an artifact from a red run can be downloaded and
      # never published.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        with: { path: packages/scratch-gui/build }

  # THE MISMATCHED-TREE HAZARD, and why parallel builds are safe here when a
  # previous attempt at this fix took the site down.
  #
  # That attempt was a per-JOB split. Artifact names are unique within a RUN, not
  # across runs: two jobs of one run writing `github-pages`, or a deploy job
  # resolving that name while a sibling was still uploading, publishes an
  # index.html from one tree beside chunks from another — which is exactly what
  # went out (index.html naming 404 chunks). Separate RUNS cannot do this to each
  # other; each run's artifact is scoped to its own GITHUB_RUN_ID and
  # `deploy-pages` resolves it there.
  #
  # So the invariant is structural, and `test/pages-deploy-ordering.test.mjs`
  # asserts it rather than leaving it as a comment: BUILD AND UPLOAD STAY IN ONE
  # JOB, and this job takes the artifact from its own run and never fetches one
  # by name. Making the build groups per-commit does not touch that.
  # The two lesson-corpus walks — lesson-numeric-contract and
  # lesson-defect-detector — solve every bench in the catalog and were 278 s of
  # the build job's critical path, ahead of the build and 30 browser gates that
  # cannot start until they finish. Nothing downstream needs their output, so
  # they run here, alongside. Their inputs are overlay/, scripts/ and test/ —
  # they import from the overlay tree directly and need neither the vendored
  # packages nor node_modules (checked 2026-09-05 by running them from a copy
  # with only those three directories). A red here blocks the deploy exactly as
  # it did when it was a step of `build`.
  #
  # Same TAP reading as the unit-test step, for the same reason: a suite that
  # threw while being constructed prints `not ok` and a summary that does not
  # count it.


  # SPLIT 2026-09-05: the browser gates are their own job.
  #
  # The build job was killed by its own `timeout-minutes: 30`, which GitHub
  # reports as CANCELLED rather than failure -- five sessions spent a day
  # hunting an external canceller because of that word. Unsplit: 17.1 min over
  # 97 steps, browser phase 11.5 (67%). Split and measured: build 5m18s,
  # browser 13m23s, parallel, neither cancelled.
  #
  # THIS JOB'S `timeout-minutes: 30` BOUNDS THE 41 GATE STEPS, and lego-b9's
  # per-step timeouts bound each one beneath it. The browser half is the one
  # that grows, so its headroom is the number to watch.
  #
  # BOUNDARIES ARE CONTENT ANCHORS, and the rebuild ASSERTS them -- including
  # that this block's `steps:` is the only one. Two earlier attempts produced
  # a file that parsed and was wrong: line numbers read from a stale revision
  # severed an `upload-artifact` step, and a slice that began one line early
  # gave the job TWO `steps:` keys, which PyYAML silently accepts and Actions
  # rejects with a run that has no jobs at all.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions REPLACE the workflow's for this job, so the two it
    # needs are both named: contents to check out, actions so the last step can
    # read this run's own steps (scripts/audit-job-steps.mjs). Scoped here rather
    # than workflow-wide so the wider token reaches only the job that audits;
    # read-only either way — the step never cancels, reruns or writes.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Require green upstream evidence for the pinned 8086 engine
        run: npm run verify:bwboard-ci
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      # Same static asset Vercel deploys, so the browser gate below runs against the
      # shape users get rather than one where the heavy tier is silently missing.
      # Non-fatal on purpose: if the release fetch fails, the engine is simply not
      # offered — lib/labwired-engine.js already answers null instead of throwing,
      # and the gate covers that degraded path too.
      - name: Fetch the heavy simulation engine (labwired-wasm)
        run: node scripts/sync-labwired-wasm.mjs || echo "labwired-wasm unavailable — the heavy tier will not be offered"
      - name: Install
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      # Everything from here to `Serve the built app` is an INDEPENDENT check —
      # guards, unit tests, the lazy-bundle inspection, the debugger smoke test.
      # None of them produces an input the next one needs, so none of them should
      # silence the next one. They hang off this id, the last step of the actual
      # prerequisite chain (vendor -> integrate -> install -> overlays).
      - name: Apply the scratch-paint overlay (extended costume designer)
        run: node scripts/apply-paint-overlay.mjs
      # One patch: text costumes wait for the lazy render-fonts chunk (ROADMAP §2.4).
      - name: Apply the scratch-render overlay (lazy render fonts)
        id: overlays_browser
        run: node scripts/apply-render-overlay.mjs
      # The Pico simulator firmware (650 KB, sha256-pinned, never committed) is
      # fetched into static/ so webpack serves it. TOLERATED ABSENT by name: if
      # the fetch fails (network), the execute gate below SKIPS and the absent
      # gate still runs — the same contract labwired-wasm has.
      - name: Fetch the Pico MicroPython firmware for the sim gate (tolerated absent)
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        run: npm run sync:picomicropython || echo "pico firmware sync failed — the execute gate will skip; the absent gate still runs"
      - name: Build the editor
        id: build_editor_browser
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build

      # Browser acceptance BEFORE the artifact leaves this job. The
      # 930000d incident shipped a wall-to-wall visual regression on
      # green unit tests — unit suites cannot see a lost theme, a
      # broken pane, or a dead button. These gates drive the ACTUAL
      # BUILT APP and block the deploy when it is visibly wrong.
      - name: Install Playwright browser
        id: playwright
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        # Gate-only tool (the gates drive the built app), NOT an app dependency.
        # Installation is bounded and retried below, but failure remains a real
        # deployment failure: silently skipping every browser gate would turn
        # required acceptance evidence into a soft gate.
        # The verify scripts import the playwright package from the repo
        # root; install it ephemerally (--no-save) plus its chromium.
        run: |
          # Playwright's chromium download can hang on a flaky mirror; with no
          # timeout a stalled download froze the whole deploy for ~90 min. Bound
          # each attempt and retry so it fails fast and recovers.
          npm install --no-save playwright
          ok=0
          for i in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright chromium install attempt $i failed/timed out; retrying"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::playwright chromium install failed after 3 attempts"; exit 1; }
      # Keyed on `playwright` rather than `serve` because this gate needs no
      # server: it drives the packaged broker document from local files. It still
      # carries `!cancelled()` for the same reason every gate below does.
      # EVERY BROWSER STEP CARRIES ITS OWN timeout-minutes (test/browser-gate-timeouts.test.mjs
      # refuses one without). Reason, measured 2026-09-05: the build job's
      # `timeout-minutes: 30` was the day's "unexplained canceller" — GitHub reports
      # a timed-out JOB as `cancelled`, so four of five cancelled main builds were
      # really one hanging browser gate (the since-reverted SVG-sanitizer gate ran
      # twenty minutes) pushing a 17–19 minute job past thirty, and nothing named
      # the step. A per-step budget turns the next hang into a red step WITH A
      # NAME, at most eight minutes in, well inside the job ceiling. Budgets are
      # ~3× each step's maximum over the last five main runs, floor 3, cap 8:
      # labwired tier 165 s, 8051 listings 124 s, 8086 bench 123 s → 8; the
      # 14–50 s tier → 4; everything under 10 s → 3. Raise one only with a new
      # measurement in the commit message; never to make a hang pass.
      - name: Browser gate — native broker packaged assets
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: node scripts/verify-native-broker-assets.mjs
      # Every browser gate below hangs off THIS step's outcome, not
      # playwright's, and each carries `!cancelled()` so a red gate no longer
      # SKIPS its successors. GitHub folds an implicit `success()` into any
      # `if:` naming no status function, so the old `steps.playwright.outcome ==
      # 'success'` meant "playwright installed AND nothing has failed yet" —
      # measured on 2026-09-02: one red gate (step 41 of 61) skipped 17 later
      # gate steps covering 23 distinct verify scripts, on all 17 pushes of a
      # 23-hour streak, while the run said only "build failed".
      #
      # Keyed on `serve` rather than `playwright` ON PURPOSE. `serve` is itself
      # skipped when playwright fails, so this still covers that case — and it
      # additionally stops 30 gates from being fired at a dead HTTP server, each
      # burning its own navigation timeout, if the server never came up.
      # Requires the BUILD, not only playwright: with `!cancelled()` above, a
      # failed build would otherwise hand 31 browser gates an empty directory and
      # turn one red step into 31, each burning its own navigation timeout.
      - name: Serve the built app
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' && steps.build_editor_browser.outcome == 'success' }}
        id: serve
        run: |
          python3 -m http.server 8617 --directory packages/scratch-gui/build &
          for i in $(seq 1 30); do curl -sf http://localhost:8617/ >/dev/null && break; sleep 1; done

      # Keep the debugger acceptance checks at the front of the browser queue.
      # They reuse this job's one build, server and Chromium installation, but
      # now report before the unrelated product journeys rather than after
      # dozens of serial gates.
      - name: Browser gate — the debugger-only pane and its round trip
        timeout-minutes: 4  # measured max 14 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-debugger-solo.mjs

      - name: Browser gate — debugger recording, reverse and fork history
        timeout-minutes: 4  # measured max 35 s over 5 main runs, 2026-09-05
        id: debug_history
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ npm run verify:debug-history

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.debug_history.outcome != 'skipped'
        with:
          name: debugger-history-browser-proof
          path: artifacts/debug-history-browser/*
          if-no-files-found: error

      - name: Browser gate — debugger run-to and synchronized inspection
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        id: debug_inspection
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ npm run verify:debug-inspection

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.debug_inspection.outcome != 'skipped'
        with:
          name: debugger-inspection-browser-proof
          path: artifacts/debug-run-to-inspection/*
          if-no-files-found: error

      # ROADMAP §2.2. Deliberately NOT pointed at PROOF_URL: this gate serves its
      # own four-line origin so it can do what the built app cannot be made to do
      # on demand — delete a chunk mid-session, hang a socket, seed a poisoned
      # cache. It tests overlay/scratch-gui/sw.js verbatim, and it mutation-proves
      # itself on every run, so a scenario that stops biting says so here rather
      # than passing quietly for years the way the white-screen path did.
      - name: Browser gate — service worker failure modes
        timeout-minutes: 4  # measured max 25 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-service-worker.mjs
      - name: Browser gate — circuit UX
        timeout-minutes: 4  # measured max 21 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-circuit-ux.mjs
      # ROADMAP §2.4: the render fonts are fetched by the first SVG with text,
      # not at first paint. Both halves are asserted — no fetch on a fresh load,
      # and a text costume rasterised WITH its @font-face once one appears.
      - name: Browser gate — render fonts arrive with the first text costume, not before
        timeout-minutes: 3  # measured max 4 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-text-costume-fonts.mjs
      - name: Browser gate — circuit rendering and placement
        timeout-minutes: 3  # measured max 6 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-circuit-rendering.mjs

      # Physical product proof for the 74C922 gallery bench. This deliberately
      # clicks three real keypad faces and reads both the production solver and
      # the rendered LEDs: a dead X/Y wire, swapped code bit, stale example, or
      # non-interactive face can all pass the model's isolated unit tests.
      - name: Browser gate — physical 74C922 keypad encoder
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-74c922-keypad.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: 74c922-keypad-browser-proof
          path: artifacts/74c922-keypad/
          if-no-files-found: warn

      # The DRC's rule 8 (aggregate current) reads its ratings off the injected
      # engine and falls back to `getMaxCurrent: () => null` when the host did
      # not supply them — silently, because a conservative default is a
      # legitimate answer and nothing logs. circuit-tab's setEngine call omitted
      # `getMaxCurrent` and `PORT_LIMITS`, so the DEPLOYED rule 8 could not sum
      # chip current at all: every part was an honest unknown and every verdict
      # a hedged lower bound, while every isolated test — each of which injects
      # the pair — stayed green. Measured on production 2026-08-30, before the
      # fix, by running exactly this script against it: the two discriminating
      # checks failed and the other four passed.
      #
      # Only a browser can say the BUNDLE ships the injection, and the gate is
      # careful about WHICH warning it reads: bw-board's own checkCurrentBudget
      # surfaces a generic "Up to N mA at maximum ratings" ceiling through the
      # board's render state either way, so the gate keys on rule 8's own
      # sentence ("Total circuit current is …") — the warning that names the
      # largest consumers and offers a fix.
      - name: Browser gate — the DRC can sum chip current
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-drc-current.mjs

      # Same reasoning as the labwired and debugger shots below: a screenshot
      # that only ever exists inside a runner is a screenshot nobody can look
      # at, and "the deployed DRC sums current" is a claim someone will want to
      # check by eye rather than by trusting a green tick.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: drc-current-screenshots
          path: artifacts/drc-current-*.png
          if-no-files-found: warn
      - name: Browser gate — view buttons
        timeout-minutes: 4  # measured max 16 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-view-buttons.mjs
      - name: Browser gate — editor
        timeout-minutes: 4  # measured max 19 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-editor.mjs
      - name: Browser gate — unpinned extension sandbox
        timeout-minutes: 3  # measured max 1 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-extension-sandbox.mjs
      - name: Browser gate — game gallery and hardware examples
        timeout-minutes: 3  # measured max 4 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-example-selector.mjs
      - name: Browser gate — both BASIC profiles execute on real machines
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-basic-run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: basic-run-proof
          path: artifacts/basic-run/*
          if-no-files-found: error

      # The Node suite proves the same core can run these programs, but it
      # cannot prove the production bundle exposes the 8086 picker, loads the
      # local assembler chunk, paints CGA, accepts a key, or refreshes the 8255
      # faces. One browser and two unchanged examples cover that whole seam.
      - name: Browser gate — 8086 local assembly, CGA, keyboard and 8255
        timeout-minutes: 3  # measured max 5 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-i8086-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: i8086-production-browser-proof
          path: artifacts/i8086-browser/*
          if-no-files-found: error

      - name: Browser benchmark — 8086 desktop and mobile
        timeout-minutes: 8  # measured max 123 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          # React's ordinary production renderer removes Profiler timings.
          # Build a separate minified profiling artifact so the deployable
          # build keeps the zero-profiler-overhead renderer used by everyone.
          # npm run build starts by cleaning build/, so shelter the production
          # artifact that the remaining browser gates and deploy job consume.
          profile_server=
          cleanup_profile_build() {
            ci_status=$?
            if [ -n "$profile_server" ]; then
              kill "$profile_server" 2>/dev/null || true
            fi
            rm -rf packages/scratch-gui/build
            if ! mv packages/scratch-gui/build-production-ci packages/scratch-gui/build; then
              ci_status=1
            fi
            trap - EXIT
            exit "$ci_status"
          }
          mv packages/scratch-gui/build packages/scratch-gui/build-production-ci
          trap cleanup_profile_build EXIT
          mkdir -p artifacts/i8086-performance
          (
            cd packages/scratch-gui
            # P6 ownership evidence is emitted only by this already-separate
            # profiling build. The deployable production build above remains
            # byte-for-byte on its ordinary webpack invocation.
            rm -rf build-profile
            npm run clean
            BW_REACT_PROFILE=1 NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 \
              ./node_modules/.bin/webpack --profile --stats verbose \
                --json ../../artifacts/i8086-performance/webpack-stats.json
          )
          I8086_ENFORCE_WEBPACK_BOUNDARY=1 node scripts/report-webpack-ownership.mjs
          python3 -m http.server 8618 --directory packages/scratch-gui/build-profile &
          profile_server=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8618/ >/dev/null && break; sleep 1; done
          I8086_PERF_REPETITIONS=3 \
            I8086_WEBPACK_STATS=artifacts/i8086-performance/webpack-stats.json \
            PROOF_URL=http://localhost:8618/ node scripts/bench-i8086-browser.mjs
          gzip -9 artifacts/i8086-performance/webpack-stats.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: i8086-browser-performance
          path: artifacts/i8086-performance/**
          if-no-files-found: error

      - name: Browser gate — declared extension capability broker
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          mkdir -p artifacts/capability-broker
          PROOF_URL=http://localhost:8617/ \
            SUCCESS_SCREENSHOT=artifacts/capability-broker/success.png \
            FAILURE_JSON=artifacts/capability-broker/failure.json \
            node scripts/verify-capability-broker.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: capability-broker-proof
          path: artifacts/capability-broker/*
          if-no-files-found: error
      - name: Browser gate — first-run chooser and guided journeys
        timeout-minutes: 3  # measured max 8 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-starter-journeys.mjs
      - name: Browser gate — LEGO SPIKE archive and Code-tab round trip
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-lego-spike-roundtrip.mjs
      - name: Browser gate — four-surface project save, reopen and vanilla replacement
        timeout-minutes: 3  # measured max 6 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-project-bundle-integrity.mjs
      # The costume half of the same question. The gate above proves the four
      # Brickwright surfaces round-trip; nothing proved the ARTWORK did, and the
      # paint editor is the one payload a learner edits in a separate editor
      # with its own asset pipeline (paper.js for vector, a canvas re-encode for
      # bitmap). Compares content hashed from asset.data, not declared ids.
      - name: Browser gate — costume artwork survives save/reload and records first-open performance
        timeout-minutes: 3  # measured max 5 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-costume-roundtrip.mjs
      # The unit suite asserts the table SVG and the mark state as pure values.
      # It cannot see whether the RENDERER accepts that SVG: a skin that fails
      # to parse, or a drawable in a layer group the renderer lacks, throws
      # inside the extension's own try/catch and the table never appears, with
      # every asserted value still correct. Keyed on rasterised skin geometry
      # rather than pixels, because headless keeps the stage canvas at a 0x0
      # backing store and a working stage screenshots identically to a broken one.
      - name: Browser gate — the renderer accepts the table the arrays blocks describe
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-arrays-table-display.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: arrays-table-display-proof
          path: artifacts/arrays-table-display/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: costume-roundtrip-proof
          path: artifacts/costume-roundtrip/*
      # Before the boot-payload split a built-in extension COULD NOT fail to
      # load; its code was in the bundle. Now it is a chunk fetch, so it can
      # fail on an offline reload or a cache miss against a redeployed hash.
      # deserializeProject awaits those loads, so without a per-extension catch
      # one missing chunk would reject the whole Promise.all and NO project
      # would open. That degradation is the only new user-visible behaviour in
      # the split, and CI cannot observe it by accident because CI always has
      # the chunk -- so this gate removes it on purpose, and asserts the abort
      # actually fired rather than trusting a route pattern to keep matching.
      - name: Browser gate — a missing extension chunk costs its blocks, not the project
        timeout-minutes: 3  # measured max 4 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-lazy-extension-degradation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: lazy-degradation-proof
          path: artifacts/lazy-extension-degradation/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: project-bundle-integrity-proof
          path: artifacts/project-bundle-integrity/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: lego-spike-roundtrip-proof
          path: artifacts/lego-spike-roundtrip/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: starter-journey-screenshots
          path: artifacts/starter-journeys/*.png
          if-no-files-found: warn
      - name: Browser gates — About, intro, interaction, and schematic rendering
        timeout-minutes: 4  # measured max 18 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          PROOF_URL=http://localhost:8617/ node scripts/verify-about-dialog.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-intro.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-interaction.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-schematic.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: rehabilitated-browser-gate-artifacts
          path: |
            artifacts/verify-*-failure.png
            artifacts/verify-*-page-errors.txt
            artifacts/schematic-production/*.png
          if-no-files-found: warn
      - name: Browser gates — Code chrome, Controller, faceplates, and Instruments
        timeout-minutes: 4  # measured max 19 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          PROOF_URL=http://localhost:8617/ node scripts/verify-chrome-sweep.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-controller-panel.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-faceplate-matrix.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-instruments-scroll.mjs
          PROOF_URL=http://localhost:8617/ node scripts/verify-circuit-export-completeness.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: chrome-controller-faceplate-instruments-artifacts
          path: |
            artifacts/chrome-sweep/*
            artifacts/controller-panel/*
            artifacts/faceplate-matrix/*
            artifacts/verify-instruments-scroll-*
          if-no-files-found: warn
      - name: Browser gate — Aurora-65 keyboard, OLED and VGA workstation
        timeout-minutes: 3  # measured max 8 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-aurora65-workstation.mjs
      # The debugger dock has now regressed to a blank pane twice, and the
      # serial console was output-only for as long as it existed. Both are
      # invisible to every unit suite: one is a chunk that was never
      # requested, the other a machine that could not be answered.
      - name: Browser gate — debugger dock and serial input
        timeout-minutes: 4  # measured max 28 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-debug-dock.mjs
      # The language x device matrix: the badge beside the device picker and
      # the "What runs where" panel both read lib/bw-matrix/capabilities.js,
      # the table docs/generated/LANGUAGE-DEVICE-MATRIX.md is generated from.
      # Unit tests hold the table to source; this holds the GUI to the table.
      - name: Browser gate — language x device matrix badge and panel
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-matrix-ui.mjs

      # The heavy simulation tier. Everything else about it — the adapter, the
      # debug target, the chunk contents — was green while selecting it in a
      # browser threw twice in a row: a shadowed `session` binding, then a
      # missing timeNs delegation. Neither was reachable from a unit test,
      # because both live in the wiring between the runner and the target.
      #
      # This gate insists the PROGRAM COUNTER MOVES, not merely that the panel
      # says ready. It skips (exit 0) when the engine artifact is absent or the
      # remote compiler is unreachable, since neither is a regression in this
      # repo — but the engine IS fetched above, so in CI it runs for real.
      # Traffic, not bundle location — the two are different claims and only one
      # was gated. verify-labwired-lazy-bundle asserts the loader stays out of
      # the entry bundle (true throughout); this asserts the app does not FETCH
      # the 20 MB engine before anyone asks. It did, on every first load.
      - name: Browser gate — the heavy engine is not downloaded on first load
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-first-load-weight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: first-load-weight
          path: artifacts/first-load-weight/*
          if-no-files-found: warn
      - name: Browser gate — the labwired heavy tier actually executes
        timeout-minutes: 8  # measured max 165 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-labwired-engine.mjs

      # The OTHER branch of the same honesty rule, and the one production
      # actually ships when the release fetch above fails: the engine is absent,
      # so the picker must not offer it and the failed probe must stay a caught
      # answer rather than an uncaught rejection. Same build, artifact withheld
      # by the gate's own server — proving it against a second, artifact-less
      # build would leave open whether the two builds differed elsewhere.
      - name: Browser gate — with no engine artifact, the tier is not offered
        timeout-minutes: 4  # measured max 47 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-labwired-engine.mjs --absent

      # Both gates above screenshot what they saw, and a screenshot that only
      # ever exists inside a runner is a screenshot nobody can look at. Keeping
      # them makes "prove the heavy tier runs" answerable by anyone, from any
      # run, without a local production build — which on a shared box is a
      # 2.4 GiB memory race that is not always winnable.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: labwired-tier-screenshots
          path: artifacts/labwired-*.png
          if-no-files-found: warn

      # This is the browser half of the offline 8051 compiler acceptance. It is
      # deliberately after the labwired journeys so the two WASM-heavy proofs
      # do not overlap. The gate aborts a hosted compiler POST before it leaves
      # Chromium, then proves the local image can attach, cycle-step, expose
      # source-linked scheduler state, and halt on a real write watchpoint.
      - name: Browser gate — offline 8051 compile and debugger evidence
        timeout-minutes: 3  # measured max 5 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-debug-frames-watch.mjs

      # Listing mode shares the compiler but not the consumer path above. This
      # proof changes the source, exports two distinct linked .rst listings,
      # and aborts hosted compiler POSTs before they leave Chromium.
      - name: Browser gate — offline linked 8051 assembly listings
        timeout-minutes: 8  # measured max 124 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-local-asm-listing.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: offline-8051-debug-proof
          path: artifacts/debug-proof/*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: offline-8051-listing-proof
          path: artifacts/local-asm-listing/*
          if-no-files-found: error

      # D2's OTHER half, and the families the gate above cannot cover: avr-gcc
      # and arm-none-eabi-gcc will not run in a browser, so those lesson benches
      # ship their image instead. This gate cuts EVERY cross-origin request (not
      # only the compiler POST), starts debug-task-scheduling's own ATmega328P
      # bench on its prebuilt image, checks the panel says so in the learner's
      # terms, and then proves the safety half: one edited number makes the image
      # stop matching, the build goes for the hosted compiler, and the run fails
      # honestly instead of stepping through firmware nobody compiled.
      - name: Browser gate — an AVR lesson bench starts offline on its shipped image
        timeout-minutes: 4  # measured max 35 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-offline-lesson-image.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: offline-lesson-image-proof
          path: artifacts/offline-lesson-image/*
          if-no-files-found: error

      # Run this short, independently green extension proof after the two heavy
      # labwired journeys, keeping the earlier product sweep's peak memory flat.
      - name: Browser gate — promoted pinned extension worker
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          mkdir -p artifacts/pinned-worker
          PROOF_URL=http://localhost:8617/ \
            SUCCESS_SCREENSHOT=artifacts/pinned-worker/success.png \
            FAILURE_JSON=artifacts/pinned-worker/failure.json \
            node scripts/verify-pinned-worker.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.playwright.outcome == 'success'
        with:
          name: pinned-worker-proof
          path: artifacts/pinned-worker/*
          if-no-files-found: error

      # The navigator.bluetooth shim the LEGO extensions depend on inside the
      # app. It is under active investigation on iOS right now, which is the
      # worst possible time for it to regress unnoticed — and it was one of the
      # four gates that still passed while nothing ran it.
      - name: Browser gate — the native Web Bluetooth shim
        timeout-minutes: 3  # measured max 2 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-bluetooth.mjs

      # The MakeCode importer lives behind a dynamic import(), so a webpack
      # misconfiguration would show up in a browser and in no unit test —
      # and the routing from the Open button is JSX that nothing else runs.
      - name: Browser gate — MakeCode import
        timeout-minutes: 3  # measured max 3 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-makecode.mjs

      # Both of these were on the KNOWN_UNWIRED list as FAILING, and both
      # failed for one reason: the starter-journeys backdrop swallowed every
      # click, so each spent its whole timeout retrying the first one. That
      # is what a gate nothing runs decays into — the app grew a first-visit
      # overlay and the gates that CI does run were taught to dismiss it.
      # The MicroPython tab and the simulator are the far end of the MakeCode
      # importer, so they belong next to the gate above.
      - name: Browser gate — micro:bit MicroPython tab and simulator
        timeout-minutes: 4  # measured max 18 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-microbit.mjs

      # Pico ▶ Run in the simulator (N3c): boot MicroPython in rp2040js, run the
      # program live over createPicoRepl, and insist the emulated GPIO lit the
      # LED — judged by the run board's ledBrightness, not the viewport. Skips
      # by name if the firmware fetch above did not land.
      - name: Browser gate — Pico MicroPython simulator Run lights the LED (N3c)
        timeout-minutes: 6  # 180 s GPIO poll (headless boot is far slower than node) + ~60 s setup + margin
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ npm run verify:pico-micropython
      # The other half: with the firmware WITHHELD (its own server 404s it), the
      # Run must refuse BY NAME — a Run button with nothing behind it is the
      # failure this proves against. No PROOF_URL: withholding needs its own
      # server, so it gates on the build, not the shared serve.
      - name: Browser gate — Pico ▶ Run refuses by name with no firmware (N3c)
        timeout-minutes: 3  # its own server (port 8123); boot attempt + refuse
        if: ${{ !cancelled() && steps.build_editor_browser.outcome == 'success' }}
        run: npm run verify:pico-micropython-absent

      - name: Browser gate — micro:bit debugger, block and line stepping
        timeout-minutes: 4  # measured max 18 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-microbit-debug-toggle.mjs
      # The Arduboy console is the only thing in the app that RUNS a
      # compiled binary rather than translating source, so "the unit tests
      # pass" says nothing about whether a game reaches the screen. This
      # reads pixels back off the canvas, and checks they keep changing —
      # one frame and a freeze is exactly what a stalled boot looks like.
      - name: Browser gate — Arduboy console runs a compiled game
        timeout-minutes: 3  # measured max 4 s over 5 main runs, 2026-09-05
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-arduboy.mjs
      # MEASURE the browser waits, on a runner instead of a developer box.
      #
      # docs/WAIT-CENSUS.md: lite has 119 `timeout: N` bounding literals and not
      # one carries a recorded measurement, because probing each needs a built
      # editor and a browser. A bound's evidence is just the observed duration
      # under it, and this job has already built the editor and installed the
      # browser — so one extra pass over the same five gates, with every wait
      # timed, gives all of them a number.
      #
      # A RUNNER IS THE RIGHT BOX TO MEASURE ON, and that is the point of doing
      # it here rather than locally: these thresholds exist to protect CI, so
      # the p90 that matters is CI's. A developer box shared with several agents
      # produces a number about the box (measured: 6.1 load per CPU against this
      # repo's own allowed 1.5, which is why check-system-load refuses to build
      # there at all).
      #
      # workflow_dispatch ONLY. It re-runs five browser gates, so it costs a few
      # minutes, and nothing about a normal push needs it.
      #
      # `|| true`: this step must not turn a build red. The same five gates have
      # ALREADY run and passed above as real gates — this pass is instrumentation
      # over ground already covered, and a wait that TIMES OUT here is the single
      # most informative observation the sweep can make. Swallowing the exit code
      # keeps that observation instead of discarding the run that produced it.
      - name: Measure — time every browser wait (manual runs only)
        id: waits
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.serve.outcome == 'success' }}
        run: |
          for g in verify-circuit-ux verify-circuit-rendering verify-view-buttons \
                   verify-editor verify-debug-dock; do
            echo "--- $g"
            OBSERVE_OUT="$PWD/wait-observations.jsonl" PROOF_URL=http://localhost:8617/ \
              node --import ./scripts/observe-timeouts.mjs "scripts/$g.mjs" || true
          done
          # The aggregator refuses a file with no `installed` marker or no
          # bounded waits, so a hook that silently failed to attach fails HERE
          # rather than being reported as a sweep that observed nothing.
          node scripts/aggregate-timeouts.mjs --observed wait-observations.jsonl | tee wait-report.txt
          node scripts/aggregate-timeouts.mjs --observed wait-observations.jsonl --json > wait-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.waits.outcome != 'skipped'
        with:
          name: wait-observations
          path: |
            wait-observations.jsonl
            wait-report.txt
            wait-report.json
          if-no-files-found: warn

      # A GREEN JOB MUST NOT HIDE A SKIPPED GATE. Twice on 2026-09-05 a job
      # reported success while a browser gate inside it was `skipped` — once an
      # `if:` naming a status function silenced the 17 steps after it, once a
      # merge moved steps into a job whose conditions no longer held — and every
      # such green was read as "the gate passed". This is the reviewer's per-step
      # audit, done by the job itself: it asks the API for this run's steps and
      # fails, naming them, if any browser gate was skipped while no earlier step
      # failed. After a real failure it only notes the skipped ones. It MUST stay
      # the last step of the job that holds the gates — test/browser-gate-timeouts
      # .test.mjs asserts that, with `if: always()` — and needs the job's actions: read.
      - name: Audit — every browser gate ran
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit-job-steps.mjs

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Run the lesson corpus walks
        run: |
          set -o pipefail
          mkdir -p test-results
          # As in the unit step: capture the runner's status so the readings
          # below print on red runs, then return it.
          set +e
          npm run test:corpus 2>&1 | tee /tmp/corpus.tap
          rc=${PIPESTATUS[0]}
          set -e
          # No node_modules in this job, so the GUI-scope hook can redirect nothing here by design; the line proves it.
          echo "bare specifiers re-resolved from packages/scratch-gui by the corpus walks:"
          if [ -s test-results/corpus.gui-scope.tsv ]; then cut -f1 test-results/corpus.gui-scope.tsv | sort | uniq -c | sort -rn; else echo "  (none)"; fi
          node scripts/check-gui-scope.mjs --log test-results/corpus.gui-scope.tsv
          node scripts/check-test-run.mjs --set corpus --tap /tmp/corpus.tap --census test-results/corpus.census.json
          if grep -qE '^not ok ' /tmp/corpus.tap; then
            echo "::error::TAP reports failures the summary did not count — a suite probably threw while being CONSTRUCTED."
            grep -E '^not ok ' /tmp/corpus.tap | head -20
            exit 1
          fi
          exit "$rc"

  deploy:
    needs: [build, corpus, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read       # the compare API, for the ordering guard
      deployments: read    # the github-pages deployment history
      pages: write
      id-token: write
    # The one shared group left. Publication is serialized; validation is not.
    # A deploy that is superseded while pending is cancelled here, which marks
    # its RUN cancelled even though its build job succeeded — that is the
    # intended outcome (an older tree must not publish) and it is distinguishable
    # from starvation: starvation has zero jobs, this has `build: success`.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.order.outputs.stale != 'true' }}
    steps:
      # Evaluated INSIDE the job, so it runs after the queue lets this deploy
      # through — by which time a newer commit may already have published.
      # Asking before queuing would answer the wrong question.
      - name: Refuse to publish a tree older than the published one
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # OUR OWN SHA IS FILTERED OUT, and that filter is the whole trap.
          # Declaring `environment: github-pages` makes GitHub create this
          # environment's deployment record when the JOB STARTS, before any step
          # runs — so a guard that reads the newest deployment reads ITSELF,
          # concludes it is current, and publishes. Measured in the scratch repo
          # on 2026-08-30 (run 33295873557 attempt 2): the guard printed
          # `published=654edac ours=654edac` and moved the live site BACKWARDS
          # from ae89f11 to 654edac — the exact failure it was written to
          # prevent, with a green check on it. Ours can appear more than once
          # (a re-run), so every occurrence goes.
          #
          # `gh api --jq` takes one argument and no `--arg`; piping to jq is not
          # a style choice ("accepts 1 arg(s), received 4").
          published=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=30" \
            | jq -r --arg ours "$GITHUB_SHA" '[.[] | select(.sha != $ours)] | .[0].sha // empty')
          echo "published=$published  ours=$GITHUB_SHA"
          if [ -z "$published" ] || [ "$published" = "$GITHUB_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # `ahead` means the published commit is ahead of OURS: it is newer, and
          # publishing would move the site backwards. `behind`, `identical` and
          # `diverged` all deploy — for diverged there is no ordering to respect,
          # and refusing would freeze the site after any history rewrite.
          status=$(gh api "repos/${{ github.repository }}/compare/${GITHUB_SHA}...${published}" --jq '.status')
          echo "compare ours...published = $status"
          if [ "$status" = "ahead" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping deploy: $published is published and is newer than $GITHUB_SHA"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.order.outputs.stale != 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-gui:
    needs: deploy
    # Only when THIS run published. A deploy that stood down for a newer commit
    # would otherwise send this job to smoke-test somebody else's tree and
    # report the verdict against ours — a green that means nothing, or worse, a
    # red attributed to the wrong commit.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # Smoke-test the deployed site in a headless browser. Catches GUI-breaking
    # regressions that pass all static guards — the unknown-cause class.
    steps:
      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium --with-deps
      - name: Verify GUI renders on deployed site
        run: |
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const url = 'https://crispstrobe.github.io/brickwright-lite/';
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 1400, height: 800 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              // A 404 on a script raises no pageerror — it is a failed REQUEST.
              // The 2026-08-26 failure printed 'GUI did not render' and nothing
              // else, because the only symptom was invisible here.
              const httpFails = [];
              page.on('response', r => { if (r.status() >= 400) httpFails.push(r.status() + ' ' + r.url()); });
              page.on('requestfailed', r => httpFails.push('requestfailed ' + r.url()));

              // GitHub Pages serves the new index.html before its CDN has the new
              // content-hashed bundles. The page then requests a 404 and never
              // renders — indistinguishable, until now, from a genuinely broken
              // build. Wait for the assets index.html names to be servable, and
              // this becomes a wait instead of a coin flip.
              const assetDeadline = Date.now() + 300000;
              for (;;) {
                const bust = '?cb=' + Date.now();
                const html = await (await page.request.get(url + bust)).text();
                const refs = [...html.matchAll(/(?:src|href)=\"([^\"]+\.(?:js|css))\"/g)].map(m => m[1]);
                const codes = [];
                for (const r of refs) {
                  const abs = /^https?:/.test(r) ? r : url + r.replace(/^\//, '');
                  codes.push((await page.request.get(abs + bust)).status());
                }
                const report = refs.map((r, i) => r + '=' + codes[i]).join(', ');
                if (refs.length && codes.every(c => c === 200)) { console.log('assets servable: ' + report); break; }
                if (Date.now() > assetDeadline) {
                  console.error('FAIL: GitHub Pages never served the assets index.html names: ' + (report || '(none parsed)'));
                  process.exit(1);
                }
                console.log('waiting for Pages to publish the new assets: ' + (report || '(none parsed)'));
                await new Promise(done => setTimeout(done, 10000));
              }

              console.log('Loading ' + url + ' ...');
              await page.goto(url, {
                waitUntil: 'networkidle', timeout: 60000
              });

              try {
                await page.waitForSelector('[class*=\"menu-bar\"], [class*=\"gui_\"], [role=\"tab\"]', { timeout: 60000 });
              } catch {
                console.error('FAIL: GUI did not render');
                if (httpFails.length) console.error('HTTP failures:', httpFails);
                if (errors.length) console.error('Page errors:', errors);
                process.exit(1);
              }

              const tabs = await page.locator('[role=tab]').allInnerTexts();
              console.log('Tabs:', tabs.join(', '));

              if (tabs.length === 0) {
                console.error('FAIL: No tabs rendered — GUI is broken');
                if (errors.length) console.error('Page errors:', errors);
                process.exit(1);
              }

              console.log('OK: GUI renders with', tabs.length, 'tabs');

              // --- Extension-block regression guard (e155ca1) ---
              // Node cannot reproduce this bug: the browser and node disagree about
              // whether sb3.js drops blocks with unknown extension prefixes. This
              // headless browser check is the only harness that distinguishes 5/7 from 7/7.
              await page.addScriptTag({ url: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' });
              const extResult = await page.evaluate(async () => {
                const guiEl = document.querySelector('[class*=\"gui_body\"]') || document.querySelector('[class*=\"gui\"]');
                const key = Object.keys(guiEl).find(k => k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance'));
                let fiber = guiEl[key], vm = null;
                for (let i = 0; i < 30 && fiber; i++) {
                  if (fiber.memoizedProps && fiber.memoizedProps.vm) { vm = fiber.memoizedProps.vm; break; }
                  fiber = fiber.return;
                }
                if (!vm) return { error: 'vm not found' };
                const project = {
                  targets: [{ isStage: true, name: 'Stage', variables: {}, lists: {}, broadcasts: {},
                    blocks: {
                      h: { opcode: 'event_whenflagclicked', next: 'f', parent: null, inputs: {}, fields: {}, shadow: false, topLevel: true, x: 0, y: 0 },
                      f: { opcode: 'control_forever', next: null, parent: 'h', inputs: { SUBSTACK: [2, 's'] }, fields: {}, shadow: false, topLevel: false },
                      s: { opcode: 'stc12_setpin', next: null, parent: 'f', inputs: {}, fields: { PIN: ['P1.0', null], STATE: ['on', null] }, shadow: false, topLevel: false },
                    },
                    comments: {}, currentCostume: 0,
                    costumes: [{ name: 'b', bitmapResolution: 1, dataFormat: 'svg', assetId: 'cd21514d0531fdffb22204e0ec5ed84a', md5ext: 'cd21514d0531fdffb22204e0ec5ed84a.svg', rotationCenterX: 240, rotationCenterY: 180 }],
                    sounds: [], volume: 100, layerOrder: 0, tempo: 60, videoTransparency: 50, videoState: 'on', textToSpeechLanguage: null
                  }],
                  monitors: [], extensions: ['stc12'],
                  meta: { semver: '3.0.0', vm: '0.2.0' }
                };
                const zip = new JSZip();
                zip.file('project.json', JSON.stringify(project));
                zip.file('cd21514d0531fdffb22204e0ec5ed84a.svg', '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"360\"></svg>');
                await vm.loadProject(await zip.generateAsync({ type: 'arraybuffer' }));
                const ops = {};
                for (const t of vm.runtime.targets) {
                  for (const b of Object.values(t.blocks._blocks)) ops[b.opcode] = (ops[b.opcode] || 0) + 1;
                }
                return { opcodes: ops, stc12Loaded: vm.extensionManager.isExtensionLoaded('stc12') };
              });

              if (extResult.error) {
                console.error('FAIL: extension guard could not find VM:', extResult.error);
                process.exit(1);
              }
              const hasForever = !!extResult.opcodes['control_forever'];
              const hasSetpin = !!extResult.opcodes['stc12_setpin'];
              if (!hasForever) {
                console.error('FAIL: control_forever missing — loadProject dropped everything');
                process.exit(1);
              }
              if (!hasSetpin) {
                console.error('FAIL: stc12_setpin missing — extension blocks dropped during deserialization (the e155ca1 regression)');
                process.exit(1);
              }
              console.log('OK: extension guard — control_forever + stc12_setpin both present after loadProject');

              if (errors.length) console.log('Page errors (non-fatal):', errors);
              await browser.close();
              process.exit(0);
            })();
          "
