name: Vercel production deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
      timezone: Europe/Berlin

# A manual run and the nightly run must never race to assign the production
# domains. Keep the earlier deployment running and queue the later request.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy current BrickWright Lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_dispatch allows choosing a ref in the UI. Production does
          # not: both trigger types always publish the canonical current main.
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not configured}"

      - name: Install the pinned Vercel CLI
        run: npm install --global vercel@50.1.3 --no-audit --no-fund

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the current checkout
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy and assign production domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
