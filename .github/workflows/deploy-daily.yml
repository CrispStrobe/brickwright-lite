name: Vercel production deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build (permissive base)", "debugger-focused", "vendor-freshness"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
      timezone: Europe/Berlin

# Automatic, manual and nightly runs must never race to assign the production
# domains. Keep the earlier deployment running and queue the later request.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  eligible:
    name: Check automatic deployment eligibility
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # The commit whose validation just completed. Judging main's tip instead
          # made every event ineligible whenever main had moved on, which on a
          # busy day is always: production sat 356 commits behind on 2026-10-28.
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-vercel-main-checks.mjs "$VALIDATED_SHA" --eligibility >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy current BrickWright Lite
    needs: eligible
    # Earlier completed supporting checks are eligibility decisions, not failed
    # publications. The last successful validation event schedules the deploy.
    if: >-
      !cancelled() && (github.event_name != 'workflow_run' || needs.eligible.outputs.ready == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_dispatch allows choosing a ref in the UI. Production does
          # not: every trigger publishes from main's own history.
          ref: main
          # Enough first-parent history to find the newest validated main commit.
          fetch-depth: 200

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not configured}"

      - name: Install the pinned Vercel CLI
        run: npm install --global vercel@50.1.3 --no-audit --no-fund

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Publish the newest main commit whose complete validation succeeded.
      #
      # Until 2026-10-28 this published only the current tip, and only if the tip
      # itself was fully validated and did not move during the build. With main
      # Builds queuing for hours, the tip never qualified: every event was
      # skipped or refused and production sat 356 commits (two days) behind
      # while GitHub Pages stayed current.
      #
      # The non-negotiable guard is unchanged in substance: an older tree must
      # never overwrite a newer one. It is now checked against what production
      # actually serves: the live commit must be an ancestor of the target.
      # Green still means published. A run that finds nothing newer to publish
      # says so as a notice; a run that cannot validate any recent main commit
      # fails.
      - name: Build and publish the newest validated main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_sha=$(curl -fsS --max-time 15 "https://brickwright-lite.vercel.app/brickwright-version.json?probe=$GITHUB_RUN_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s).commit||"";if(!/^[a-f0-9]{40}$/.test(c))process.exit(1);console.log(c)})')
          git fetch --quiet --depth=200 origin main
          target_sha=""
          for candidate in $(git rev-list --first-parent --max-count=60 FETCH_HEAD); do
            if [ "$candidate" = "$live_sha" ]; then break; fi
            if node scripts/verify-vercel-main-checks.mjs "$candidate" > /dev/null 2>&1; then target_sha=$candidate; break; fi
          done
          if [ -z "$target_sha" ]; then
            if git merge-base --is-ancestor "$live_sha" FETCH_HEAD 2>/dev/null && \
               git rev-list --first-parent --max-count=60 FETCH_HEAD | grep -qx "$live_sha"; then
              echo "::notice::production already serves $live_sha, the newest validated main commit; nothing newer to publish"
              exit 0
            fi
            echo "::error::no validated main commit found within the last 60 first-parent commits, so nothing was published."
            exit 1
          fi
          # Monotonic: what production serves must be an ancestor of what we publish.
          git merge-base --is-ancestor "$live_sha" "$target_sha"
          git checkout --quiet --force "$target_sha"
          local_sha=$(git rev-parse HEAD)
          node scripts/verify-vercel-main-checks.mjs "$local_sha"
          echo "::group::building validated main $local_sha (production serves $live_sha)"
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "::endgroup::"
          # Re-read production right before publishing: the concurrency group
          # serialises our own runs, but a manual publish could still land.
          now_live=$(curl -fsS --max-time 15 "https://brickwright-lite.vercel.app/brickwright-version.json?probe=$GITHUB_RUN_ID-2" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit||""))')
          if git merge-base --is-ancestor "$now_live" "$local_sha" && [ "$now_live" != "$local_sha" ]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            node scripts/verify-vercel-live-version.mjs "$local_sha"
            echo "::notice::published validated main $local_sha to the production domains"
            exit 0
          fi
          echo "::error::production moved to $now_live during the build, which is not older than $local_sha; nothing was published."
          exit 1
