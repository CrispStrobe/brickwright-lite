# MANUAL ONLY since 2026-08-27. This used to run on a cron and push an empty
# "[deploy]" commit whenever the site was behind — which meant the public URL
# tracked whatever happened to be on main at 04:23, a state nobody chose.
#
# The owner ruling is now that the site tracks CHECKPOINTS: a version tag, or
# the `release:` commit carrying it (see scripts/vercel-ignore.sh). A timed
# refresh is by definition not a checkpoint, so the schedule is gone.
#
# It is kept as workflow_dispatch because a deliberate "publish current main"
# is occasionally the right call — running it by hand IS a checkpoint decision,
# which is the part that was missing. The deploy cap is real: six lanes on one
# repo exhausted it twice (2026-08-23, and 2026-08-27, when every push for
# hours returned "Deployment rate limited" and the site served a stale build).
name: deploy-daily
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Push a [deploy] refresh commit when the site is behind
        run: |
          last_deploy=$(git log --format=%H --grep='\[deploy\]' -1)
          if [ -z "$last_deploy" ]; then
            range="HEAD~1..HEAD"   # never deployed under this scheme: refresh once
          elif [ "$last_deploy" = "$(git rev-parse HEAD)" ]; then
            echo "head already carries [deploy] — nothing to do"; exit 0
          else
            range="$last_deploy..HEAD"
          fi
          if ! git diff --name-only "$range" | grep -qE '^(overlay/|packages/|scripts/|static/|vercel\.json|package\.json|package-lock\.json)'; then
            echo "no web-affecting changes since the last deploy — nothing to do"; exit 0
          fi
          # Author must be the Vercel-authorized identity (see CLAUDE.md).
          git -c user.name=CrispStrobe -c user.email=cze+github@mailbox.org \
            commit --allow-empty -m "site: [deploy] daily refresh"
          git push origin HEAD:main
