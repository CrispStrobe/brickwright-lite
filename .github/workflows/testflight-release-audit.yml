name: TestFlight admitted release audit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable application release tag, for example v0.1.27
        type: string
        required: true
      expected_commit:
        description: Exact 40-character application release commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: testflight-read-only-release-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: auditor
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/testflight-release-audit.mjs
            /scripts/lib/testflight-release-state.mjs
            /scripts/lib-appstore.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/tauri/src-tauri/tauri.conf.json
            /docs/app-store-metadata.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read back admitted iOS and macOS tester availability
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.expected_commit }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node auditor/scripts/testflight-release-audit.mjs --release-dir release --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" > release-audit.json
      - name: Retain categorical release readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-release-readback
          path: release-audit.json
          if-no-files-found: error
          retention-days: 7
