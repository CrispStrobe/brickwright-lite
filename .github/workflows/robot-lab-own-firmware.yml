name: Robot Lab own firmware qualification
on:
  pull_request:
    paths:
      - '.github/workflows/robot-lab-own-firmware.yml'
      - 'scripts/qualify-sim-lab-inputs.py'
      - 'scripts/verify-sim-lab-python-guest.mjs'
      - 'scripts/verify-sim-lab-renode-lockstep.mjs'
      - 'scripts/lib/sim-lab-renode-guest.mjs'
      - 'scripts/lib/sim-lab-dotnet-launcher.mjs'
      - 'overlay/scratch-gui/src/lib/bw-sim/routes/renode-lockstep/**'
      - 'test/bw-sim-renode-lockstep-python.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  own-firmware:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: .qualification/firmware
    steps:
      - name: Check out exact Lite head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out own firmware
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CrispStrobe/brickwright-spike-prime-fw
          ref: 91cf0c07784441ac114b85a1705737327db2d9f8
          path: .qualification/firmware
          persist-credentials: false
      - name: Check out reviewed lockstep Runtime and paired Infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CrispStrobe/renode-spike-prime
          ref: 0ff9e15d5fdd0ba755e4cb1773ebc3d3e79e3b3f
          path: .qualification/runtime
          submodules: recursive
          persist-credentials: false
      - name: Pin the existing reviewed support libraries
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: renode/renode-resources
          ref: 14b80cde0a136b684f316eb7f6a31aeaae0684bf
          path: .qualification/runtime/lib/resources
          persist-credentials: false
      - name: Initialize firmware gitlinks and admit exact graph
        run: |
          git submodule update --init nuttx nuttx-apps
          python3 "$GITHUB_WORKSPACE/scripts/qualify-sim-lab-inputs.py" \
            "$GITHUB_WORKSPACE" "$PWD" "$GITHUB_WORKSPACE/.qualification/runtime" \
            "$GITHUB_WORKSPACE/qualification/inputs.json"
      - name: Apply and test reviewed NuttX backports
        run: |
          python3 tools/apply_nuttx_backports.py
          python3 tools/test_upstream_hardening.py --nuttx nuttx
          python3 tools/test_upstream_arm_hardening.py --nuttx nuttx
          python3 tools/test_usb_wakeup.py --nuttx nuttx
          python3 tools/test_recursive_mutex_config.py --nuttx nuttx
          python3 tools/test_nuttx_romfs.py --nuttx nuttx
          python3 tools/check_nuttx_apps_hardening.py --apps nuttx-apps --baseline 55f0bc216565ccab8dee600a88f4485c7693bf8b

      - name: Build the pinned tool container
        run: docker build --pull -t nuttx-builder -f docker/Dockerfile.nuttx docker

      - name: Record container and tool versions
        run: |
          docker image inspect nuttx-builder --format 'container={{.Id}}'
          docker run --rm nuttx-builder arm-none-eabi-gcc --version
          docker run --rm nuttx-builder python3 --version
          docker run --rm nuttx-builder make --version

      # CI builds and runs only the two TI-free simulation profiles. The hardware
      # profile embeds TI's chip-restricted service pack and is never built,
      # simulated, or published here.
      - name: Build protected NuttX firmware (selected simulation profile)
        run: |
          set -o pipefail
          make nuttx BOARD_CONFIG=simulation V=1 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Record actual selected temporary-file libc member hashes
        run: python3 tools/report_tempfile_link_evidence.py nuttx/nuttx.map nuttx/nuttx_user.map

      - name: Record actual simulation probe object hash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          archive = pathlib.Path('nuttx/staging/libapps.a')
          members = subprocess.check_output(['ar', 't', str(archive)], text=True).splitlines()
          selected = [name for name in members if name.startswith('lumpprobe.c')]
          assert len(selected) == 1, 'Expected exactly one simulation probe object'
          data = subprocess.check_output(['ar', 'p', str(archive), selected[0]])
          assert data, 'Empty simulation probe object'
          print('LUMP probe object: bytes=%d sha256=%s' % (len(data), hashlib.sha256(data).hexdigest()))
          PY

      - name: Test saved programs through real LittleFS interrupted writes
        run: |
          python3 tools/test_littlefs_power_loss.py nuttx/fs/littlefs/littlefs
          python3 tools/test_imu_littlefs.py nuttx/fs/littlefs/littlefs

      - name: Prepare an explicit existing-filesystem simulation fixture
        run: |
          python3 tools/test_littlefs_fixture.py --littlefs nuttx/fs/littlefs/littlefs
          python3 tools/test_renode_load_littlefs_fixture.py --littlefs nuttx/fs/littlefs/littlefs
          python3 tools/make_littlefs_fixture.py \
            --littlefs nuttx/fs/littlefs/littlefs \
            --output .local/firmware-images/existing-filesystem

      # Qualification-only branch: the reference-to-fingerprint comparison is
      # performed offline on the retained pinned input. Keep its exact reviewed
      # fingerprint identity here, and retain the same image/build scans below.
      # No reference payload is fetched, imported, executed or published by CI.
      - name: Bind the offline-reviewed TI-free fingerprint and scan the images
        run: |
          python3 - <<'PY_FINGERPRINT'
          import hashlib
          from pathlib import Path
          raw = Path('policy/ti-service-pack-fingerprint.json').read_bytes()
          expected = '9bca70061b8c8e6ca6475fe7daa15285bf46990ed85ddf0cf1daaa40b8544099'
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('offline-reviewed TI fingerprint identity changed')
          print('Exact offline-reviewed fingerprint identity: PASS')
          PY_FINGERPRINT
          python3 tools/check_ti_free_image.py \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf

      - name: Gate the simulation image and build as TI-free
        run: |
          python3 tools/check_ti_free_image.py \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf \
            --build-log "$RUNNER_TEMP/build.log" \
            --build-root nuttx --build-root nuttx-apps --build-root apps \
            --config nuttx/.config --elf nuttx/nuttx_user.elf

      - name: Enforce protected resource budgets
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            python3 tools/check_resource_budgets.py

      - name: Verify addressed sensor capability in the actual userspace ELF
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" nuttx-builder \
            python3 tools/check_addressed_sensor_marker.py nuttx/nuttx_user.elf

      - name: Cross-compile Zephyr buffer boundary against pinned NuttX
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            tools/check_zephyr_nuttx_compile.sh

      - name: Cross-compile pinned PSA Bluetooth units
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            tools/check_zephyr_psa_compile.sh

      - name: Link complete host-side Bluetooth harness
        run: tools/check_zephyr_host_link.sh

      - name: Record local-only outputs
        run: |
          test -s nuttx/nuttx.bin
          test -s nuttx/nuttx_user.bin
          wc -c nuttx/nuttx.bin nuttx/nuttx_user.bin
          sha256sum nuttx/nuttx.bin nuttx/nuttx_user.bin

      - name: Set up reviewed headless SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build exact headless Runtime without moving library fetches
        working-directory: .qualification/runtime
        run: |
          # foreach expands these variables in each submodule.
          # shellcheck disable=SC2016
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1"'
          ./build.sh --net --no-gui --skip-fetch --external-lib-only
          ./build.sh --net --no-gui --skip-fetch
          test -s output/bin/Release/Renode.dll
          test -s output/bin/Release/Infrastructure.dll
          test -s src/Infrastructure/src/Emulator/Cores/bin/Release/lib/translate-arm-m-le.so
          ./renode --version
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install declared Lite guest dependencies
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendor
          node scripts/integrate.mjs
          cd packages/scratch-gui
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          cd ../..
          node scripts/apply-vm-overlay.mjs
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-arm-none-eabi
      - name: Stage source-built own firmware through the existing package producer
        working-directory: .
        run: |
          node --input-type=module -e "import {prepareDotnetLauncher} from './scripts/lib/sim-lab-dotnet-launcher.mjs'; await prepareDotnetLauncher('.qualification/runtime')"
          node scripts/prepare-spike-nuttx-package.mjs \
            .qualification/firmware .qualification/runtime \
            .qualification/runtime/src/Infrastructure .qualification/runtime/renode-qualified \
            .qualification/package --compiled-models
          python3 - <<'PY_HASH'
          import hashlib, json
          from pathlib import Path
          files = ['.qualification/runtime/renode-qualified', '.qualification/firmware/nuttx/nuttx', '.qualification/firmware/nuttx/nuttx_user.elf',
                   '.qualification/runtime/output/bin/Release/Renode.dll',
                   '.qualification/runtime/output/bin/Release/Infrastructure.dll',
                   '.qualification/runtime/src/Infrastructure/src/Emulator/Cores/bin/Release/lib/translate-arm-m-le.so']
          scenario = Path('.qualification/package/nuttx.resc').read_text()
          if 'models.cs' in scenario:
              raise SystemExit('compiled Runtime must not load dynamic models')
          files += ['.qualification/package/nuttx.resc', '.qualification/package/manifest.json',
                    '.qualification/package/platforms/boards/spike-prime.repl',
                    '.qualification/package/platforms/boards/spike-prime-brick-devices.repl',
                    '.qualification/package/platforms/cpus/stm32f413vg.repl',
                    '.qualification/package/platforms/cpus/stm32f4.repl']
          Path('qualification/outputs.json').write_text(json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}, indent=2)+'\n')
          PY_HASH
      - name: Run source and refusal controls
        working-directory: .
        run: node --test --import ./scripts/lib/register-gui-scope.mjs test/bw-sim-renode-lockstep-python.test.mjs test/bw-sim-renode-lockstep-program.test.mjs test/bw-sim-renode-lockstep.test.mjs
      - name: Require real timed and degrees Lab lockstep acceptance
        working-directory: .
        env:
          BW_SIMLAB_REQUIRED: '1'
        run: |
          export BW_RENODE="$GITHUB_WORKSPACE/.qualification/runtime/renode-qualified"
          export BW_SIMLAB_NUTTX_PACKAGE="$GITHUB_WORKSPACE/.qualification/package"
          node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-sim-lab-renode-lockstep.mjs --json qualification/timed.json
          BW_SIMLAB_FORM=degrees node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-sim-lab-renode-lockstep.mjs --json qualification/degrees.json
      - name: Require embedded Python through the actual Lab route
        working-directory: .
        run: |
          export BW_RENODE="$GITHUB_WORKSPACE/.qualification/runtime/renode-qualified"
          export BW_SIMLAB_NUTTX_PACKAGE="$GITHUB_WORKSPACE/.qualification/package"
          node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-sim-lab-python-guest.mjs --json qualification/python.json
      - name: Bound receipt bytes and omit runner locations
        if: always()
        working-directory: .
        run: |
          python3 - <<'PY_BOUND'
          import json
          from pathlib import Path
          for p in Path('qualification').glob('*.json'):
              data = json.loads(p.read_text())
              if p.name in ('timed.json', 'degrees.json'):
                  data.pop('renode', None)
                  data.pop('package', None)
              raw = json.dumps(data, indent=2)+'\n'
              if len(raw.encode()) > 200000:
                  raise SystemExit('qualification receipt exceeds its byte bound')
              p.write_text(raw)
          PY_BOUND
      - name: Retain bounded receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robot-lab-own-firmware-receipts
          path: qualification/*.json
          if-no-files-found: error
          retention-days: 14
