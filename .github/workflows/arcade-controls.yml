name: PXT Arcade controls
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/makecode/**'
      - 'scripts/verify-arcade-controls.mjs'
      - 'scripts/lib/arcade-controls.mjs'
      - 'scripts/lib/pxt-node.mjs'
      - 'scripts/lib/integrated-gui-library.mjs'
      - 'scripts/vendor.mjs'
      - 'scripts/integrate.mjs'
      - 'scripts/apply-vm-overlay.mjs'
      - 'scripts/lib/vm-package-exports.mjs'
      - 'overlay/scratch-vm/src/util/bw-procedure-constraint-model.js'
      - 'packages/scratch-gui/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vendor-pins.json'
      - 'test/ci-workflow-inputs.test.mjs'
      - 'scripts/sync-makecode-runtime.mjs'
      - 'overlay/scratch-gui/src/lib/bw-makecode/pxt-runtime.js'
      - 'test/makecode-arcade-controls.test.mjs'
      - '.github/workflows/arcade-controls.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Layout and ledger contracts
        run: node --test test/makecode-arcade-controls.test.mjs test/target-checkpoint-ledger.test.mjs test/ci-workflow-inputs.test.mjs
      # pxt-node admits the actual integrated GUI libraries and the canonical
      # installed VM model. Prepare that normal package scope before syncing
      # runtime assets; a partial packages/ directory is not an installation.
      - name: Install pinned root package inputs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the owned GUI libraries
        run: node scripts/integrate.mjs
      - name: Install the declared GUI dependencies
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Apply the canonical VM overlay and model exports
        run: node scripts/apply-vm-overlay.mjs
      - name: Sync pinned MakeCode runtimes
        run: node scripts/sync-makecode-runtime.mjs
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/arcade-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/arcade-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual PXT game mouse/touch/keyboard/restart proof
        env:
          BW_PLAYWRIGHT_MODULE: ${{ runner.temp }}/arcade-tools/node_modules/playwright/index.mjs
        run: node scripts/verify-arcade-controls.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pxt-arcade-controls
          path: test-results/arcade-controls/
          if-no-files-found: warn
