# Vendored trees must not rot silently.
#
# The sync scripts have always had --check modes that exit non-zero on
# drift; nothing ran them, which is how the designer's vendored copy
# shipped 41 files behind upstream (the entire retro DIP set missing)
# without any machine noticing. This workflow is the machine that
# notices: on every push AND nightly, clone the upstreams and run every
# check. The nightly matters — upstream can move while lite is idle, and
# a push-only gate would stay green on a stale tree until the next
# unrelated commit.
name: vendor-freshness

on:
  push:
    branches: [main]
    # Same nine top-level prose files build.yml skips, and for the same
    # measured reason: on 2026-08-25 the fleet's ledger pushes starved this
    # workflow's queue so completely that five consecutive runs sat `queued`
    # and never started at all. A run that never starts is not a gate.
    #
    # THE HEADER ABOVE ARGUES FOR RUNNING ON EVERY PUSH. It still holds, and
    # this does not weaken it, because the two reasons it gives are untouched:
    #
    #   the PUSH run is an INTEGRITY gate — does the vendored tree match
    #     vendor-pins.json? Its inputs are vendor-pins.json, overlay/** and
    #     scripts/**. None of the nine names below can change any of them.
    #   the NIGHTLY run is the staleness alarm, and `paths-ignore` narrows only
    #     the `push` trigger. `schedule` is not path-filtered, so upstream
    #     moving while lite is idle is still caught at 04:17 exactly as before.
    #
    # NOT top-level `*.md` and emphatically not `**.md`: sync-examples.mjs
    # --check compares overlay/scratch-gui/examples/** file for file, and that
    # tree contains intro.md, intro.de.md, EXPECTED.md and its OWN README.md /
    # README.de.md — a different file from the repo-root README.md below. Those
    # must keep triggering this workflow, or the vendored gallery can drift in
    # exactly the way the header describes.
    paths-ignore:
      - 'BLOCKED.md'
      - 'BUILD.md'
      - 'CLAUDE.md'
      - 'HANDOFF.md'
      - 'LANES.md'
      - 'MBIT-BUILD.md'
      - 'PLAN.md'
      - 'README.md'
      - 'ROADMAP.md'
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: brickwright-lite
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-circuit-ui
          path: bw-circuit-ui
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-board
          path: bw-board
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/sb3-creator
          path: sb3-creator
          fetch-depth: 0
      # PUSH runs are an INTEGRITY gate: lite's tree must match what it
      # PINS. Comparing against live upstream HEAD made every push red
      # while the fleet was active — freshness-vs-HEAD is the NIGHTLY
      # run's job (the staleness alarm), not a push blocker.
      - name: Pin upstreams to vendor-pins.json (push runs)
        if: github.event_name == 'push'
        run: |
          for repo in bw-circuit-ui bw-board sb3-creator; do
            sha=$(node -e "const p=require('./brickwright-lite/vendor-pins.json'); const v=p['$repo']||p[Object.keys(p).find(k=>k.includes('$repo'))]; console.log((typeof v==='string'?v:v.sha||v.commit||'').trim())")
            if [ -n "$sha" ]; then (cd "$repo" && git checkout -q "$sha" && echo "$repo pinned to $sha") || echo "$repo: pin $sha not found, staying on HEAD"; fi
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Compare against the PINNED upstream commits (vendor-pins.json,
      # written by each forward sync), not whatever HEAD moved to since
      # — upstream advancing must not red lite until a deliberate
      # vendor bump. Missing pin → stay on HEAD.
      - name: Check out pinned upstream commits
        run: |
          for repo in bw-circuit-ui bw-board sb3-creator; do
            pin=$(jq -r --arg r "$repo" '.[$r] // empty' lego/brickwright-lite/vendor-pins.json 2>/dev/null || true)
            [ -z "$pin" ] && pin=$(jq -r --arg r "$repo" '.[$r] // empty' brickwright-lite/vendor-pins.json 2>/dev/null || true)
            if [ -n "$pin" ]; then
              git -C "$repo" fetch --depth 1 origin "$pin" && git -C "$repo" checkout "$pin" \
                || echo "::warning::$repo pin $pin not fetchable — comparing against HEAD"
            fi
          done

      # Each check exits non-zero on drift; run ALL of them even after a
      # failure so one report names every stale tree, then fail once.
      - name: circuit designer tree
        run: node brickwright-lite/scripts/sync-bw-circuit-ui.mjs --check --dir bw-circuit-ui --allow-stale
        if: always()
      - name: board engine tree
        run: node brickwright-lite/scripts/sync-bw-board.mjs --check --dir bw-board --allow-stale
        if: always()
      - name: sb3-creator transpiler
        run: node brickwright-lite/scripts/sync-sb3creator.mjs --check --dir sb3-creator --allow-stale
        if: always()
      - name: examples gallery
        run: node brickwright-lite/scripts/sync-examples.mjs --check --dir sb3-creator --allow-stale
        if: always()
      - name: parts-data sidecars (bw-circuit-ui -> overlay)
        run: node brickwright-lite/scripts/sync-parts-data.mjs --check --dir bw-circuit-ui --allow-stale
        if: always()
      - name: runtime extension gallery content pins
        run: node brickwright-lite/scripts/sync-gallery-pins.mjs --check
        if: always()
