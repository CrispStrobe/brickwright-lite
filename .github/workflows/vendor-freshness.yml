# Vendored trees must not rot silently.
#
# The sync scripts have always had --check modes that exit non-zero on
# drift; nothing ran them, which is how the designer's vendored copy
# shipped 41 files behind upstream (the entire retro DIP set missing)
# without any machine noticing. This workflow is the machine that
# notices: on every push AND nightly, clone the upstreams and run every
# check. The nightly matters — upstream can move while lite is idle, and
# a push-only gate would stay green on a stale tree until the next
# unrelated commit.
name: vendor-freshness

on:
  push:
    branches: [main]
    # Same nine top-level prose files build.yml skips, and for the same
    # measured reason: on 2026-08-25 the fleet's ledger pushes starved this
    # workflow's queue so completely that five consecutive runs sat `queued`
    # and never started at all. A run that never starts is not a gate.
    #
    # THE HEADER ABOVE ARGUES FOR RUNNING ON EVERY PUSH. It still holds, and
    # this does not weaken it, because the two reasons it gives are untouched:
    #
    #   the PUSH run is an INTEGRITY gate — does the vendored tree match
    #     vendor-pins.json? Its inputs are vendor-pins.json, overlay/** and
    #     scripts/**. None of the nine names below can change any of them.
    #   the NIGHTLY run is the staleness alarm, and `paths-ignore` narrows only
    #     the `push` trigger. `schedule` is not path-filtered, so upstream
    #     moving while lite is idle is still caught at 04:17 exactly as before.
    #
    # NOT top-level `*.md` and emphatically not `**.md`: sync-examples.mjs
    # --check compares overlay/scratch-gui/examples/** file for file, and that
    # tree contains intro.md, intro.de.md, EXPECTED.md and its OWN README.md /
    # README.de.md — a different file from the repo-root README.md below. Those
    # must keep triggering this workflow, or the vendored gallery can drift in
    # exactly the way the header describes.
    paths-ignore:
      - 'BLOCKED.md'
      - 'BUILD.md'
      - 'CLAUDE.md'
      - 'HANDOFF.md'
      - 'LANES.md'
      - 'MBIT-BUILD.md'
      - 'PLAN.md'
      - 'README.md'
      - 'ROADMAP.md'
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Do not leave one full upstream checkout/sweep queued for every superseded PR
# commit. Every non-PR run needs its own group: even with cancel-in-progress
# false, GitHub keeps at most one PENDING run in a concurrency group and replaces
# an older pending run when another arrives. That starved twelve push verdicts
# before this was keyed by run id (ROADMAP 2.1).
concurrency:
  group: vendor-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: brickwright-lite
      # Validate all pins together; no partial outputs or fallback to HEAD.
      - name: Read reviewed vendor pins
        id: vendor_pins
        run: node brickwright-lite/scripts/ci-vendor-pins.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-circuit-ui
          ref: ${{ steps.vendor_pins.outputs.bw-circuit-ui }}
          path: bw-circuit-ui
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-board
          ref: ${{ steps.vendor_pins.outputs.bw-board }}
          path: bw-board
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/sb3-creator
          ref: ${{ steps.vendor_pins.outputs.sb3-creator }}
          path: sb3-creator
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Each check exits non-zero on drift; run ALL of them even after a
      # failure so one report names every stale tree, then fail once.
      # SAME MOVE AS THE BOARD-ENGINE STEP BELOW, and for a sharper reason: this
      # one had been telling the truth for thirteen hours and nobody could hear
      # it, because it sat in a workflow that could not pass. It reported
      #
      #     STALE components/CircuitDesigner.jsx
      #     STALE components/ExamplesBrowser.jsx
      #
      # and both were real. What it could not say is whether either was DECLARED,
      # because until 2026-09-07 bw-circuit-ui had no machine-readable manifest --
      # its divergence document was prose, and the prose was wrong in every row:
      # two files it listed as diverging had since been upstreamed and were
      # byte-identical, the one it described as diverging BOTH WAYS was purely
      # lite-ahead, and the largest divergence in the tree was not mentioned at
      # all. A stale count cannot distinguish "someone's deliberate work" from
      # "a sync that half-finished"; only a manifest can, and now there is one.
      #
      # EXIT SEMANTICS: fails if and only if a vendored bw-circuit-ui file differs
      # from upstream at the recorded pin and no manifest entry declares it, or a
      # lite-authored file appears in that root undeclared. 673 files, 668
      # byte-identical, 2 declared-divergent, 3 lite-authored as of 2026-09-07.
      - name: circuit designer tree matches the pin
        if: always()
        run: |
          set -euo pipefail
          pins=brickwright-lite/vendor-pins.json
          [ -f "$pins" ] || pins=lego/brickwright-lite/vendor-pins.json
          pin=$(jq -r '.["bw-circuit-ui"] // empty' "$pins")
          case "$pin" in
            [0-9a-f]*) [ ${#pin} -eq 40 ] || { echo "::error::bw-circuit-ui pin is not a 40-hex sha: $pin"; exit 1; } ;;
            *) echo "::error::no bw-circuit-ui pin in $pins"; exit 1 ;;
          esac
          # Re-read HEAD rather than trust the checkout -- see the board-engine
          # step for why a ::warning:: fallback is not a stop.
          head=$(git -C bw-circuit-ui rev-parse HEAD)
          if [ "$head" != "$pin" ]; then
            echo "::error::bw-circuit-ui is at $head but vendor-pins.json says $pin -- the pinned checkout did not land, so this gate would judge the wrong tree"
            exit 1
          fi
          cd brickwright-lite
          BW_CIRCUIT_UI_DIR="$GITHUB_WORKSPACE/bw-circuit-ui" node --test test/vendor-identity.test.mjs

      # Kept for its per-file STALE listing, which is the fastest way to see WHICH
      # files moved. Not a verdict: it has no notion of the manifest, so it
      # reports declared divergence and undeclared divergence identically.
      - name: circuit designer tree (listing only, not a verdict)
        run: node brickwright-lite/scripts/sync-bw-circuit-ui.mjs --check --dir bw-circuit-ui --allow-stale
        if: always()
        continue-on-error: true
      # THE INTEGRITY CLAIM, and it is the one this workflow's own header makes:
      # "does the vendored tree match vendor-pins.json?". Until 2026-09-07 that
      # question was asked of sync-bw-board.mjs --check, which cannot answer it.
      #
      # MEASURED, because the number is the argument: the last 40 runs of this
      # workflow on main -- thirteen hours -- are 40 failures and no successes,
      # and it was structural in two independent ways. Its exit condition is
      # `wouldDelete || wouldTruncate || absentRefused`, and absentRefused is
      # populated only for files the manifest declares absentByDesign; two exist
      # and upstream has both, so that list is non-empty on every run forever.
      # And both real guards are gated behind `!check`, so under the very flag
      # this step passes, neither wouldDelete nor wouldTruncate can EVER be
      # populated -- verified by halving upstream's board.js and watching --check
      # report DIFFERS and exit 1 for the unrelated reason. A gate that cannot
      # pass and a gate that cannot fail, in one script, on one flag.
      #
      # Worse than useless: the alarms it could not raise are exactly the ones
      # for a sync about to delete lite-only work, which is the accident that
      # lost fifteen files, and they sat behind a permanent red nobody read.
      #
      # So the verdict now comes from the gate that already owns this fact.
      # test/vendor-identity.test.mjs asserts BYTE equality against upstream at
      # the pin and admits a difference only where the manifest names it. One
      # authority; this workflow is a mirror of it rather than a second opinion.
      #
      # EXIT SEMANTICS, stated here so nobody has to reverse-engineer them from a
      # `!check` again: this step fails if and only if a vendored file differs
      # from upstream at the recorded pin and no manifest entry declares it, or a
      # lite-authored file appears in a vendored root undeclared. Declared
      # divergence is the healthy state and is silent.
      - name: board engine tree matches the pin
        if: always()
        run: |
          set -euo pipefail
          pins=brickwright-lite/vendor-pins.json
          [ -f "$pins" ] || pins=lego/brickwright-lite/vendor-pins.json
          pin=$(jq -r '.["bw-board"] // empty' "$pins")
          case "$pin" in
            [0-9a-f]*) [ ${#pin} -eq 40 ] || { echo "::error::bw-board pin is not a 40-hex sha: $pin"; exit 1; } ;;
            *) echo "::error::no bw-board pin in $pins"; exit 1 ;;
          esac
          # Re-read HEAD as an independent check of the exact checkout. A warning
          # is not a stop. This gate means "the tree AT THE PIN"; run against the
          # tip instead and it reports upstream's ordinary progress as undeclared
          # divergence -- lego-b9 measured exactly that against a peer's branch,
          # where the same file went red naming board.js and rp2040-bootrom.js and
          # green at the pin minutes later. Refuse rather than judge from the
          # wrong tree.
          head=$(git -C bw-board rev-parse HEAD)
          if [ "$head" != "$pin" ]; then
            echo "::error::bw-board is at $head but vendor-pins.json says $pin -- the pinned checkout did not land, so this gate would judge the wrong tree"
            exit 1
          fi
          cd brickwright-lite
          BW_BOARD_DIR="$GITHUB_WORKSPACE/bw-board" node --test test/vendor-identity.test.mjs

      # KEPT, AND DELIBERATELY NON-FATAL. Its per-file ok/DIFFERS listing is
      # genuinely useful reading when something is wrong, and its REFUSED lines
      # explain WHAT BREAKS for each declared divergence. But its exit code
      # carries no information for the reasons above, so it must not decide
      # anything. Informational, not a verdict.
      - name: board engine tree (listing only, not a verdict)
        run: node brickwright-lite/scripts/sync-bw-board.mjs --check --dir bw-board --allow-stale
        if: always()
        continue-on-error: true
      # THE TRANSPILER'S CHECK IS SOUND AND ITS ALLOWANCE IS NOT. Unlike the two
      # steps above, sync-sb3creator.mjs --check EXITS 0 on a healthy tree and
      # genuinely verifies its own transform: it flattens src/utils/<name>.js to
      # src/lib/sb3-creator-<name>.js and rewrites the relative imports, and
      # thirteen of the fourteen mapped files match after that rewrite. Byte
      # identity against upstream would be the WRONG question here and would go
      # red on the sync doing exactly what it is for -- which is why this tree
      # is not a third corpus of test/vendor-identity.test.mjs.
      #
      # What it cannot say is which deltas are intended. `--allow-stale`, passed
      # below, makes staleness non-fatal outright, so the permitted set is a
      # COUNT: unbounded, unnamed and unreasoned. It prints "1 intentional
      # downstream file delta(s) allowed" -- and a sync that half-finished and
      # left five would print the same sentence with a 5 in it, the message
      # itself calling the accident intentional.
      #
      # EXIT SEMANTICS: fails if and only if the set of files the sync reports
      # STALE differs from the set declared in
      # docs/VENDOR-DIVERGENCE-SB3-CREATOR.md -- in EITHER direction, so a delta
      # that converges must leave the list rather than sit there forever.
      - name: sb3-creator deltas are the declared ones
        if: always()
        run: |
          set -euo pipefail
          pins=brickwright-lite/vendor-pins.json
          [ -f "$pins" ] || pins=lego/brickwright-lite/vendor-pins.json
          pin=$(jq -r '.["sb3-creator"] // empty' "$pins")
          case "$pin" in
            [0-9a-f]*) [ ${#pin} -eq 40 ] || { echo "::error::sb3-creator pin is not a 40-hex sha: $pin"; exit 1; } ;;
            *) echo "::error::no sb3-creator pin in $pins"; exit 1 ;;
          esac
          # Re-read HEAD rather than trust the checkout -- see the board-engine
          # step for why a ::warning:: fallback is not a stop.
          head=$(git -C sb3-creator rev-parse HEAD)
          if [ "$head" != "$pin" ]; then
            echo "::error::sb3-creator is at $head but vendor-pins.json says $pin -- the pinned checkout did not land, so this gate would judge the wrong tree"
            exit 1
          fi
          cd brickwright-lite
          SB3_CREATOR_DIR="$GITHUB_WORKSPACE/sb3-creator" node --test test/vendor-sb3creator-deltas.test.mjs

      # Kept: it is the thing that verifies the transform, and it passes.
      - name: sb3-creator transpiler
        run: node brickwright-lite/scripts/sync-sb3creator.mjs --check --dir sb3-creator --allow-stale
        if: always()
      - name: examples gallery
        run: node brickwright-lite/scripts/sync-examples.mjs --check --dir sb3-creator --allow-stale
        if: always()
      - name: parts-data sidecars (bw-circuit-ui -> overlay)
        run: node brickwright-lite/scripts/sync-parts-data.mjs --check --dir bw-circuit-ui --allow-stale
        if: always()
      - name: runtime extension gallery content pins
        run: node brickwright-lite/scripts/sync-gallery-pins.mjs --check
        if: always()
      # Report-only: the hosted C/assembler snapshot is pinned to a stc-compiler
      # sha, but the DEPLOYED service can drift from it. This asks the live
      # /health what it actually serves and writes the diff to the job summary.
      # It never fails the run — a network hiccup is "could not compare", and a
      # real difference is a note for a human, not a red build.
      - name: hosted service targets vs snapshot (report only)
        run: node brickwright-lite/scripts/check-hosted-live.mjs
        if: always()
