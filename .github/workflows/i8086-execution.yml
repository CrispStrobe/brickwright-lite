name: 8086 execution profile
on:
  push:
    branches: ['perf/i8086-execution']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 729d496fe25f28b102a7107b8013571226e401dc
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-board
          ref: 42c6316aac92dbc4e90a111c7089fba612c7b615
          path: candidate-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --experimental-default-type=module --test test/i8086-execution-workload.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/profile-i8086-execution.mjs
        env:
          I8086_BASELINE: baseline
          I8086_ENGINE_ROOT: candidate-engine
          I8086_ENGINE_FILES: i8254.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i8086-execution
          path: artifacts/i8086-execution
