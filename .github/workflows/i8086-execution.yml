name: 8086 execution profile
on:
  push:
    branches: ['perf/i8086-execution']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1d849ee9b
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/profile-i8086-execution.mjs
        env:
          I8086_BASELINE: baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i8086-execution
          path: artifacts/i8086-execution
