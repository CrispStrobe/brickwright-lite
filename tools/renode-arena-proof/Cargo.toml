[package]
name = "brickwright-renode-arena-proof"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
command-group = "5"
getrandom = "0.2"
fs2 = "=0.4.3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The proof verifies a large pinned runtime before every launch. Keep SHA-256
# practical in the development harness; all verification and bounds remain on.
[profile.dev]
opt-level = 1
