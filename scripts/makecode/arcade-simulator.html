<!doctype html>
<!--
  The page the MakeCode Arcade simulator (pxt-arcade's sim.js, MIT, Microsoft)
  runs in, served by scripts/sync-makecode-runtime.mjs as
  static/makecode/arcade/sim/simulator.html.

  pxt-arcade ships no simulator page on npm (MakeCode generates it inside its own
  build), so this one is written here. sim.js finds its surfaces by id and class
  name — the ids and classes below are that interface, read off sim.js 4.2.1
  (getElementById / getElementsByClassName); the layout and styling are ours.
  An element sim.js looks up and does not find is a runtime error in the
  simulator, which is how a pxt-arcade bump that adds one shows up.
-->
<html lang="en" data-framework="typescript">
<head>
<meta charset="utf-8">
<title>Arcade simulator</title>
<style>
  :root { --sim-button-fill: #2d2d2d; --sim-button-stroke: #9a9a9a; --sim-dpad-fill: #3a3a3a;
          --sim-text-color: #1f1f1f; --sim-joystick-handle-stroke: #bdbdbd; }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #1c1c1c; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .game-player { position: relative; width: 100%; max-width: 480px; }
  .game-embed { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; }
  #game-screen { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #game-screen.hidden { visibility: hidden; }
  .game-sys-button-group { display: flex; gap: 8px; justify-content: center; padding: 6px; }
  .game-sys-button { font: 12px system-ui, sans-serif; background: #333; color: #ddd; border: 1px solid #555;
                     border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  .game-buttons, .game-joystick { display: none; }      /* touch controls: keyboard is the input here */
  .game-player-background, .game-player-msft { display: none; }
  #debug-stats { position: absolute; top: 0; left: 0; color: #0f0; font: 10px monospace; }
  .no-select { user-select: none; }
</style>
<script src="pxtsim.js"></script>
<script src="common-sim.js"></script>
<script src="sim.js"></script>
</head>
<body id="root">
  <div id="wrap">
    <div class="game-player">
      <div id="debug-stats"></div>
      <div class="game-embed">
        <canvas id="game-screen" class="hidden" tabindex="0" role="application"></canvas>
      </div>
      <div class="game-sys-button-group">
        <button class="game-sys-button game-menu-button no-select">Menu</button>
        <button class="game-sys-button game-reset-button no-select">Reset</button>
      </div>
      <div id="game-buttons-container" class="game-buttons">
        <svg xmlns="http://www.w3.org/2000/svg" class="game-button-svg" viewBox="0 0 40 40" width="160" height="160">
          <circle class="button-b" cx="13" cy="28" r="9" fill="var(--sim-button-fill)" stroke="var(--sim-button-stroke)" stroke-width="2"/>
          <text class="label-b no-select" x="13" y="28" text-anchor="middle" dy="2.5" font-size="8">B</text>
          <circle class="button-a" cx="28" cy="12.5" r="9" fill="var(--sim-button-fill)" stroke="var(--sim-button-stroke)" stroke-width="2"/>
          <text class="label-a no-select" x="28" y="12.5" text-anchor="middle" dy="2.5" font-size="8">A</text>
        </svg>
      </div>
      <div id="joystick-container" class="game-joystick">
        <svg xmlns="http://www.w3.org/2000/svg" class="game-joystick-svg" viewBox="0 0 40 40" width="160" height="160">
          <circle class="joystick-background" cx="20" cy="20" r="16" fill="var(--sim-dpad-fill)"/>
          <rect class="dpad-up" x="16" y="6" width="8" height="12" rx="2" fill="var(--sim-text-color)"/>
          <rect class="dpad-down" x="16" y="22" width="8" height="12" rx="2" fill="var(--sim-text-color)"/>
          <rect class="dpad-right" x="22" y="16" width="12" height="8" ry="2" fill="var(--sim-text-color)"/>
          <rect class="dpad-left" x="6" y="16" width="12" height="8" ry="2" fill="var(--sim-text-color)"/>
          <circle class="joystick-handle" cx="20" cy="20" r="6" fill="var(--sim-button-fill)" stroke="var(--sim-joystick-handle-stroke)" stroke-width="2"/>
        </svg>
      </div>
      <div class="game-player-background"></div>
      <div class="game-player-msft"></div>
    </div>
    <div id="safari-enable-game" style="display: none"></div>
  </div>
</body>
</html>
